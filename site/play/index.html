var Mailbox = {
  tab: 'inbox', openFlag: false, msgs: {}, ntType: 'notice', expanded: {},
  isOpen: function () { return this.openFlag; },
  open: function (tab) {
    Social.close();
    this.tab = tab || 'inbox';
    this.openFlag = true;
    document.getElementById('soc').classList.add('on');
    this.build();
  },
  flushRead: function () { if (this.seenInbox) { this.seenInbox = false; Mail.markRead(); } },
  close: function () {
    if (!this.openFlag) return;
    this.openFlag = false;
    this.flushRead();
    var s = document.getElementById('soc');
    if (s) { s.classList.remove('on'); s.innerHTML = ''; }
  },
  refresh: function () {
    if (!this.openFlag) return;
    var keep = {}, els = document.querySelectorAll('#soc input, #soc textarea');
    for (var i = 0; i < els.length; i++) if (els[i].id) keep[els[i].id] = { v: els[i].value, f: document.activeElement === els[i] };
    this.build();
    for (var k in keep) {
      var el = document.getElementById(k);
      if (!el) continue;
      el.value = keep[k].v;
      if (keep[k].f) el.focus();
    }
  },
  build: function () {
    var self = this, soc = document.getElementById('soc');
    var tabs = [['inbox', MT('tabInbox'), Mail.unread()], ['ask', MT('tabAsk'), 0]];
    if (Mail.admin) { tabs.push(['inq', MT('tabInq'), Mail.openInq()]); tabs.push(['send', MT('tabSend'), 0]); }
    if (!Mail.admin && (this.tab === 'inq' || this.tab === 'send')) this.tab = 'inbox';
    var th = '';
    tabs.forEach(function (t) {
      th += '<button data-t="' + t[0] + '" class="' + (self.tab === t[0] ? 'on' : '') + '">' + esc(t[1]) +
        (t[2] ? '<span class="dot">' + t[2] + '</span>' : '') + '</button>';
    });
    soc.innerHTML = '<div class="sp"><div class="sh"><h3>' + esc(MT('title')) + '</h3><button class="x" data-a="close">✕</button></div>' +
      '<div class="tabs">' + th + '</div><div class="sb" id="mbBody"></div></div>';
    soc.querySelector('[data-a="close"]').onclick = function () { self.close(); };
    var tb = soc.querySelectorAll('[data-t]');
    for (var i = 0; i < tb.length; i++) tb[i].onclick = function () {
      var t = this.getAttribute('data-t');
      if (t !== 'inbox') self.flushRead();
      self.tab = t; self.build();
    };
    var body = document.getElementById('mbBody');
    if (this.tab === 'inbox') this.buildInbox(body);
    else if (this.tab === 'ask') this.buildAsk(body);
    else if (this.tab === 'inq') this.buildInq(body);
    else this.buildSend(body);
    this.buildAdminBar(body);
  },
  on: function (body, sel, fn) { var els = body.querySelectorAll(sel); for (var i = 0; i < els.length; i++) els[i].onclick = fn; },
  msgLine: function (key) {
    var m = this.msgs[key];
    return '<div class="msg ' + (m ? m.c : '') + '">' + esc(m ? m.t : '') + '</div>';
  },

  buildInbox: function (body) {
    var self = this, it = Mail.items(), html = '';
    if (!it.length) html = '<div class="empty">' + esc(MT('empty')) + '</div>';
    for (var i = 0; i < it.length; i++) {
      var m = it[i], unread = !Mail.read[m.id];
      var tag = m.kind === 'reply' ? MT('reply') : (m.kind === 'update' ? MT('update') : MT('notice'));
      var col = m.kind === 'reply' ? 'g' : (m.kind === 'update' ? 'y' : '');
      html += '<div class="mi' + (unread ? ' new' : '') + '">' +
        '<div class="mh"><span class="b ' + col + ' mt">' + esc(tag) + '</span><span class="mtt">' + esc(m.title || '') + '</span>' +
        (unread ? '<span class="nd"></span>' : '') + '</div>' +
        '<div class="md">' + esc(fmtDate(m.ts)) + '</div>' +
        (m.re ? '<div class="mre">' + esc(MT('re')) + ': ' + esc(m.re) + '</div>' : '') +
        '<div class="mb">' + esc(m.body || '') + '</div>' +
        (Mail.admin && m.kind !== 'reply' ? '<button class="b k" data-dn="' + esc(m.id) + '">' + esc(MT('del')) + '</button>' : '') +
        '</div>';
    }
    body.innerHTML = html;
    this.on(body, '[data-dn]', function () { Mail.delNotice(this.getAttribute('data-dn')); });
    /* everything shown counts as read once the panel closes or the tab changes */
    this.seenInbox = true;
  },

  buildAsk: function (body) {
    var self = this, mine = Store.get('myInq', []), html = '';
    html += '<div class="hint" style="margin-bottom:8px">' + esc(MT('askHint')) + '</div>' +
      '<textarea id="askBox" class="ta" maxlength="500" placeholder="' + esc(MT('askPh')) + '"></textarea>' +
      '<button class="go" data-a="ask">' + esc(MT('send')) + '</button>' + this.msgLine('ask');
    if (mine.length) {
      html += '<div class="sec">' + esc(MT('myInq')) + '</div>';
      mine.forEach(function (q) {
        html += '<div class="mi"><div class="md">' + esc(fmtDate(q.ts)) + '</div><div class="mb">' + esc(q.body) + '</div></div>';
      });
    }
    body.innerHTML = html;
    this.on(body, '[data-a="ask"]', function () {
      Mail.sendInquiry(document.getElementById('askBox').value, function (ok, msg) {
        self.msgs.ask = { c: ok ? 'ok' : 'no', t: msg };
        if (ok) document.getElementById('askBox').value = '';
        self.refresh();
      });
    });
  },

  buildInq: function (body) {
    var self = this, list = Mail.inqList(), html = '';
    if (!list.length) html = '<div class="empty">' + esc(MT('noInq')) + '</div>';
    list.forEach(function (q, i) {
      html += '<div class="mi' + (q.ans ? '' : ' new') + '"><div class="mh"><span class="mtt">' + esc(q.nick || q.k) + '</span>' +
        (q.ans ? '<span class="st ok">' + esc(MT('answered')) + '</span>' : '<span class="nd"></span>') + '</div>' +
        '<div class="md">' + esc(fmtDate(q.ts)) + '</div><div class="mb">' + esc(q.body) + '</div>';
      if (!q.ans) {
        html += '<textarea id="rp' + i + '" class="ta sm" maxlength="1000" placeholder="' + esc(MT('replyPh')) + '"></textarea>' +
          '<div class="ip"><button class="b" data-rp="' + i + '">' + esc(MT('replyBtn')) + '</button>' +
          '<button class="b k" data-dq="' + i + '">' + esc(MT('del')) + '</button></div>';
      } else html += '<button class="b k" data-dq="' + i + '">' + esc(MT('del')) + '</button>';
      html += '</div>';
    });
    body.innerHTML = this.msgLine('inq') + html;
    this.on(body, '[data-rp]', function () {
      var i = +this.getAttribute('data-rp');
      Mail.reply(list[i], document.getElementById('rp' + i).value, function (ok, msg) {
        self.msgs.inq = { c: ok ? 'ok' : 'no', t: msg }; self.refresh();
      });
    });
    this.on(body, '[data-dq]', function () { Mail.delInq(list[+this.getAttribute('data-dq')]); });
  },

  buildSend: function (body) {
    var self = this, html = '';
    html += '<div class="modes"><button data-ty="notice" class="' + (this.ntType === 'notice' ? 'on' : '') + '">' + esc(MT('typeNotice')) +
      '</button><button data-ty="update" class="' + (this.ntType === 'update' ? 'on' : '') + '">' + esc(MT('typeUpdate')) + '</button></div>' +
      '<div class="ip"><input id="ntTitle" maxlength="60" placeholder="' + esc(MT('ntTitle')) + '"></div>' +
      '<textarea id="ntBody" class="ta" maxlength="2000" placeholder="' + esc(MT('ntBody')) + '"></textarea>' +
      '<button class="go" data-a="all">' + esc(MT('sendAll')) + '</button>' + this.msgLine('send');
    var sent = Mail.items().filter(function (m) { return m.kind !== 'reply'; });
    if (sent.length) {
      html += '<div class="sec">' + esc(MT('sentList')) + '</div>';
      sent.forEach(function (m) {
        html += '<div class="row"><span class="nm">' + esc(m.title) + '<span class="sub">' +
          esc((m.kind === 'update' ? MT('update') : MT('notice')) + ' · ' + fmtDate(m.ts)) + '</span></span>' +
          '<button class="b k" data-dn="' + esc(m.id) + '">' + esc(MT('del')) + '</button></div>';
      });
    }
    body.innerHTML = html;
    this.on(body, '[data-ty]', function () { self.ntType = this.getAttribute('data-ty'); self.refresh(); });
    this.on(body, '[data-dn]', function () { Mail.delNotice(this.getAttribute('data-dn')); });
    this.on(body, '[data-a="all"]', function () {
      var t = document.getElementById('ntTitle').value, b = document.getElementById('ntBody').value;
      if (!t.trim() || !b.trim()) { self.msgs.send = { c: 'no', t: MT('needTitle') }; self.refresh(); return; }
      if (!window.confirm(MT('confirmAll'))) return;
      Mail.broadcast(self.ntType, t, b, function (ok, msg) {
        self.msgs.send = { c: ok ? 'ok' : 'no', t: msg };
        if (ok) { document.getElementById('ntTitle').value = ''; document.getElementById('ntBody').value = ''; }
        self.refresh();
      });
    });
  },

  /* bottom of every tab: operator status, or the sign-in form */
  buildAdminBar: function (body) {
    var self = this, d = document.createElement('div');
    d.className = 'adm';
    if (Mail.admin) {
      d.innerHTML = '<span class="st ok">' + esc(MT('adminOn')) + '</span> <button class="b k" data-a="out">' + esc(MT('logout')) + '</button>';
      body.appendChild(d);
      d.querySelector('[data-a="out"]').onclick = function () { Mail.logout(); };
      return;
    }
    if (!this.showLogin) {
      d.innerHTML = '<button class="lnk" data-a="showLogin">' + esc(MT('adminLogin')) + '</button>';
      body.appendChild(d);
      d.querySelector('[data-a="showLogin"]').onclick = function () { self.showLogin = true; self.refresh(); };
      return;
    }
    d.innerHTML = '<div class="sec">' + esc(MT('adminLogin')) + '</div>' +
      '<div class="ip"><input id="mbId" maxlength="20" placeholder="' + esc(MT('id')) + '" autocomplete="username"></div>' +
      '<div class="ip"><input id="mbPw" type="password" maxlength="20" placeholder="' + esc(MT('pw')) + '" autocomplete="current-password">' +
      '<input id="mbCode" type="password" maxlength="12" inputmode="numeric" placeholder="' + esc(MT('code')) + '" autocomplete="off"></div>' +
      '<button class="go" data-a="login">' + esc(MT('login')) + '</button>' + this.msgLine('login');
    body.appendChild(d);
    d.querySelector('[data-a="login"]').onclick = function () {
      Mail.login(document.getElementById('mbId').value, document.getElementById('mbPw').value,
        document.getElementById('mbCode').value, function (ok, msg) {
          self.msgs.login = { c: ok ? 'ok' : 'no', t: msg };
          if (ok) { self.showLogin = false; Social.note(msg); }
          self.refresh();
        });
    };
  }
};
Mail.ev.on('change', function () { Mailbox.refresh(); });

var BootScene = new Phaser.Class({
  Extends: Phaser.Scene,
  initialize: function BootScene() { Phaser.Scene.call(this, { key: 'Boot' }); },
  create: function () {
    buildTextures(this);
    SFX.init();
    var el = document.getElementById('boot');
    if (el) { el.classList.add('hide'); setTimeout(function () { el.style.display = 'none'; }, 400); }

    this.scene.start('Menu');
  }
});

/* =====================================================================
   13. MENU SCENE
   ===================================================================== */
var MenuScene = new Phaser.Class({
  Extends: Phaser.Scene,
  initialize: function MenuScene() { Phaser.Scene.call(this, { key: 'Menu' }); },

  create: function () {
    var self = this;
    this.cameras.main.setBackgroundColor(0xeaf3f9);
    this.deco = [];
    this.root = this.add.container(0, 0);

    /* ambient stickmen walking across the menu */
    var keys = ['w_n', 'w_f', 'w_t'];
    for (var i = 0; i < 6; i++) {
      var sp = this.add.sprite(0, 0, 'e_n_0').setAlpha(0.30).setDepth(0);
      sp.play(keys[i % 3]);
      this.deco.push(sp);
    }

    this.bg = this.add.graphics().setDepth(1);
    this.t1 = txt(this, 0, 0, TXT.title1, 44, CS.ink).setOrigin(0.5).setDepth(3);
    this.t2 = txt(this, 0, 0, TXT.title2, 26, CS.cyan).setOrigin(0.5).setDepth(3);
    this.hero = this.add.sprite(0, 0, PTEX(0)).setDepth(3);
    this.hero.play(PANIM());

    this.bestT = txt(this, 0, 0, '', 16, CS.dim, '700').setOrigin(0.5).setDepth(3);
    this.tip = txt(this, 0, 0, TXT.hGoal, 15, CS.ink, '700').setOrigin(0.5).setDepth(3);

    this.startBtn = makeButton(this, 0, 0, 260, 66, TXT.start, function () {
      SFX.resume(); SFX.play('select');
      self.startRun();
    }, { color: C.cyan, size: 24 });
    this.startBtn.setDepth(4);
    this.startT = this.startBtn.label;

    /* party (co-op) and friendly duel both open the social panel */
    this.partyBtn = makeButton(this, 0, 0, 150, 40, TXT.party, function () {
      SFX.resume(); SFX.play('select'); Social.open('party', 'coop');
    }, { color: C.green, size: 15 });
    this.partyBtn.setDepth(4);
    this.brawlBtn = makeButton(this, 0, 0, 150, 40, TXT.brawl, function () {
      SFX.resume(); SFX.play('select'); Social.open('party', 'duel');
    }, { color: C.red, size: 15 });
    this.brawlBtn.setDepth(4);

    this.tierIcon = this.add.image(0, 0, rankTex(Meta.rank)).setDepth(7).setScale(0.5);
    this.tierT = txt(this, 0, 0, '', 13, CS.ink, '900').setOrigin(0, 0.5).setDepth(7);
    this.scT = txt(this, 0, 0, '', 11, CS.dim, '700').setOrigin(0, 0.5).setDepth(7);
    this.promoBtn = makeButton(this, 0, 0, 96, 30, TXT.promoBtn, function () {
      SFX.resume(); SFX.play('select'); self.openPromo();
    }, { color: C.gold, size: 12, textColor: '#16324a' });
    this.promoBtn.setDepth(7);
    this.friendBtn = makeButton(this, 0, 0, 64, 40, TXT.friends, function () {
      SFX.resume(); Social.open('friends');
    }, { color: C.ink, size: 13 });
    this.friendBtn.setDepth(6);
    this.friendDot = this.add.circle(0, 0, 7, C.red).setDepth(7).setVisible(false);

    /* mailbox: notices, updates, replies — red number = unread */
    this.mailBtn = makeIconButton(this, 0, 0, 46, '', function () { SFX.resume(); Mailbox.open('inbox'); });
    this.mailBtn.setDepth(6);
    var env = this.add.graphics();
    env.fillStyle(C.cyan, 1); env.fillRoundedRect(-12, -8, 24, 17, 3);
    env.lineStyle(2.5, 0xffffff, 1);
    env.beginPath(); env.moveTo(-10, -6); env.lineTo(0, 2); env.lineTo(10, -6); env.strokePath();
    this.mailBtn.addAt(env, 1);
    this.mailBadge = this.add.circle(0, 0, 10, C.red).setDepth(7).setVisible(false);
    this.mailBadgeT = txt(this, 0, 0, '', 11, CS.white, '900').setOrigin(0.5).setDepth(8).setVisible(false);
    this.onMail = function () { if (self.scene.isActive()) self.refreshHeader(); };
    Mail.ev.on('change', this.onMail);
    this.events.once('shutdown', function () { Mail.ev.off('change', self.onMail); });

    /* controls hint block */
    this.ctrl = this.add.container(0, 0).setDepth(3);
    this.ctrlBg = this.add.graphics();
    this.ctrl.add(this.ctrlBg);
    var moveLbl = Controls.touch ? TXT.touchMove : TXT.keyMove;
    var atkLbl  = Controls.touch ? TXT.touchAtk  : TXT.keyAtk;
    this.c1 = txt(this, 0, 0, TXT.hMove + '   ' + moveLbl, 14, CS.ink, '700').setOrigin(0.5);
    this.c2 = txt(this, 0, 0, TXT.hAim + '   ' + atkLbl, 14, CS.ink, '700').setOrigin(0.5);
    var jumpLbl  = Controls.touch ? TXT.touchJump  : TXT.keyJump;
    var skillLbl = Controls.touch ? TXT.touchSkill : TXT.keySkill;
    this.c3 = txt(this, 0, 0, TXT.hJump + '   ' + jumpLbl, 14, CS.ink, '700').setOrigin(0.5);
    this.c4 = txt(this, 0, 0, TXT.hSkill + '   ' + skillLbl, 14, CS.gold, '900').setOrigin(0.5);
    this.c5 = txt(this, 0, 0, TXT.hAuto, 14, CS.cyan, '900').setOrigin(0.5);
    this.ctrl.add([this.c1, this.c2, this.c3, this.c4, this.c5]);

    this.sndBtn = makeIconButton(this, 0, 0, 42, SFX.muted ? '\uD83D\uDD07' : '\uD83D\uDD0A', function (b) {
      SFX.setMuted(!SFX.muted); SFX.play('click');
      b.label.setText(SFX.muted ? '\uD83D\uDD07' : '\uD83D\uDD0A');
    });
    this.sndBtn.setDepth(4);

    this.fsBtn = makeIconButton(this, 0, 0, 42, '\u26F6', function () {
      SFX.play('click');
      if (self.scale.isFullscreen) self.scale.stopFullscreen(); else self.scale.startFullscreen();
    });
    this.fsBtn.setDepth(4);
    if (!this.scale.fullscreen.available) this.fsBtn.setVisible(false);

    /* --- account bar: level (top-left), sapphires + shop (top-right) --- */
    this.hdr = this.add.graphics().setDepth(5);
    this.lvT2 = txt(this, 0, 0, '', 16, CS.white, '900').setOrigin(0.5).setDepth(6);
    this.lvlT = txt(this, 0, 0, '', 15, CS.ink, '900').setOrigin(0, 0.5).setDepth(6);
    this.xpT  = txt(this, 0, 0, '', 11, CS.dim, '700').setOrigin(0, 0.5).setDepth(6);
    this.sapT = txt(this, 0, 0, '', 16, CS.gem, '900').setOrigin(1, 0.5).setDepth(6);
    this.shopBtn = makeButton(this, 0, 0, 104, 40, TXT.shop, function () {
      SFX.resume(); SFX.play('select'); self.openShop();
    }, { color: C.gem, size: 15 });
    this.shopBtn.setDepth(6);

    this.rankBtn = makeButton(this, 0, 0, 104, 34, TXT.rank, function () {
      SFX.resume(); SFX.play('select'); self.openRank();
    }, { color: C.gold, size: 13, textColor: '#16324a' });
    this.rankBtn.setDepth(6);

    this.upBtn = makeButton(this, 0, 0, 104, 34, TXT.upgrade, function () {
      SFX.resume(); SFX.play('select'); self.openUpgrade();
    }, { color: C.green, size: 13 });
    this.upBtn.setDepth(6);


    this.refreshHeader();
    adPanel(true);          /* ad is visible on the menu only */
    /* route the no-network fallback through this scene's countdown panel */
    Ads.fallback = function (cb) { self.adCountdown(cb); };
    this.events.once('shutdown', function () {
      Ads.fallback = function (cb) { cb(false); };
      adPanel(false);       /* never on screen during a run */
    });

    var free = function () { return !self.shopUI && !self.rankUI && !self.upUI && !self.promoUI && !Social.isOpen() && !Mailbox.isOpen(); };
    this.input.keyboard.on('keydown-ENTER', function () { if (free()) self.startRun(); });
    this.input.keyboard.on('keydown-SPACE', function () { if (free()) self.startRun(); });
    this.input.keyboard.on('keydown-ESC', function () { self.closeShop(); self.closeRank(); self.closeUpgrade(); self.closePromo(); });

    /* party state drives the start button label */
    this.onNet = function () { if (self.scene.isActive()) self.refreshHeader(); };
    Net.ev.on('room', this.onNet); Net.ev.on('reqs', this.onNet); Net.ev.on('inbox', this.onNet);
    this.events.once('shutdown', function () {
      Net.ev.off('room', self.onNet); Net.ev.off('reqs', self.onNet); Net.ev.off('inbox', self.onNet);
    });
    Net.setStatus('menu');
    Net.refreshMe();
    Social.menuReady();
    if (Meta.seasonReset) { Meta.seasonReset = false; this.time.delayedCall(400, function () { self.toastMsg(TXT.seasonReset, CS.cyan); }); }

    this.layout();
    this.scale.on('resize', this.layout, this);
    this.events.once('shutdown', function () { self.scale.off('resize', self.layout, self); });

    this.tweens.add({ targets: this.t1, scale: { from: 0.9, to: 1 }, duration: 420, ease: 'Back.out' });
  },

  /* solo run, or (host) start the party's co-op run */
  startRun: function () {
    if (Net.inParty()) {
      if (!Net.isHost()) { this.toastMsg(TXT.waitHost, CS.dim); return; }
      if (Net.room.mode === 'duel') { Social.open('party', 'duel'); return; }
      Social.startCoop();
      return;
    }
    this.scene.start('Game');
  },

  refreshHeader: function () {
    this.tierIcon.setTexture(rankTex(Meta.rank));
    this.tierT.setText(rankName(Meta.rank));
    this.scT.setText(TXT.sc + ' ' + Meta.score() + '  (' + (Meta.kills % 100) + '/100)');
    if (this.startBtn) {
      var lbl = TXT.start;
      if (Net.inParty()) lbl = Net.isHost() ? (Net.room.mode === 'duel' ? TXT.brawl : TXT.partyStart) : TXT.waitHost;
      this.startBtn.label.setText(lbl).setFontSize(lbl.length > 10 ? 17 : 24);
    }
    if (this.mailBadge) {
      var nb = Mail.badge();
      this.mailBadge.setVisible(nb > 0); this.mailBadgeT.setVisible(nb > 0).setText(nb > 99 ? '99+' : String(nb));
    }
    if (this.friendDot) this.friendDot.setVisible(Object.keys(Net.reqs || {}).length > 0 || Object.keys(Net.inbox || {}).length > 0);
    this.lvT2.setText(String(Meta.lvl));
    this.lvlT.setText(Meta.nick || (TXT.accLv + '.' + Meta.lvl));
    if (Mail.admin) this.lvlT.setText((Meta.nick || '') + '  \u00b7  ' + (LANG === 'ko' ? '운영자' : 'OPERATOR')).setColor(CS.red);
    else this.lvlT.setColor(CS.ink);
    this.xpT.setText(TXT.accLv + '.' + Meta.lvl + '   ' + Meta.xp + ' / ' + Meta.need(Meta.lvl));
    this.sapT.setText('\u25c6 ' + Meta.sap.toLocaleString());
  },


  /* ---------------- PROMOTION TRIAL ---------------- */
  openPromo: function () {
    if (this.promoUI) return;
    this.closeShop(); this.closeRank(); this.closeUpgrade();
    var self = this, w = this.scale.width, h = this.scale.height;
    var dim = this.add.rectangle(w / 2, h / 2, w * 2, h * 2, 0x0d1f2e, 0.74).setDepth(1000).setInteractive();
    var pw = Math.min(400, w - 20), ph = 440;   /* fixed design size; the container scales to fit */
    var c = this.add.container(w / 2, h / 2).setDepth(1001);
    c.setScale(Math.min(1, (h - 12) / ph, (w - 12) / pw));
    var bg = this.add.graphics();
    bg.fillStyle(0xffffff, 0.98); bg.fillRoundedRect(-pw / 2, -ph / 2, pw, ph, 22);
    c.add(bg);
    var top = -ph / 2, r = Meta.rank, chk = promoCheck(r, Meta.score());
    c.add(txt(this, 0, top + 30, TXT.promoTitle, 21, CS.ink).setOrigin(0.5));
    c.add(txt(this, 0, top + 52, TXT.season + ' ' + Meta.season, 12, CS.dim, '700').setOrigin(0.5));

    /* current -> next */
    var nx = Math.min(RANK_MAX, Math.max(0, r + 1));

    bg.fillRoundedRect(-pw / 2, -ph / 2, pw, ph, 22);

    var top = -ph / 2;
    c.add(txt(this, 0, top + 30, TXT.upTitle, 20, CS.ink).setOrigin(0.5));
    c.add(txt(this, pw / 2 - 18, top + 30, '\u25c6 ' + Meta.sap.toLocaleString(), 14, CS.gem, '900')
      .setOrigin(1, 0.5));

    var rowH = (listBot - listTop) / UPGRADES.length;

    for (var i = 0; i < UPGRADES.length; i++) {
      (function (def, idx) {

        var lv = Meta.upLv(def.id);
        var maxed = lv >= def.max;
        var cost = upCost(def, lv);
        var afford = Meta.sap >= cost;

        var row = self.add.graphics();
        row.fillStyle(0xf2f7fb, 1);
        row.fillRoundedRect(-pw / 2 + 16, y - rowH / 2 + 3, pw - 32, rowH - 6, 12);
        /* level progress strip */
        row.fillStyle(C.green, 0.85);
        row.fillRect(-pw / 2 + 16, y + rowH / 2 - 9, (pw - 32) * (lv / def.max), 3);
        c.add(row);

        c.add(txt(self, -pw / 2 + 30, y - 12,
          (LANG === 'ko' ? def.nameKo : def.name) + '   ' + TXT.upLvl + '.' + lv,
          15, CS.ink, '900').setOrigin(0, 0.5));
        c.add(txt(self, -pw / 2 + 30, y + 9,
          LANG === 'ko' ? def.descKo : def.desc, 12, CS.dim, '700').setOrigin(0, 0.5));

        var label = maxed ? TXT.upMax : '\u25c6 ' + cost.toLocaleString();
        var btn = makeButton(self, pw / 2 - 68, y, 108, rowH - 18, label, function () {
          if (maxed) { SFX.play('click'); return; }
          if (Meta.buyUp(def)) {
            SFX.play('levelup');
            self.closeUpgrade(); self.openUpgrade(); self.refreshHeader();
          } else {
            SFX.play('click');
          }
        }, { color: maxed ? C.green : (afford ? C.gem : 0x9fb3c4), size: 13 });
        c.add(btn);
      })(UPGRADES[i], i);

      SFX.play('click'); self.closeUpgrade();

      .setOrigin(0.5).setPosition(w / 2, h / 2).setDepth(1000).setInteractive();

    bg.fillRoundedRect(-pw / 2, -ph / 2, pw, ph, 22);
    c.add(bg);

    var top = -ph / 2;
    c.add(txt(this, 0, top + 30, TXT.shop, 24, CS.ink).setOrigin(0.5));
    var sapLbl = txt(this, pw / 2 - 18, top + 30, '\u25c6 ' + Meta.sap.toLocaleString(), 15, CS.gem, '900')

    var tw = (pw - 40) / 4;
    for (var t = 0; t < 4; t++) {
      (function (idx) {

        var tb = self.add.rectangle(bx, top + 68, tw - 6, 34,

          .setOrigin(0.5).setInteractive({ useHandCursor: true });
        var tt = txt(self, bx, top + 68, tabs[idx], 11, on ? CS.white : CS.dim, '900').setOrigin(0.5);

        });

      })(t);
    }

    /* ---------- FREE tab ---------- */
    if (this.shopTab === 3) {
      var left = Meta.adLeft();
      /* everything below is spaced from the space actually available, so
         the WATCH button can never end up underneath CLOSE on a short
         screen (that was why it looked unclickable) */
      var fTop = top + 96, fBot = ph / 2 - 70;   /* 70 = close button band */
      var span = fBot - fTop;
      var yTitle = fTop + span * 0.08;
      var yDesc  = fTop + span * 0.24;
      var yGem   = fTop + span * 0.46;
      var yInfo  = fTop + span * 0.70;
      var yBtn   = fTop + span * 0.88;
      var gemR   = Math.min(34, span * 0.16);

      c.add(txt(this, 0, yTitle, TXT.freeTitle, 19, CS.ink).setOrigin(0.5));
      c.add(txt(this, 0, yDesc, TXT.freeDesc, 13, CS.dim, '700').setOrigin(0.5));

      var gem = this.add.graphics();
      gem.fillStyle(C.gem, 1);
      gem.fillRoundedRect(-gemR, yGem - gemR, gemR * 2, gemR * 2, gemR * 0.32);
      c.add(gem);
      c.add(txt(this, 0, yGem, '500', Math.max(15, gemR * 0.62), CS.white, '900').setOrigin(0.5));

      c.add(txt(this, 0, yInfo,
        TXT.leftToday + '  ' + left + ' / ' + CFG.AD_MAX +
        (Ads.hasNetwork() ? '' : '   (' + CFG.AD_FALLBACK_SEC + 's)'),
        13, CS.dim, '900').setOrigin(0.5));

      var watchBtn = makeButton(this, 0, yBtn, pw - 110, Math.min(52, span * 0.2),
        left > 0 ? TXT.watch : TXT.comeBack, function () {
          if (Meta.adLeft() <= 0) { SFX.play('click'); return; }
          SFX.play('select');
          self.playAdForSapphires();
        }, { color: left > 0 ? C.green : 0x9fb3c4, size: 17 });
      c.add(watchBtn);

      var cb0 = makeButton(this, 0, ph / 2 - 34, pw - 60, 44, TXT.close, function () {
        SFX.play('click'); self.closeShop();
      }, { color: C.ink, size: 15 });
      c.add(cb0);
      this.shopUI = [dim, c];
      return;
    }

    /* ---------- CASES tab ---------- */
    if (this.shopTab === 1) {
      var cTop = top + 96, cBot = ph / 2 - 66, cs = cBot - cTop;

      /* the case itself */
      var box = this.add.graphics();
      box.fillStyle(0x1d3f5c, 1);
      box.fillRoundedRect(-46, cTop + cs * 0.04, 92, 74, 14);
      box.fillStyle(C.gold, 1);
      box.fillRect(-46, cTop + cs * 0.04 + 30, 92, 12);
      c.add(box);
      c.add(txt(this, 0, cTop + cs * 0.30, TXT.caseName, 17, CS.ink).setOrigin(0.5));
      c.add(txt(this, 0, cTop + cs * 0.30 + 22, TXT.caseDesc, 12, CS.dim, '700').setOrigin(0.5));
      c.add(txt(this, 0, cTop + cs * 0.30 + 44,
        TXT.held + '  ' + Meta.cases, 14, CS.gem, '900').setOrigin(0.5));

      c.add(makeButton(this, -pw / 4 + 8, cTop + cs * 0.66, pw / 2 - 28, 46,
        '\u25c6 ' + CFG.CASE_COST.toLocaleString(), function () {
          if (Meta.sap < CFG.CASE_COST) { SFX.play('click'); return; }
          Meta.sap -= CFG.CASE_COST; Meta.cases++; Meta.save();
          SFX.play('select'); self.closeShop(); self.openShop();
        }, { color: C.gem, size: 15 }));

      c.add(makeButton(this, pw / 4 - 8, cTop + cs * 0.66, pw / 2 - 28, 46,
        TXT.openCase, function () {
          if (Meta.cases <= 0) { SFX.play('click'); return; }
          self.rollCase();
        }, { color: Meta.cases > 0 ? C.green : 0x9fb3c4, size: 15 }));

      /* legendary bundle */
      c.add(makeButton(this, 0, cTop + cs * 0.93, pw - 60, 44,
        Meta.legend ? TXT.unlocked : TXT.bundle + '   \u25c6 ' + CFG.BUNDLE_COST.toLocaleString(),
        function () {
          if (Meta.legend) { SFX.play('click'); return; }
          if (Meta.sap < CFG.BUNDLE_COST) { SFX.play('click'); return; }
          Meta.sap -= CFG.BUNDLE_COST; Meta.cases += 5; Meta.legend = true; Meta.save();
          SFX.play('levelup'); self.closeShop(); self.openShop();
          self.toastMsg(TXT.unlocked, CS.gold);
        }, { color: Meta.legend ? C.green : C.gold, size: 13,
             textColor: Meta.legend ? '#ffffff' : '#16324a' }));
      if (!Meta.legend) {
        c.add(txt(this, 0, cTop + cs * 0.93 + 30, TXT.bundleDesc, 11, CS.dim, '700').setOrigin(0.5));
      }

      var cb1 = makeButton(this, 0, ph / 2 - 34, pw - 60, 44, TXT.close, function () {
        SFX.play('click'); self.closeShop();
      }, { color: C.ink, size: 15 });
      c.add(cb1);
      this.shopUI = [dim, c];
      return;
    }

    /* rows */
    var list = this.shopTab === 0 ? SKINS : STARTERS;
    var rowH = Math.min(58, (ph - 190) / Math.max(list.length, 1));
    var y0 = top + 104;

    for (var i = 0; i < list.length; i++) {
      (function (item, idx) {
        var y = y0 + idx * rowH + rowH / 2;
        var owned = Meta.owns(item.id);
        var eq = (self.shopTab === 0 && Meta.skin === item.id) ||
                 (self.shopTab === 2 && Meta.start === item.id);

        var row = self.add.graphics();
        row.fillStyle(eq ? 0xd8f3fb : 0xf2f7fb, 1);
        row.fillRoundedRect(-pw / 2 + 18, y - rowH / 2 + 3, pw - 36, rowH - 6, 12);
        c.add(row);

        /* swatch / preview */
        var sw = self.add.graphics();
        var col = self.shopTab === 0 ? item.body : C.cyan;
        sw.fillStyle(col, 1);
        sw.fillRoundedRect(-pw / 2 + 30, y - 13, 26, 26, 8);
        c.add(sw);
        if (self.shopTab === 2) {
          c.add(txt(self, -pw / 2 + 43, y, item.id.charAt(0).toUpperCase(), 14, CS.white, '900').setOrigin(0.5));
        }

        var nm = self.shopTab === 2
          ? wName(item.id)
          : (LANG === 'ko' ? item.nameKo : item.name);
        c.add(txt(self, -pw / 2 + 70, y, nm, 15, CS.ink, '700').setOrigin(0, 0.5));

        var label, colr;
        if (eq)          { label = TXT.equipped; colr = C.green; }
        else if (owned)  { label = TXT.equip;    colr = C.cyan; }
        else             { label = '\u25c6 ' + item.cost.toLocaleString(); colr = C.gem; }

        var btn = makeButton(self, pw / 2 - 76, y, 118, rowH - 16, label, function () {
          if (eq) return;
          if (owned) {
            SFX.play('select');
            if (self.shopTab === 0) Meta.skin = item.id;
            else Meta.start = item.id;
            Meta.save();
            self.closeShop(); self.openShop();
            self.hero.setTexture(PTEX(0)); self.hero.play(PANIM());
          } else if (Meta.buy(item.id, item.cost)) {
            SFX.play('levelup');
            self.closeShop(); self.openShop(); self.refreshHeader();
          } else {
            SFX.play('click');
            sapLbl.setText(TXT.noSap).setColor(CS.red);
          }
        }, { color: colr, size: 13, textColor: eq ? '#ffffff' : '#ffffff' });
        c.add(btn);
      })(list[i], i);
    }

    var cb = makeButton(this, 0, ph / 2 - 38, pw - 60, 46, TXT.close, function () {
      SFX.play('click'); self.closeShop();
    }, { color: C.ink, size: 16 });
    c.add(cb);

    this.shopUI = [dim, c];
  },

  /* claim flow: ask the ad adapter, then credit only on success */

        if (Meta.adClaim()) {

  toastMsg: function (msg, color) {
    var t = txt(this, this.scale.width / 2, this.scale.height * 0.16, msg, 18, color, '900')
      .setOrigin(0.5).setDepth(1200);
    this.tweens.add({
      targets: t, y: t.y - 26, alpha: 0, duration: 1600, delay: 500,
      onComplete: function () { t.destroy(); }
    });
  },

  /* countdown panel used when no rewarded-ad network is connected */
  adCountdown: function (cb) {
    var self = this, w = this.scale.width, h = this.scale.height;
    var left = CFG.AD_FALLBACK_SEC;

    var dim = this.add.rectangle(w / 2, h / 2, w * 2, h * 2, 0x0d1f2e, 0.86)
      .setDepth(1300).setInteractive();
    var lbl = txt(this, w / 2, h / 2 - 26, TXT.adWait, 20, CS.white, '900')
      .setOrigin(0.5).setDepth(1301);
    var num = txt(this, w / 2, h / 2 + 26, String(left), 46, CS.white, '900')
      .setOrigin(0.5).setDepth(1301);

    var done = function (ok) {
      if (self.adTick) { self.adTick.remove(); self.adTick = null; }
      dim.destroy(); lbl.destroy(); num.destroy();
      if (self.adSkip) { self.adSkip.destroy(); self.adSkip = null; }
      cb(ok);
    };

    this.adSkip = makeButton(this, w / 2, h / 2 + 96, 150, 42, TXT.close, function () {
      done(false);
    }, { color: C.ink, size: 14 });
    this.adSkip.setDepth(1301);

    this.adTick = this.time.addEvent({
      delay: 1000, repeat: left - 1,
      callback: function () {
        left--;
        num.setText(String(left));
        if (left <= 0) done(true);
      }
    });
  },

  /* ---- case opening: a spinning reel that decelerates onto the prize ---- */
  rollCase: function () {
    if (this.rolling) return;
    var self = this, w = this.scale.width, h = this.scale.height;
    var prize = Meta.openCase();
    if (!prize) return;
    this.rolling = true;
    this.closeShop();

    var dim = this.add.rectangle(w / 2, h / 2, w * 2, h * 2, 0x0d1f2e, 0.9)
      .setDepth(1300).setInteractive();
    var cy = h / 2;

    /* build the reel: random skins with the prize planted near the end */
    var CW = 118, N = 26, items = [];
    for (var i = 0; i < N; i++) {
      items.push(i === N - 4 ? prize : TRAILS[Math.floor(Math.random() * TRAILS.length)]);
    }

    var reel = this.add.container(w / 2, cy).setDepth(1301);
    for (i = 0; i < N; i++) {
      var it = items[i], rr = RARITY[it.r];
      var g = this.add.graphics();
      g.fillStyle(0xffffff, 1);
      g.fillRoundedRect(i * CW + 6, -52, CW - 12, 104, 14);
      g.fillStyle(rr.col, 1);
      g.fillRoundedRect(i * CW + 6, 30, CW - 12, 22, 8);
      g.fillStyle(it.tint, 1);
      g.fillRoundedRect(i * CW + CW / 2 - 22, -34, 44, 44, 12);
      reel.add(g);
      reel.add(txt(this, i * CW + CW / 2, 41, LANG === 'ko' ? rr.nameKo : rr.name,
        11, '#ffffff', '900').setOrigin(0.5));
    }

    /* mask so only the window is visible */
    var winW = Math.min(w - 40, 460);
    var maskG = this.make.graphics({ x: 0, y: 0, add: false });
    maskG.fillRect(w / 2 - winW / 2, cy - 60, winW, 120);
    reel.setMask(maskG.createGeometryMask());

    var frame = this.add.graphics().setDepth(1302);
    frame.lineStyle(4, C.gold, 1);
    frame.strokeRoundedRect(w / 2 - winW / 2, cy - 62, winW, 124, 16);
    frame.fillStyle(C.gold, 1);
    frame.fillTriangle(w / 2 - 10, cy - 74, w / 2 + 10, cy - 74, w / 2, cy - 60);

    /* start off to the right, slide until the prize sits under the marker */
    var startX = w / 2 + winW / 2;
    var endX = w / 2 - ((N - 4) * CW + CW / 2);
    reel.x = startX;

    var tickAcc = 0;
    var tw = this.tweens.add({
      targets: reel, x: endX, duration: 3600, ease: 'Cubic.Out',
      onUpdate: function () {
        tickAcc++;
        if (tickAcc % 4 === 0) SFX.play('click');
      },
      onComplete: function () {
        SFX.play('levelup');
        self.cameras.main.flash(220, 255, 240, 200);
        var rr = RARITY[prize.r];

/* =====================================================================
   14. UI HELPERS (buttons used by Menu + UI scenes)
   ===================================================================== */
function makeButton(scene, x, y, w, h, label, cb, opt) {
  opt = opt || {};
  var col = opt.color === undefined ? C.cyan : opt.color;
  var c = scene.add.container(x, y);
  var g = scene.add.graphics();
  var draw = function (fill) {
    g.clear();
    g.fillStyle(shade(col, -0.28), 1);
    g.fillRoundedRect(-w / 2, -h / 2 + 5, w, h, 14);
    g.fillStyle(fill, 1);
    g.fillRoundedRect(-w / 2, -h / 2, w, h, 14);
  };
  draw(col);
  var t = scene.add.text(0, 0, label, {
    fontFamily: FONT, fontSize: (opt.size || Math.round(h * 0.38)) + 'px',
    color: opt.textColor || '#ffffff', fontStyle: '900'
  }).setOrigin(0.5);
  c.add([g, t]);
  var z = scene.add.zone(0, 0, w, h).setOrigin(0.5).setInteractive({ useHandCursor: true });
  c.add(z);
  z.on('pointerover', function () { draw(shade(col, 0.10)); });
  z.on('pointerout', function () { draw(col); t.setY(0); });
  z.on('pointerdown', function () { SFX.play('click'); t.setY(3); draw(shade(col, -0.08)); Controls.uiBlock = true; });
  z.on('pointerup', function () { t.setY(0); draw(col); Controls.uiBlock = false; if (cb) cb(c); });
  z.on('pointerupoutside', function () { t.setY(0); draw(col); Controls.uiBlock = false; });
  c.label = t; c.zone = z;
  return c;
}

function makeIconButton(scene, x, y, size, icon, cb) {
  var c = scene.add.container(x, y);
  var g = scene.add.graphics();
  g.fillStyle(0xffffff, 0.9);
  g.fillRoundedRect(-size / 2, -size / 2, size, size, 12);
  g.lineStyle(3, C.grid, 1);
  g.strokeRoundedRect(-size / 2, -size / 2, size, size, 12);
  var t = scene.add.text(0, 1, icon, {
    fontFamily: FONT, fontSize: Math.round(size * 0.48) + 'px', color: CS.ink, fontStyle: '900'
  }).setOrigin(0.5);
  c.add([g, t]);
  var z = scene.add.zone(0, 0, size, size).setOrigin(0.5).setInteractive({ useHandCursor: true });
  c.add(z);
  z.on('pointerdown', function () { c.setScale(0.92); Controls.uiBlock = true; });
  z.on('pointerup', function () { c.setScale(1); Controls.uiBlock = false; if (cb) cb(c); });
  z.on('pointerupoutside', function () { c.setScale(1); Controls.uiBlock = false; });
  c.label = t; c.zone = z;
  return c;
}


/* =====================================================================
   15. GAME SCENE  —  the survival run
   ---------------------------------------------------------------
   Every stickman is a "pawn" ({sprite, stats, weapons, st...}). Solo
   play has one pawn. In a co-op party this scene runs on the HOST and
   simulates the whole world: enemies, every pawn's weapons, gems, hits.
   Guests run GuestScene, which only moves its own stickman and mirrors
   what the host sends (see the NET section at the bottom).

   Weapon code in section 9 talks to `s.player`, `s.stats`, `s.weapons`;
   withPawn() points those at one pawn while its weapons fire, so the
   original single-player weapon code works unchanged for every player.
   ===================================================================== */
var RESPAWN_MS = 8000;
var CHOOSE_MS = 10000;          /* party level-up: auto-pick after this */
var SNAP_MS = 125;              /* host -> guest snapshot rate (8 Hz) */
var VIEW_R = 720;               /* only things this close to a guest are sent */
var ETYPE_IDX = { n: 0, f: 1, t: 2, b: 3 };
var ETYPE_KEY = ['n', 'f', 't', 'b'];

function skinTex(skin, f) { return 'p_' + (find(SKINS, skin) ? skin : 'ink') + '_' + f; }
function skinAnim(skin) { return 'w_' + (find(SKINS, skin) ? skin : 'ink'); }
function localPawnData() {
  return {
    key: Net.k || 'me', nick: Meta.nick || 'ME', skin: Meta.skin,
    up: { hp: Meta.upLv('hp'), dmg: Meta.upLv('dmg'), spd: Meta.upLv('spd'), mag: Meta.upLv('mag') },
    start: Meta.start, eq: Meta.eq || {}
  };
}
/* spawn spot by party order: host centre, then right, then left */
function spawnSpot(i) {
  return { x: CFG.ARENA_W / 2 + (i === 1 ? 74 : (i === 2 ? -74 : 0)), y: CFG.ARENA_H / 2 };
}
function buildArenaInto(scene) {
  scene.add.tileSprite(0, 0, CFG.ARENA_W, CFG.ARENA_H, 'tile').setOrigin(0).setDepth(0);
  var g = scene.add.graphics().setDepth(1);
  g.lineStyle(14, C.border, 1);
  g.strokeRect(7, 7, CFG.ARENA_W - 14, CFG.ARENA_H - 14);
  g.lineStyle(4, C.cyanLt, 0.7);
  g.strokeRect(20, 20, CFG.ARENA_W - 40, CFG.ARENA_H - 40);
  scene.obstacles = scene.physics.add.staticGroup();
  var spots = [
    [300, 300], [1200, 300], [300, 1200], [1200, 1200],
    [750, 220], [750, 1280], [220, 750], [1280, 750],
    [520, 560], [980, 940], [980, 560], [520, 940]
  ];
  for (var i = 0; i < spots.length; i++) scene.obstacles.create(spots[i][0], spots[i][1], 'rock').setDepth(6);
}
/* bank a finished run into the account (both host and guests use this) */
function bankRun(score, sap, kills, ms) {
  var lvUp;
  if (score < CFG.DEMOTE_SCORE && Meta.lvl > 1) { Meta.lvl--; Meta.xp = 0; lvUp = -1; }
  else lvUp = Meta.addXp(Math.round(score * 0.35) + kills * 2);
  Meta.addSap(sap);
  Meta.save();
  Rank.submit(Meta.nick, score, ms);
  var best = Store.get('best', 0), isBest = score > best;
  if (isBest) Store.set('best', score);
  Store.set('bestTime', Math.max(Store.get('bestTime', 0), ms));
  return { lvUp: lvUp, best: Math.max(best, score), isBest: isBest };
}

var GameScene = new Phaser.Class({
  Extends: Phaser.Scene,
  initialize: function GameScene() { Phaser.Scene.call(this, { key: 'Game' }); },

  init: function (data) {
    this.party = !!(data && data.party && Net.isHost());
  },

  /* ---------- lifecycle ---------- */
  create: function () {
    var self = this;
    this.cameras.main.setBackgroundColor(C.out);
    adPanel(false);
    Net.setStatus('game');

    this.state = {
      time: 0, over: false, victory: false, endless: false, paused: false,
      bossIndex: 0, revived: false
    };
    this.spawnAcc = 0; this.waveAcc = 0; this.scoreAcc = 0; this.saveAcc = 0;
    this.boss = null; this.nid = 1;

    buildArenaInto(this);
    this.createGroups();
    this.createFx();

    this.pawns = [];
    this.me = this.addPawn(localPawnData(), true, 0);
    this.withPawn(this.me, null);
    if (this.party) this.setupParty();
    this.createInput();

    this.physics.world.setBounds(0, 0, CFG.ARENA_W, CFG.ARENA_H);
    this.physics.add.collider(this.enemies, this.obstacles, null, function (e) { return !e.isBoss; }, this);
    this.physics.add.overlap(this.bullets, this.enemies, this.onBulletHit, null, this);

    var cam = this.cameras.main;
    cam.setBounds(0, 0, CFG.ARENA_W, CFG.ARENA_H);
    cam.startFollow(this.me.sprite, true, 0.12, 0.12);
    this.applyZoom();

    this.scale.on('resize', this.applyZoom, this);
    this.events.once('shutdown', function () {
      self.scale.off('resize', self.applyZoom, self);
      self.teardownParty();
      Meta.save();
    });

    this.scene.launch('UI', { gs: 'Game' });

    CG.gameplayStart();
  },

  applyZoom: function () {
    var w = this.scale.width, h = this.scale.height;
    var z = Phaser.Math.Clamp(Math.min(w / 820, h / 620), 0.60, 2.0);
    this.cameras.main.setZoom(z);
  },

  createGroups: function () {
    this.enemies = this.physics.add.group({ classType: Enemy, maxSize: CFG.MAX_ENEMIES + 40, runChildUpdate: false });
    this.bullets = this.physics.add.group({ classType: Bullet, maxSize: 320, runChildUpdate: false });
    this.gems = this.add.group({ maxSize: 320 });
    this.drops = this.add.group({ maxSize: 40 });
  },

  createFx: function () {
    this.hitFx = this.add.particles(0, 0, 'spark', {
      speed: { min: 60, max: 220 }, lifespan: 320, quantity: 1,
      scale: { start: 0.9, end: 0 }, emitting: false
    }).setDepth(30);
    this.deathFx = this.add.particles(0, 0, 'spark', {
      speed: { min: 90, max: 300 }, lifespan: 480, quantity: 1,
      scale: { start: 1.3, end: 0 }, emitting: false
    }).setDepth(30);
    this.floaters = [];
    for (var i = 0; i < 18; i++) {
      var t = this.add.text(0, 0, '', {
        fontFamily: FONT, fontSize: '17px', color: '#ffffff', fontStyle: '900',
        stroke: '#16324a', strokeThickness: 4
      }).setOrigin(0.5).setDepth(40).setVisible(false);
      t.life = 0;
      this.floaters.push(t);
    }
    this.fIdx = 0;
  },

  createInput: function () {
    this.keys = this.input.keyboard.addKeys({
      up: 'W', down: 'S', left: 'A', right: 'D',
      up2: 'UP', down2: 'DOWN', left2: 'LEFT', right2: 'RIGHT'
    });
    var self = this;
    this.input.keyboard.on('keydown-SPACE', function (ev) {
      if (ev.preventDefault) ev.preventDefault();
      self.startJump();
    });
    this.input.keyboard.on('keydown-R', function () { self.useSkill(); });
  },

  /* ---------- pawns ---------- */
  addPawn: function (d, local, order) {
    var up = d.up || {};
    var baseHp = 100 + (up.hp || 0) * 20;
    var p = {
      key: d.key, nick: d.nick, skin: d.skin || 'ink', eq: d.eq || {}, local: local,
      stats: {
        maxHp: baseHp, hp: baseHp,
        speed: 252 * (1 + (up.spd || 0) * 0.03),
        damage: 1 * (1 + (up.dmg || 0) * 0.05),
        atkSpeed: 1, area: 1, pickup: 95 * (1 + (up.mag || 0) * 0.15), regen: 0, armor: 0
      },
      weapons: [{ id: (WEAPONS[d.start] ? d.start : 'sword'), lv: 1, t: 0 }],
      passiveLv: {},
      st: { xp: 0, xpNext: 5, level: 1, kills: 0, sap: 0, score: 0, skills: CFG.SKILL_USES, pending: 0 },
      dead: false, respawn: 0, iFrame: 0, airZ: 0, jumpT: 0, jumpCd: 0,
      choosing: null, lid: 0, moving: false
    };
    var sp = spawnSpot(order);
    p.shadow = this.add.image(sp.x, sp.y + 20, 'shadow').setDepth(9);
    p.sprite = this.physics.add.sprite(sp.x, sp.y, skinTex(p.skin, 0)).setDepth(local ? 12 : 11);
    p.sprite.body.setCircle(12, p.sprite.width / 2 - 12, p.sprite.height / 2 - 12);
    p.sprite.setCollideWorldBounds(true);
    p.sprite.play(skinAnim(p.skin));
    p.sprite.pawn = p;
    if (local) this.physics.add.collider(p.sprite, this.obstacles);
    this.physics.add.overlap(p.sprite, this.enemies, this.onTouch, null, this);
    if (this.party) {
      p.tag = txt(this, sp.x, sp.y - 36, p.nick, 12, local ? CS.cyan : CS.green, '900')
        .setOrigin(0.5).setDepth(13).setStroke('#ffffff', 4);
    }
    this.pawns.push(p);
    return p;
  },

  /* point s.player / s.stats / s.weapons at one pawn, optionally run fn */
  withPawn: function (p, fn) {
    var prev = this.cur;
    this.cur = p; this.player = p.sprite; this.stats = p.stats;
    this.weapons = p.weapons; this.passiveLv = p.passiveLv;
    if (!fn) return;
    fn();
    if (prev) { this.cur = prev; this.player = prev.sprite; this.stats = prev.stats; this.weapons = prev.weapons; this.passiveLv = prev.passiveLv; }
  },
  skinFor: function (wid) {
    var id = this.cur && this.cur.eq ? this.cur.eq[wid] : null;
    return id ? find(TRAILS, id) : null;
  },
  alivePawns: function () { return this.pawns.filter(function (p) { return !p.dead; }); },
  /* sounds only for things near the local player */
  sfxAt: function (name) {
    if (!this.cur || this.cur === this.me) { SFX.play(name); return; }
    if (Phaser.Math.Distance.Between(this.cur.sprite.x, this.cur.sprite.y, this.me.sprite.x, this.me.sprite.y) < 420) SFX.play(name);
  },
  /* enemies chase the closest living player (re-checked a few times a second) */
  targetFor: function (e, time) {
    if (e.tgt && e.tgtT > time && e.tgt.pawn && !e.tgt.pawn.dead) return e.tgt;
    e.tgtT = time + 350;
    var best = null, bd = 1e12;
    for (var i = 0; i < this.pawns.length; i++) {
      var p = this.pawns[i];
      if (p.dead) continue;
      var dx = p.sprite.x - e.x, dy = p.sprite.y - e.y, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = p; }
    }
    e.tgt = best ? best.sprite : null;
    return e.tgt;
  },

  /* ---------- main loop ---------- */
  update: function (time, delta) {
    if (this.state.over) { if (this.party) this.netTick(delta); return; }
    var dt = Math.min(delta, 50);
    var i, p;

    this.state.time += dt;
    this.scoreAcc += dt;
    while (this.scoreAcc >= 1000) {
      this.scoreAcc -= 1000;
      for (i = 0; i < this.pawns.length; i++) if (!this.pawns[i].dead) this.pawns[i].st.score += 5;
    }

    this.handleMovement(dt);
    if (this.party) this.applyRemoteInputs(dt);
    for (i = 0; i < this.pawns.length; i++) this.updatePawn(this.pawns[i], dt);
    this.updateEntities(time, dt);
    for (i = 0; i < this.pawns.length; i++) {
      p = this.pawns[i];
      if (p.dead) continue;
      this.withPawn(p, null);
      this.updateWeapons(dt);
    }
    this.withPawn(this.me, null);
    this.updateSpawning(dt);
    this.updateGems(dt);
    this.updateDrops(dt);
    this.updateFloaters(dt);

    this.saveAcc += dt;
    if (this.saveAcc >= 3000) { this.saveAcc = 0; Meta.save(); }

    if (!this.state.endless && this.state.time >= CFG.RUN_MS) this.win();
    if (this.party) this.netTick(delta);
  },

  updateEntities: function (time, dt) {
    var i, list;
    list = this.enemies.getChildren();
    for (i = 0; i < list.length; i++) if (list[i].active) list[i].update(time, dt);
    list = this.bullets.getChildren();
    for (i = 0; i < list.length; i++) if (list[i].active) list[i].update(time, dt);
  },

  updatePawn: function (p, dt) {
    if (p.iFrame > 0) p.iFrame -= dt;
    if (p.dead) {
      p.respawn -= dt;
      if (p.respawn <= 0) this.respawnPawn(p);
    } else if (p.stats.regen > 0 && p.stats.hp < p.stats.maxHp) {
      p.stats.hp = Math.min(p.stats.maxHp, p.stats.hp + p.stats.regen * dt / 1000);
    }
    if (p.choosing) {
      p.choosing.t -= dt;
      if (p.choosing.t <= 0) {
        var ch = p.choosing.choices;
        this.applyChoiceFor(p, ch[(Math.random() * ch.length) | 0], p.choosing.lid);
      }
    }
    if (p.local) {
      if (p.jumpCd > 0) p.jumpCd -= dt;
      var z = 0;
      if (p.jumpT > 0) {
        p.jumpT -= dt;
        z = Math.sin(Phaser.Math.Clamp(1 - p.jumpT / CFG.JUMP_MS, 0, 1) * Math.PI);
      }
      p.airZ = z;
    }
    var spr = p.sprite;
    if (!p.dead) {
      spr.setScale(1 + p.airZ * 0.22);
      spr.setRotation(p.airZ * 0.10 * (spr.flipX ? -1 : 1));
    }
    p.shadow.setPosition(spr.x, spr.y + 20).setScale(1 - p.airZ * 0.42).setAlpha(p.dead ? 0.2 : 1 - p.airZ * 0.55);
    if (p.tag) p.tag.setPosition(spr.x, spr.y - 36 - p.airZ * 10);
  },

  /* ---------- input (local pawn) ---------- */
  handleMovement: function (dt) {
    var p = this.me, spr = p.sprite;
    if (p.dead) { spr.setVelocity(0, 0); return; }
    var vx = 0, vy = 0;
    if (Controls.joy) { vx = Controls.jx; vy = Controls.jy; }
    else {
      var k = this.keys;
      if (k.left.isDown || k.left2.isDown) vx -= 1;
      if (k.right.isDown || k.right2.isDown) vx += 1;
      if (k.up.isDown || k.up2.isDown) vy -= 1;
      if (k.down.isDown || k.down2.isDown) vy += 1;
    }
    var len = Math.sqrt(vx * vx + vy * vy);
    if (len > 1) { vx /= len; vy /= len; }
    this.moveVec = { x: vx, y: vy };
    spr.setVelocity(vx * p.stats.speed, vy * p.stats.speed);
    p.moving = len > 0.12;
    if (p.moving) {
      spr.play(skinAnim(p.skin), true);
      this.moveAng = Math.atan2(vy, vx);
      spr.flipX = vx < 0;
    } else {
      spr.stop();
      spr.setTexture(skinTex(p.skin, 0));
    }
  },

  /* ---------- weapons (auto-fire for the pawn set by withPawn) ---------- */
  weaponLv: function (id) {
    for (var i = 0; i < this.weapons.length; i++) if (this.weapons[i].id === id) return this.weapons[i].lv;
    return 0;
  },
  autoAngle: function () {
    var e = this.nearestEnemy(this.player.x, this.player.y, 700);
    if (e) return Math.atan2(e.y - this.player.y, e.x - this.player.x);
    return this.moveAng || 0;
  },
  updateWeapons: function (dt) {
    for (var i = 0; i < this.weapons.length; i++) {
      var w = this.weapons[i];
      if (w.t > 0) { w.t -= dt * this.stats.atkSpeed; continue; }
      var def = WEAPONS[w.id];
      var st = def.stat(w.lv);
      var sk = this.skinFor(w.id);
      this.skinTint = sk ? sk.tint : 0;
      if (sk) {
        st = Object.assign({}, st);
        st.dmg = st.dmg * RARITY[sk.r].dmg;
        st.cd = st.cd * 0.94;
      }
      var ok = def.fire(this, st);
      this.skinTint = 0;
      w.t = (ok === false) ? 150 : st.cd;
    }
  },

  doSlash: function (ang, st) {
    var scale = (st.range / 58) * this.stats.area * 0.9;
    var sk = this.skinFor('sword');
    var tint = sk ? sk.tint : WEAPONS.sword.color;
    var px = this.player.x, py = this.player.y;
    var sl = this.add.image(px, py, 'slash')
      .setDepth(22).setRotation(ang).setScale(scale * 0.6).setAlpha(0.95).setTint(tint);
    this.tweens.add({ targets: sl, scale: scale, alpha: 0, duration: 170, onComplete: function () { sl.destroy(); } });
    this.fx('s', [px | 0, py | 0, Math.round(ang * 100), Math.round(scale * 100), tint], px, py);

    var range = st.range * this.stats.area;
    var half = Phaser.Math.DegToRad(st.arc) / 2;
    var dmg = st.dmg * this.stats.damage;
    var list = this.enemies.getChildren();
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (!e.active) continue;
      var d = Phaser.Math.Distance.Between(px, py, e.x, e.y);
      if (d > range + 14) continue;
      var a = Math.atan2(e.y - py, e.x - px);
      if (Math.abs(Phaser.Math.Angle.Wrap(a - ang)) > half) continue;
      this.damageEnemy(e, dmg, px, py);
    }
  },

  spawnBullet: function (tex, ang, dmg, speed, pierce, life) {
    var b = this.bullets.get(this.player.x, this.player.y, tex);
    if (!b) return null;
    b.launch(tex, this.player.x, this.player.y, ang, dmg * this.stats.damage, speed, pierce, life);
    this.fx('b', [tex === 'bul' ? 0 : (tex === 'arrow' ? 1 : 2), this.player.x | 0, this.player.y | 0,
      Math.round(ang * 100), speed | 0, life | 0, this.skinTint || 0], this.player.x, this.player.y);
    return b;
  },

  /* ---------- jump (SPACE) & shockwave (R) ---------- */
  startJump: function () {
    var p = this.me;
    if (this.state.over || p.dead || p.jumpT > 0 || p.jumpCd > 0) return;
    p.jumpT = CFG.JUMP_MS;
    p.jumpCd = CFG.JUMP_MS + 180;
    SFX.play('jump');
    p.sprite.play(skinAnim(p.skin), true);
  },
  useSkill: function () { this.useSkillFor(this.me); },
  useSkillFor: function (p) {
    if (this.state.over || (this.state.paused && !this.party) || p.dead) return;
    if (p.st.skills <= 0) {
      if (p.local) { SFX.play('click'); Bus.emit('toast', TXT.skillNone, 1100); }
      return;
    }
    p.st.skills--;
    var x = p.sprite.x, y = p.sprite.y, radius = CFG.SKILL_RADIUS * p.stats.area;
    this.shockFx(x, y, radius, p.local);
    this.fx('w', [x | 0, y | 0, radius | 0], x, y);
    var self = this;
    this.withPawn(p, function () {
      var list = self.enemies.getChildren();
      for (var i = 0; i < list.length; i++) {
        var e = list[i];
        if (!e.active) continue;
        if (Phaser.Math.Distance.Between(x, y, e.x, e.y) <= radius) self.damageEnemy(e, CFG.SKILL_DMG, x, y);
      }
    });
  },
  shockFx: function (x, y, radius, loud) {
    for (var k = 0; k < 2; k++) {
      var r = this.add.image(x, y, 'ring').setDepth(26).setScale(0.1).setAlpha(0.95).setTint(k ? 0xffffff : C.cyan);
      this.tweens.add({
        targets: r, scale: radius / 56, alpha: 0, duration: 380, delay: k * 90, ease: 'Cubic.Out',
        onComplete: (function (img) { return function () { img.destroy(); }; })(r)
      });
    }
    this.deathFx.emitParticleAt(x, y, 26);
    if (loud) { this.cameras.main.shake(240, 0.012); this.cameras.main.flash(120, 200, 240, 255); }
    SFX.play('shock');
  },

  explode: function (x, y, radius, dmg, owner) {
    var r = this.add.image(x, y, 'ring').setDepth(25).setScale(0.15).setAlpha(0.9).setTint(0xffb36b);
    this.tweens.add({ targets: r, scale: radius / 56, alpha: 0, duration: 300, onComplete: function () { r.destroy(); } });
    this.deathFx.emitParticleAt(x, y, 14);
    this.fx('x', [x | 0, y | 0, radius | 0], x, y);
    if (!owner || owner === this.me) this.cameras.main.shake(120, 0.006);
    SFX.play('explode');
    var self = this, run = function () {
      var list = self.enemies.getChildren();
      for (var i = 0; i < list.length; i++) {
        var e = list[i];
        if (!e.active) continue;
        if (Phaser.Math.Distance.Between(x, y, e.x, e.y) <= radius) self.damageEnemy(e, dmg, x, y);
      }
    };
    if (owner && owner !== this.cur && this.pawns.indexOf(owner) >= 0) this.withPawn(owner, run); else run();
  },

  /* ---------- targeting ---------- */
  nearestEnemy: function (x, y, maxD) {
    var list = this.enemies.getChildren(), best = null, bd = maxD * maxD;
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (!e.active) continue;
      var dx = e.x - x, dy = e.y - y, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = e; }
    }
    return best;
  },
  randomEnemy: function (maxD) {
    var list = this.enemies.getChildren(), pool = [];
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (!e.active) continue;
      if (Phaser.Math.Distance.Between(this.player.x, this.player.y, e.x, e.y) <= maxD) pool.push(e);
    }
    if (!pool.length) return null;
    return pool[(Math.random() * pool.length) | 0];
  },

  /* ---------- combat ---------- */
  onBulletHit: function (b, e) {
    if (!b.active || !e.active) return;
    var self = this;
    var owner = (b.owner && this.pawns.indexOf(b.owner) >= 0) ? b.owner : this.me;
    this.withPawn(owner, function () {
      if (b.kind === 'bomb') { self.explode(b.x, b.y, b.radius, b.dmg, owner); b.kill(); return; }
      if (b.hitList.indexOf(e) !== -1) return;
      b.hitList.push(e);
      self.damageEnemy(e, b.dmg, b.x, b.y);
      if (b.pierce > 0) b.pierce--; else b.kill();
    });
  },

  damageEnemy: function (e, dmg, fx, fy) {
    var d = Math.round(dmg);
    this.hitFx.emitParticleAt(e.x, e.y, 3);
    this.showFloat(e.x, e.y - 14, d);
    if (this.cur === this.me) SFX.play('hit');
    if (e.hurt(d, fx, fy)) this.killEnemy(e);
  },

  killEnemy: function (e) {
    var x = e.x, y = e.y, boss = e.isBoss;
    var k = this.cur || this.me;
    k.st.kills++;
    k.st.score += e.baseScore;
    k.st.sap += (boss ? 400 : e.sapVal || 8);
    if (k === this.me) {
      Meta.addKills(1);
      if (Meta.justPlaced) { Meta.justPlaced = false; Bus.emit('notice', fmt(TXT.placed, { t: rankName(Meta.rank) })); }
    }
    this.deathFx.emitParticleAt(x, y, boss ? 30 : 7);
    this.fx('k', [x | 0, y | 0, boss ? 1 : 0], x, y);
    SFX.play(boss ? 'explode' : 'kill');

    if (boss) {
      this.boss = null;
      this.cameras.main.shake(320, 0.012);
      for (var i = 0; i < 10; i++) {
        var a = Math.random() * 6.28, r = 30 + Math.random() * 70;
        this.dropGem(x + Math.cos(a) * r, y + Math.sin(a) * r, 4, true);
      }
      this.dropItem(x, y + 20, 'heart');
      this.dropItem(x - 30, y + 20, 'magnet');
      Bus.emit('bossDown');
      CG.happytime();
    } else {
      this.dropGem(x, y, e.xpVal, false);
      var roll = Math.random();
      if (roll < 0.022) this.dropItem(x, y, 'heart');
      else if (roll < 0.034) this.dropItem(x, y, 'magnet');
    }
    e.kill();
  },

  onTouch: function (spr, e) {
    var p = spr.pawn;
    if (this.state.over || !e.active || !p || p.dead) return;
    var now = this.time.now;
    var key = 'h_' + p.key;
    if (now < (e[key] || 0) || p.iFrame > 0 || p.airZ > 0.25) return;
    e[key] = now + 650;
    this.damagePawn(p, e.dmg);
    if (p.local) {
      var a = Math.atan2(spr.y - e.y, spr.x - e.x);
      spr.body.velocity.x += Math.cos(a) * 150;
      spr.body.velocity.y += Math.sin(a) * 150;
    }
  },

  damagePawn: function (p, dmg) {
    if (this.state.over || p.dead || p.choosing) return;
    var red = Math.max(0.32, 1 - p.stats.armor * 0.12);
    p.stats.hp -= dmg * red;
    p.iFrame = 220;
    var spr = p.sprite;
    spr.setTintFill(0xff5555);
    this.time.delayedCall(90, function () { if (spr.active && !p.dead) spr.clearTint(); });
    if (p.local) {
      SFX.play('hurt');
      this.cameras.main.shake(90, 0.007);
      Bus.emit('playerHurt');
    } else {
      this.fx('h', [], null, null, p.key);
    }
    if (p.stats.hp <= 0) {
      p.stats.hp = 0;
      if (this.party) this.pawnDown(p); else this.gameOver();
    }
  },

  heal: function (n) { this.stats.hp = Math.min(this.stats.maxHp, this.stats.hp + n); },

  /* ---------- party deaths ---------- */
  pawnDown: function (p) {
    p.dead = true;
    p.respawn = RESPAWN_MS;
    p.choosing = null;
    var spr = p.sprite;
    spr.setVelocity(0, 0); spr.stop();
    spr.setTintFill(0x8fa6bb).setAlpha(0.45).setAngle(90).setScale(1);
    if (p.local) SFX.play('over'); else SFX.play('hurt');
    var msg = fmt(TXT.died, { n: p.nick });
    Bus.emit('notice', msg);
    this.sendEv('all', ['D', p.nick, p.key]);
    if (!this.alivePawns().length) this.partyOver();
  },
  respawnPawn: function (p) {
    p.dead = false;
    p.stats.hp = Math.max(1, Math.round(p.stats.maxHp * 0.5));
    p.iFrame = 2200;
    var spr = p.sprite;
    spr.clearTint().setAlpha(1).setAngle(0);
    spr.play(skinAnim(p.skin));
    var self = this;
    this.withPawn(p, function () { self.explode(spr.x, spr.y, 170, 60, p); });
    Bus.emit('notice', fmt(TXT.revived, { n: p.nick }));
    this.sendEv('all', ['R', p.nick, p.key]);
  },

  /* ---------- pickups ---------- */
  dropGem: function (x, y, val, big) {
    var g = this.gems.get(x, y, big ? 'gem2' : 'gem');
    if (!g) return;
    g.setTexture(big ? 'gem2' : 'gem');
    g.setActive(true).setVisible(true).setPosition(x, y).setDepth(8).setScale(1);
    g.val = val; g.pulled = null; g.big = !!big;
  },
  dropItem: function (x, y, kind) {
    var d = this.drops.get(x, y, kind);
    if (!d) return;
    d.setTexture(kind);
    d.setActive(true).setVisible(true).setPosition(x, y).setDepth(8).setScale(1.1);
    d.kind = kind;
    this.tweens.add({ targets: d, scale: 1.35, duration: 500, yoyo: true, repeat: -1 });
  },
  /* a gem flies to whichever living player first comes within pickup range */
  updateGems: function (dt) {
    var list = this.gems.getChildren(), alive = this.alivePawns();
    for (var i = 0; i < list.length; i++) {
      var g = list[i];
      if (!g.active) continue;
      var tgt = g.pulled;
      if (tgt && tgt.dead) tgt = g.pulled = null;
      if (!tgt) {
        for (var j = 0; j < alive.length; j++) {
          var q = alive[j], dx0 = q.sprite.x - g.x, dy0 = q.sprite.y - g.y, pr = q.stats.pickup;
          if (dx0 * dx0 + dy0 * dy0 < pr * pr || g.magnet === q) { tgt = g.pulled = q; break; }
        }
      }
      if (!tgt) continue;
      var dx = tgt.sprite.x - g.x, dy = tgt.sprite.y - g.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
      var sp = Phaser.Math.Clamp(680 - d * 0.7, 240, 680) * dt / 1000;
      g.x += (dx / d) * sp; g.y += (dy / d) * sp;
      if (d < 22) {
        g.setActive(false).setVisible(false);
        this.addXpFor(tgt, g.val);
        if (tgt.local) SFX.play('pickup'); else this.fx('p', [], null, null, tgt.key);
      }
    }
  },
  updateDrops: function (dt) {
    var list = this.drops.getChildren(), alive = this.alivePawns();
    for (var i = 0; i < list.length; i++) {
      var d = list[i];
      if (!d.active) continue;
      for (var j = 0; j < alive.length; j++) {
        var p = alive[j];
        if (Phaser.Math.Distance.Between(p.sprite.x, p.sprite.y, d.x, d.y) >= 34) continue;
        if (d.kind === 'heart') {
          p.stats.hp = Math.min(p.stats.maxHp, p.stats.hp + p.stats.maxHp * 0.3);
          if (p.local) { SFX.play('heal'); Bus.emit('toast', '+HP'); } else this.sendEv(p, ['T', '+HP', 'heal']);
        } else if (d.kind === 'magnet') {
          this.magnetAll(p);
          if (p.local) { SFX.play('levelup'); Bus.emit('toast', 'MAGNET'); } else this.sendEv(p, ['T', 'MAGNET', 'levelup']);
        }
        this.tweens.killTweensOf(d);
        d.setActive(false).setVisible(false);
        break;
      }
    }
  },
  magnetAll: function (p) {
    var list = this.gems.getChildren();
    for (var i = 0; i < list.length; i++) if (list[i].active) { list[i].pulled = p; }
  },

  /* ---------- xp / level ---------- */
  addXpFor: function (p, n) {
    var s = p.st;
    s.xp += n;
    while (s.xp >= s.xpNext) {
      s.xp -= s.xpNext;
      s.level++;
      s.xpNext = Math.floor(5 + s.level * 3.4 + s.level * s.level * 0.38);
      s.pending++;
    }
    if (s.pending > 0 && !p.choosing && !this.state.over && !(this.state.paused && !this.party)) this.openLevelUpFor(p);
  },
  addXp: function (n) { this.addXpFor(this.me, n); },

  openLevelUpFor: function (p) {
    if (this.state.over || p.dead) return;
    p.st.pending--;
    var self = this, choices;
    this.withPawn(p, function () { choices = self.buildChoices(); });
    this.withPawn(this.me, null);
    if (!this.party) {
      /* solo: the world stops while you choose */
      this.state.paused = true;
      SFX.play('levelup');
      CG.happytime();
      p.choosing = { lid: ++p.lid, choices: choices, t: 1e12 };
      Bus.emit('levelup', choices, false);
      this.scene.pause();
      return;
    }
    /* party: nobody else can wait, so the chooser is invincible instead */
    p.lid++;
    p.choosing = { lid: p.lid, choices: choices, t: CHOOSE_MS };
    if (p.local) { SFX.play('levelup'); Bus.emit('levelup', choices, true); }
    else this.sendEv(p, ['L', p.lid, choices]);
  },
  openLevelUp: function () { this.openLevelUpFor(this.me); },

  buildChoices: function () {
    var pool = [], i, id;
    for (i = 0; i < this.weapons.length; i++) {
      var w = this.weapons[i];
      if (w.lv < WEAPONS[w.id].max) pool.push({ type: 'wlv', id: w.id });
    }
    if (this.weapons.length < CFG.MAX_WEAPONS) {
      for (id in WEAPONS) {
        if (!WEAPONS.hasOwnProperty(id)) continue;
        if (this.weaponLv(id) === 0) pool.push({ type: 'wnew', id: id });
      }
    }
    for (i = 0; i < PASSIVES.length; i++) {
      var p = PASSIVES[i];
      if ((this.passiveLv[p.id] || 0) < p.max) pool.push({ type: 'passive', id: p.id });
    }
    Phaser.Utils.Array.Shuffle(pool);
    var out = pool.slice(0, 3);
    while (out.length < 3) out.push({ type: 'heal' });
    var self = this;
    return out.map(function (c) {
      if (c.type === 'heal') return { type: 'heal', icon: '❤', name: TXT.heal, desc: TXT.healD, lv: 0, tag: '', color: C.heart };
      if (c.type === 'passive') {
        var p = find(PASSIVES, c.id);
        var lv = (self.passiveLv[p.id] || 0) + 1;
        return { type: 'passive', id: p.id, icon: p.icon, name: LANG === 'ko' ? p.nameKo : p.name,
                 desc: LANG === 'ko' ? p.descKo : p.desc, lv: lv, max: p.max, tag: 'LV ' + lv, color: C.cyan };
      }
      var d = WEAPONS[c.id];
      var nlv = c.type === 'wnew' ? 1 : self.weaponLv(c.id) + 1;
      return { type: c.type, id: c.id, icon: d.icon, name: wName(c.id), desc: d.desc(nlv), lv: nlv, max: d.max,
               tag: c.type === 'wnew' ? TXT.newW : 'LV ' + nlv, color: d.color };
    });
  },

  /* UI calls this for the local player */
  applyChoice: function (c) {
    var lid = this.me.choosing ? this.me.choosing.lid : -1;
    this.applyChoiceFor(this.me, c, lid);
  },
  applyChoiceFor: function (p, c, lid) {
    if (!p.choosing || p.choosing.lid !== lid || !c) return;
    var self = this;
    this.withPawn(p, function () {
      if (c.type === 'heal') self.heal(self.stats.maxHp * 0.5);
      else if (c.type === 'passive') {
        var pd = find(PASSIVES, c.id);
        if (pd) pd.fn(self);
        self.passiveLv[c.id] = (self.passiveLv[c.id] || 0) + 1;
      } else if (c.type === 'wnew') {
        if (self.weaponLv(c.id) === 0 && self.weapons.length < CFG.MAX_WEAPONS) self.weapons.push({ id: c.id, lv: 1, t: 0 });
      } else {
        for (var j = 0; j < self.weapons.length; j++) if (self.weapons[j].id === c.id) self.weapons[j].lv++;
      }
    });
    p.choosing = null;
    if (p.local) {
      Bus.emit('levelclose');
      SFX.play('select');
    }
    if (!this.party) { this.state.paused = false; this.scene.resume(); }
    if (p.st.pending > 0) {
      this.time.delayedCall(120, function () { if (!self.state.over && !p.choosing) self.openLevelUpFor(p); });
    }
  },

  /* ---------- spawning ---------- */
  updateSpawning: function (dt) {
    var m = this.state.time / 60000;
    var crowd = 1 + (this.pawns.length - 1) * 0.6;       /* more players, more monsters */
    var interval = Math.max(110, (950 - m * 165) / crowd);
    this.spawnAcc += dt;
    while (this.spawnAcc >= interval) { this.spawnAcc -= interval; this.spawnOne(); }

    this.waveAcc += dt;
    if (this.waveAcc >= 22000) {
      this.waveAcc = 0;
      var n = Math.round((6 + Math.floor(m * 5)) * crowd);
      for (var i = 0; i < n; i++) this.spawnOne();
      Bus.emit('toast', TXT.wave);
      this.sendEv('all', ['T', TXT.wave, '']);
    }

    var bt = this.state.endless
      ? CFG.BOSS_TIMES[CFG.BOSS_TIMES.length - 1] + (this.state.bossIndex - CFG.BOSS_TIMES.length + 1) * CFG.ENDLESS_BOSS_EVERY
      : CFG.BOSS_TIMES[this.state.bossIndex];
    if (bt !== undefined && this.state.time >= bt && !this.boss) {
      this.state.bossIndex++;
      this.spawnBoss();
    }
  },
  pickType: function () {
    var t = this.state.time, r = Math.random();
    if (t < 25000) return 'n';
    if (t < 70000) return r < 0.72 ? 'n' : 'f';
    if (t < 140000) return r < 0.5 ? 'n' : (r < 0.82 ? 'f' : 't');
    return r < 0.38 ? 'n' : (r < 0.72 ? 'f' : 't');
  },
  /* off-screen spot near a random living player */
  offscreenPos: function () {
    var alive = this.alivePawns();
    var anchor = alive.length ? alive[(Math.random() * alive.length) | 0].sprite : this.me.sprite;
    var cam = this.cameras.main;
    var rad = Math.max(cam.worldView.width, cam.worldView.height) * 0.5 + 70;
    for (var i = 0; i < 10; i++) {
      var a = Math.random() * Math.PI * 2;
      var x = Phaser.Math.Clamp(anchor.x + Math.cos(a) * rad, 46, CFG.ARENA_W - 46);
      var y = Phaser.Math.Clamp(anchor.y + Math.sin(a) * rad, 46, CFG.ARENA_H - 46);
      var ok = true;
      for (var j = 0; j < this.pawns.length; j++) {
        if (Phaser.Math.Distance.Between(x, y, this.pawns[j].sprite.x, this.pawns[j].sprite.y) < 190) { ok = false; break; }
      }
      if (ok) return { x: x, y: y };
    }
    return { x: Phaser.Math.Clamp(anchor.x + 320, 46, CFG.ARENA_W - 46), y: 46 };
  },
  spawnOne: function () {
    var cap = CFG.MAX_ENEMIES + (this.pawns.length - 1) * 20;
    if (this.enemies.countActive(true) >= cap) return;
    var p = this.offscreenPos();
    this.spawnEnemy(this.pickType(), p.x, p.y);
  },
  spawnEnemy: function (key, x, y) {
    var e = this.enemies.get(x, y, ETYPE[key].tex);
    if (!e) return null;
    var m = this.state.time / 60000;
    var hpMul = 1 + m * 0.62 + (this.state.endless ? m * 0.35 : 0);
    var dmgMul = 1 + m * 0.22;
    var spdMul = 1 + Math.min(m * 0.05, 0.3);
    e.spawn(key, x, y, hpMul, dmgMul, spdMul);
    e.nid = this.nid++;
    e.tgt = null; e.tgtT = 0;
    return e;
  },
  spawnBoss: function () {
    var p = this.offscreenPos();
    var e = this.spawnEnemy('b', p.x, p.y);
    if (!e) return;
    var mul = (1 + (this.state.bossIndex - 1) * 1.15) * (1 + (this.pawns.length - 1) * 0.55);
    e.maxHp = e.hp = Math.round(e.hp * mul);
    var tiers = [0xffffff, 0x6fd1ff, 0x64e08a, 0xffc857, 0xff7b54, 0xff4d6d, 0xb388ff, 0x2b2b3a];
    e.baseTint = tiers[Math.min(this.state.bossIndex - 1, tiers.length - 1)];
    if (e.baseTint !== 0xffffff) e.setTint(e.baseTint); else e.baseTint = 0;
    e.setScale(Math.min(1.5, 1 + (this.state.bossIndex - 1) * 0.08));
    this.boss = e;
    SFX.play('boss');
    this.cameras.main.flash(240, 255, 210, 210);
    Bus.emit('boss', TXT.boss);
    this.sendEv('all', ['B']);
  },

  /* ---------- floating numbers ---------- */
  showFloat: function (x, y, n) {
    var t = this.floaters[this.fIdx];
    this.fIdx = (this.fIdx + 1) % this.floaters.length;
    t.setText(String(n)).setPosition(x, y).setVisible(true).setAlpha(1);
    t.life = 500;
    this.fx('f', [x | 0, y | 0, n], x, y);
  },
  updateFloaters: function (dt) {
    for (var i = 0; i < this.floaters.length; i++) {
      var t = this.floaters[i];
      if (t.life <= 0) continue;
      t.life -= dt;
      t.y -= dt * 0.035;
      t.setAlpha(Math.max(0, t.life / 500));
      if (t.life <= 0) t.setVisible(false);
    }
  },

  /* ---------- HUD snapshot for UIScene ---------- */
  hud: function () {
    var p = this.me, st = p.st, mates = [];
    for (var i = 0; i < this.pawns.length; i++) {
      var q = this.pawns[i];
      if (q === p) continue;
      mates.push({ nick: q.nick, hpf: q.stats.hp / q.stats.maxHp, dead: q.dead, rs: q.respawn });
    }
    return {
      hp: p.stats.hp, maxHp: p.stats.maxHp, level: st.level, xp: st.xp, xpNext: st.xpNext,
      score: st.score, kills: st.kills, sap: st.sap, skills: st.skills, weapons: p.weapons,
      time: this.state.time, endless: this.state.endless, over: this.state.over,
      boss: (this.boss && this.boss.active) ? this.boss.hp / this.boss.maxHp : -1,
      dead: p.dead, respawn: p.respawn, choosing: !!p.choosing, chooseT: p.choosing ? p.choosing.t : 0,
      party: this.party, host: true, mates: mates
    };
  },

  /* ---------- end states ---------- */
  clearField: function () {
    var list = this.enemies.getChildren();
    for (var i = 0; i < list.length; i++) {
      if (list[i].active) { this.deathFx.emitParticleAt(list[i].x, list[i].y, 5); list[i].kill(); }
    }
    this.boss = null;
  },
  resultFor: function (p, victory) {
    return {
      score: p.st.score, kills: p.st.kills, time: victory ? CFG.RUN_MS : this.state.time,
      level: p.st.level, sap: p.st.sap
    };
  },
  gameOver: function () {
    if (this.state.over) return;
    this.state.over = true;
    var spr = this.me.sprite;
    spr.setVelocity(0, 0); spr.stop(); spr.setTintFill(0x8fa6bb);
    this.tweens.add({ targets: spr, angle: 90, y: spr.y + 8, duration: 350 });
    SFX.play('over');
    CG.gameplayStop();
    var d = this.resultFor(this.me, false);
    var b = bankRun(d.score, d.sap, d.kills, d.time);
    var self = this;
    this.time.delayedCall(600, function () {
      Bus.emit('gameover', Object.assign(d, { best: b.best, isBest: b.isBest, lvUp: b.lvUp, canRevive: !self.state.revived }));
      self.scene.pause();
    });
  },
  /* party: the last player standing just went down */
  partyOver: function () {
    if (this.state.over) return;
    this.state.over = true;
    SFX.play('over');
    CG.gameplayStop();
    for (var i = 0; i < this.pawns.length; i++) {
      var p = this.pawns[i];
      if (!p.local) this.sendEv(p, ['O', this.resultFor(p, false)]);
    }
    var d = this.resultFor(this.me, false);
    var b = bankRun(d.score, d.sap, d.kills, d.time);
    Bus.emit('gameover', Object.assign(d, { best: b.best, isBest: b.isBest, lvUp: b.lvUp, canRevive: false, party: true, wiped: true }));
  },
  revive: function () {
    var p = this.me;
    this.state.over = false;
    this.state.revived = true;
    p.stats.hp = p.stats.maxHp;
    p.iFrame = 2500;
    p.sprite.clearTint().setAngle(0);
    p.sprite.play(skinAnim(p.skin));
    this.clearField();
    this.explode(p.sprite.x, p.sprite.y, 320 * p.stats.area, 200, p);
    this.scene.resume();
    CG.gameplayStart();
  },
  win: function () {
    if (this.state.over || this.state.victory) return;
    this.state.victory = true;
    this.state.over = true;
    this.clearField();
    SFX.play('win');
    CG.happytime();
    CG.gameplayStop();
    this.cameras.main.flash(400, 255, 255, 255);
    var i, p;
    for (i = 0; i < this.pawns.length; i++) this.pawns[i].st.score += 2000;
    if (this.party) {
      for (i = 0; i < this.pawns.length; i++) {
        p = this.pawns[i];
        if (!p.local) this.sendEv(p, ['V', this.resultFor(p, true)]);
      }
    }
    var d = this.resultFor(this.me, true);
    var b = bankRun(d.score, d.sap, d.kills, d.time);
    var self = this;
    this.time.delayedCall(500, function () {
      Bus.emit('victory', Object.assign(d, { best: b.best, isBest: b.isBest, lvUp: b.lvUp, party: self.party, host: true }));
      if (!self.party) self.scene.pause();
    });
  },
  goEndless: function () {
    this.state.endless = true;
    this.state.over = false;
    this.state.victory = false;
    for (var i = 0; i < this.pawns.length; i++) {
      var p = this.pawns[i];
      if (p.dead) this.respawnPawn(p);
      p.stats.hp = p.stats.maxHp;
      p.iFrame = 2000;
    }
    this.sendEv('all', ['E']);
    if (!this.party) this.scene.resume();
    CG.gameplayStart();
  },
  restartRun: function () {
    var self = this;
    if (this.party) { this.quitToMenu(); return; }
    CG.gameplayStop();
    CG.midgame(function () {
      self.scene.stop('UI');
      self.scene.restart();
    });
  },
  quitToMenu: function () {
    CG.gameplayStop();
    if (this.party) {
      this.sendEv('all', ['Q']);
      this.netFlush();
      var self = this;
      /* give the guests a moment to read the "back to lobby" event */
      setTimeout(function () { Net.backToLobby(); }, 900);
    }
    this.scene.stop('UI');
    this.scene.start('Menu');
  },

  /* =================================================================
     NET (host side)
     Each guest has two channels under rooms/{id}/g/{key}:
       i  the guest's input   {x, y, f, m, a, c:[[seq,cmd,..]], k:lastEvSeq}
       s  our snapshot        {t, e, p, gm, dr, me, st, fx, ev, ca}
     fx = cosmetic events, sent once (lossy is fine);
     ev = important events, re-sent until the guest acks them.
     ================================================================= */
  setupParty: function () {
    var self = this, ms = Net.members(), order = 1;
    this.guests = {};
    this.netAcc = 0;
    for (var i = 0; i < ms.length; i++) {
      var m = ms[i];
      if (m.k === Net.k) continue;
      var p = this.addPawn({ key: m.k, nick: m.nick, skin: m.skin, up: m.up, start: m.start, eq: m.eq }, false, order++);
      p.sprite.setCollideWorldBounds(false);
      var g = { pawn: p, fx: [], ev: [], evSeq: 0, cmdAck: 0, inp: null, seen: Date.now() };
      var base = 'rooms/' + Net.roomId + '/g/' + m.k;
      g.inRef = Net.ref(base + '/i');
      g.outRef = Net.ref(base + '/s');
      (function (gg) {
        gg.inRef.on('value', function (s) { var v = s.val(); if (v) { gg.inp = v; gg.seen = Date.now(); } });
      })(g);
      this.guests[m.k] = g;
    }
    this.onRoomChange = function () {
      for (var k in self.guests) if (!Net.room || !Net.room.mem || !Net.room.mem[k]) self.dropGuest(k);
    };
    Net.ev.on('room', this.onRoomChange);
  },
  teardownParty: function () {
    if (!this.guests) return;
    for (var k in this.guests) { var g = this.guests[k]; g.inRef.off(); }
    if (this.onRoomChange) Net.ev.off('room', this.onRoomChange);
    this.guests = null;
  },
  dropGuest: function (k) {
    var g = this.guests && this.guests[k];
    if (!g) return;
    g.inRef.off();
    var p = g.pawn;
    Bus.emit('notice', p.nick + ' ' + (LANG === 'ko' ? '님이 나갔어요' : 'left'));
    p.sprite.destroy(); p.shadow.destroy(); if (p.tag) p.tag.destroy();
    this.pawns.splice(this.pawns.indexOf(p), 1);
    delete this.guests[k];
    if (!this.state.over && this.party && !this.alivePawns().length) this.partyOver();
  },

  applyRemoteInputs: function (dt) {
    for (var k in this.guests) {
      var g = this.guests[k], p = g.pawn, v = g.inp;
      if (!v) continue;
      /* commands: skill, level pick */
      var cmds = arr(v.c);
      for (var i = 0; i < cmds.length; i++) {
        var c = arr(cmds[i]);
        if (c[0] <= g.cmdAck) continue;
        g.cmdAck = c[0];
        if (c[1] === 'r') this.useSkillFor(p);
        else if (c[1] === 'p' && p.choosing && p.choosing.lid === c[3]) this.applyChoiceFor(p, p.choosing.choices[c[2]], c[3]);
      }
      /* reliable events the guest has confirmed */
      if (typeof v.k === 'number') g.ev = g.ev.filter(function (e) { return e[0] > v.k; });
      if (p.dead) continue;
      var spr = p.sprite;
      var nx = spr.x + (v.x - spr.x) * Math.min(1, dt * 0.02);
      var ny = spr.y + (v.y - spr.y) * Math.min(1, dt * 0.02);
      if (Math.abs(v.x - spr.x) > 220 || Math.abs(v.y - spr.y) > 220) { nx = v.x; ny = v.y; }
      spr.body.reset(nx, ny);
      spr.flipX = !!v.f;
      p.airZ = (v.a || 0) / 100;
      p.moving = !!v.m;
      if (p.moving) spr.play(skinAnim(p.skin), true); else { spr.stop(); spr.setTexture(skinTex(p.skin, 0)); }
    }
  },

  /* queue a cosmetic event for guests near (x, y) — or one guest by key */
  fx: function (kind, arr, x, y, onlyKey) {
    if (!this.guests) return;
    for (var k in this.guests) {
      if (onlyKey && k !== onlyKey) continue;
      var g = this.guests[k], gp = g.pawn.sprite;
      if (x !== null && x !== undefined) {
        var dx = gp.x - x, dy = gp.y - y;
        if (dx * dx + dy * dy > VIEW_R * VIEW_R) continue;
      }
      if (g.fx.length > 140) continue;
      g.fx.push([kind].concat(arr));
    }
  },
  /* reliable event: to one pawn, or 'all' guests */
  sendEv: function (to, arr) {
    if (!this.guests) return;
    for (var k in this.guests) {
      var g = this.guests[k];
