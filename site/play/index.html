      if (to !== 'all' && g.pawn !== to) continue;
      g.evSeq++;
      g.ev.push([g.evSeq].concat(arr));
      if (g.ev.length > 40) g.ev.shift();
    }
  },

  netTick: function (delta) {
    if (!this.guests) return;
    this.netAcc += delta;
    if (this.netAcc < SNAP_MS) return;
    this.netAcc = 0;
    this.netFlush();
  },
  netFlush: function () {
    if (!this.guests) return;
    for (var k in this.guests) {
      var g = this.guests[k];
      try { g.outRef.set(this.buildSnap(g)); } catch (e) {}
    }
  },
  buildSnap: function (g) {
    var p = g.pawn, px = p.sprite.x, py = p.sprite.y, R2 = VIEW_R * VIEW_R, i;
    var e = [], list = this.enemies.getChildren();
    for (i = 0; i < list.length && e.length < 120; i++) {
      var en = list[i];
      if (!en.active) continue;
      var dx = en.x - px, dy = en.y - py;
      if (dx * dx + dy * dy > R2 && !en.isBoss) continue;
      e.push([en.nid, en.x | 0, en.y | 0, ETYPE_IDX[en.typeKey],
        Math.max(0, Math.round(en.hp / en.maxHp * 100)), en.baseTint || 0,
        (en.flash > 0 ? 1 : 0) | (en.dashing > 0 ? 2 : 0) | (en.fleeT > 0 ? 4 : 0),
        Math.round(en.scaleX * 100), en.flipX ? 1 : 0]);
    }
    var ps = [];
    for (i = 0; i < this.pawns.length; i++) {
      var q = this.pawns[i];
      if (q === p) continue;
      ps.push([q.key, q.sprite.x | 0, q.sprite.y | 0, q.sprite.flipX ? 1 : 0, q.moving ? 1 : 0, q.dead ? 1 : 0,
        Math.round(q.stats.hp / q.stats.maxHp * 100), Math.round(q.airZ * 100), q.skin, q.nick]);
    }
    var gm = [], gl = this.gems.getChildren();
    for (i = 0; i < gl.length && gm.length < 100; i++) {
      var ge = gl[i];
      if (!ge.active) continue;
      var gx = ge.x - px, gy = ge.y - py;
      if (gx * gx + gy * gy > R2) continue;
      gm.push([ge.x | 0, ge.y | 0, ge.big ? 1 : 0]);
    }
    var dr = [], dl = this.drops.getChildren();
    for (i = 0; i < dl.length; i++) if (dl[i].active) dr.push([dl[i].x | 0, dl[i].y | 0, dl[i].kind === 'heart' ? 0 : 1]);
    var st = p.st, s = p.stats;
    var me = {
      hp: Math.round(s.hp * 10) / 10, mx: Math.round(s.maxHp), lv: st.level, xp: st.xp, xn: st.xpNext,
      k: st.kills, sc: st.score, sap: st.sap, sk: st.skills,
      w: p.weapons.map(function (w) { return [w.id, w.lv]; }),
      spd: Math.round(s.speed), dead: p.dead ? 1 : 0, rs: Math.max(0, Math.round(p.respawn)),
      ch: p.choosing ? p.choosing.lid : 0, ct: p.choosing ? Math.round(p.choosing.t) : 0,
      x: px | 0, y: py | 0
    };
    var fx = g.fx; g.fx = [];
    return {
      t: Math.round(this.state.time), e: e, p: ps, gm: gm, dr: dr, me: me,
      st: { en: this.state.endless ? 1 : 0, ov: this.state.over ? 1 : 0, vi: this.state.victory ? 1 : 0,
            bh: (this.boss && this.boss.active) ? Math.round(this.boss.hp / this.boss.maxHp * 1000) : -1 },
      fx: fx, ev: g.ev.slice(), ca: g.cmdAck
    };
  }
});

/* =====================================================================
   15b. GUEST SCENE  —  a party member's view of the host's world
   ---------------------------------------------------------------
   Moves its own stickman locally (so controls feel instant), sends that
   position to the host ~12 times a second, and draws everything else
   from the host's snapshots: enemies glide toward their last reported
   spot, and bullets / slashes / explosions are replayed as cosmetics.
   All damage, kills and loot are decided by the host.
   ===================================================================== */
var INPUT_MS = 80;

var GuestScene = new Phaser.Class({
  Extends: Phaser.Scene,
  initialize: function GuestScene() { Phaser.Scene.call(this, { key: 'Guest' }); },

  create: function () {
    var self = this;
    this.cameras.main.setBackgroundColor(C.out);
    adPanel(false);
    Net.setStatus('game');

    buildArenaInto(this);
    this.physics.world.setBounds(0, 0, CFG.ARENA_W, CFG.ARENA_H);

    /* my stickman, at the same spot the host spawns me */
    var ms = Net.members(), order = 0;
    for (var i = 0; i < ms.length; i++) if (ms[i].k === Net.k) order = i;
    var sp = spawnSpot(order);
    this.mySkin = Meta.skin;
    this.shadow = this.add.image(sp.x, sp.y + 20, 'shadow').setDepth(9);
    this.player = this.physics.add.sprite(sp.x, sp.y, skinTex(this.mySkin, 0)).setDepth(12);
    this.player.body.setCircle(12, this.player.width / 2 - 12, this.player.height / 2 - 12);
    this.player.setCollideWorldBounds(true);
    this.player.play(skinAnim(this.mySkin));
    this.physics.add.collider(this.player, this.obstacles);
    this.tag = txt(this, sp.x, sp.y - 36, Meta.nick, 12, CS.cyan, '900').setOrigin(0.5).setDepth(13).setStroke('#ffffff', 4);

    this.state = { over: false, paused: false, victory: false, endless: false, time: 0 };
    this.view = {
      hp: 100, maxHp: 100, level: 1, xp: 0, xpNext: 5, score: 0, kills: 0, sap: 0,
      skills: CFG.SKILL_USES, weapons: [{ id: 'sword', lv: 1 }], dead: false, respawn: 0,
      choosing: false, chooseT: 0, speed: 252, boss: -1
    };
    this.jumpT = 0; this.jumpCd = 0; this.airZ = 0;
    this.enemyMap = {}; this.mates = {};
    this.lastEv = 0; this.cmdSeq = 0; this.cmds = [];
    this.lastSnapAt = Date.now(); this.banked = 0;
    this.choiceLid = 0; this.ended = false;

    /* pools */
    this.gemPool = []; this.dropPool = []; this.shots = [];
    this.hitFx = this.add.particles(0, 0, 'spark', {
      speed: { min: 60, max: 220 }, lifespan: 320, quantity: 1, scale: { start: 0.9, end: 0 }, emitting: false
    }).setDepth(30);
    this.deathFx = this.add.particles(0, 0, 'spark', {
      speed: { min: 90, max: 300 }, lifespan: 480, quantity: 1, scale: { start: 1.3, end: 0 }, emitting: false
    }).setDepth(30);
    this.floaters = [];
    for (i = 0; i < 18; i++) {
      var t = this.add.text(0, 0, '', { fontFamily: FONT, fontSize: '17px', color: '#ffffff', fontStyle: '900',
        stroke: '#16324a', strokeThickness: 4 }).setOrigin(0.5).setDepth(40).setVisible(false);
      t.life = 0; this.floaters.push(t);
    }
    this.fIdx = 0;

    this.keys = this.input.keyboard.addKeys({
      up: 'W', down: 'S', left: 'A', right: 'D', up2: 'UP', down2: 'DOWN', left2: 'LEFT', right2: 'RIGHT'
    });
    this.input.keyboard.on('keydown-SPACE', function (ev) { if (ev.preventDefault) ev.preventDefault(); self.startJump(); });
    this.input.keyboard.on('keydown-R', function () { self.useSkill(); });

    var cam = this.cameras.main;
    cam.setBounds(0, 0, CFG.ARENA_W, CFG.ARENA_H);
    cam.startFollow(this.player, true, 0.12, 0.12);
    this.applyZoom();
    this.scale.on('resize', this.applyZoom, this);

    /* channels */
    var base = 'rooms/' + Net.roomId + '/g/' + Net.k;
    this.inRef = Net.ref(base + '/i');
    this.snapRef = Net.ref(base + '/s');
    this.snapRef.on('value', function (s) { var v = s.val(); if (v) self.onSnap(v); });
    this.inAcc = 0;
    this.onHostLeft = function () { self.lost(TXT.hostLeft); };
    Net.ev.on('hostLeft', this.onHostLeft);

    this.events.once('shutdown', function () {
      self.scale.off('resize', self.applyZoom, self);
      self.snapRef.off();
      Net.ev.off('hostLeft', self.onHostLeft);
      Meta.save();
    });

    this.scene.launch('UI', { gs: 'Guest' });
    CG.gameplayStart();
  },

  applyZoom: function () {
    var w = this.scale.width, h = this.scale.height;
    this.cameras.main.setZoom(Phaser.Math.Clamp(Math.min(w / 820, h / 620), 0.60, 2.0));
  },

  /* ---------- loop ---------- */
  update: function (time, delta) {
    var dt = Math.min(delta, 50);
    this.moveSelf(dt);
    this.lerpWorld(dt);
    this.updateShots(dt);
    this.updateFloaters(dt);
    this.inAcc += delta;
    if (this.inAcc >= INPUT_MS) { this.inAcc = 0; this.sendInput(); }
    /* the host stopped talking */
    if (!this.ended && Date.now() - this.lastSnapAt > 9000) this.lost(TXT.netLost);
  },

  moveSelf: function (dt) {
    var spr = this.player, v = this.view;
    if (this.jumpCd > 0) this.jumpCd -= dt;
    var z = 0;
    if (this.jumpT > 0) { this.jumpT -= dt; z = Math.sin(Phaser.Math.Clamp(1 - this.jumpT / CFG.JUMP_MS, 0, 1) * Math.PI); }
    this.airZ = z;
    if (v.dead || this.ended) { spr.setVelocity(0, 0); this.moving = false; }
    else {
      var vx = 0, vy = 0;
      if (Controls.joy) { vx = Controls.jx; vy = Controls.jy; }
      else {
        var k = this.keys;
        if (k.left.isDown || k.left2.isDown) vx -= 1;
        if (k.right.isDown || k.right2.isDown) vx += 1;
        if (k.up.isDown || k.up2.isDown) vy -= 1;
        if (k.down.isDown || k.down2.isDown) vy += 1;
      }
      var len = Math.sqrt(vx * vx + vy * vy);
      if (len > 1) { vx /= len; vy /= len; }
      spr.setVelocity(vx * v.speed, vy * v.speed);
      this.moving = len > 0.12;
      if (this.moving) { spr.play(skinAnim(this.mySkin), true); spr.flipX = vx < 0; }
      else { spr.stop(); spr.setTexture(skinTex(this.mySkin, 0)); }
      spr.setScale(1 + z * 0.22).setRotation(z * 0.10 * (spr.flipX ? -1 : 1));
    }
    this.shadow.setPosition(spr.x, spr.y + 20).setScale(1 - z * 0.42).setAlpha(v.dead ? 0.2 : 1 - z * 0.55);
    this.tag.setPosition(spr.x, spr.y - 36 - z * 10);
  },

  startJump: function () {
    if (this.view.dead || this.ended || this.jumpT > 0 || this.jumpCd > 0) return;
    this.jumpT = CFG.JUMP_MS; this.jumpCd = CFG.JUMP_MS + 180;
    SFX.play('jump');
  },
  useSkill: function () {
    if (this.view.dead || this.ended) return;
    if (this.view.skills <= 0) { SFX.play('click'); Bus.emit('toast', TXT.skillNone, 1100); return; }
    this.cmd(['r']);
  },
  cmd: function (arr) {
    this.cmdSeq++;
    this.cmds.push([this.cmdSeq].concat(arr));
    this.sendInput();
  },
  sendInput: function () {
    if (this.ended) return;
    var p = this.player;
    try {
      this.inRef.set({
        x: Math.round(p.x), y: Math.round(p.y), f: p.flipX ? 1 : 0, m: this.moving ? 1 : 0,
        a: Math.round(this.airZ * 100), c: this.cmds, k: this.lastEv
      }).catch(function () {});
    } catch (e) {}
  },

  /* ---------- snapshot ---------- */
  onSnap: function (v) {
    this.lastSnapAt = Date.now();
    var i;
    /* commands the host has already applied */
    if (typeof v.ca === 'number') this.cmds = this.cmds.filter(function (c) { return c[0] > v.ca; });

    /* enemies */
    var seen = {};
    var list = arr(v.e);
    for (i = 0; i < list.length; i++) {
      var a = arr(list[i]), id = a[0];
      seen[id] = 1;
      var en = this.enemyMap[id];
      var key = ETYPE_KEY[a[3]] || 'n';
      if (!en) {
        en = this.add.sprite(a[1], a[2], ETYPE[key].tex).setDepth(key === 'b' ? 11 : 10);
        en.play(ETYPE[key].anim);
        en.tx = a[1]; en.ty = a[2]; en.hpf = 1;
        this.enemyMap[id] = en;
      }
      en.tx = a[1]; en.ty = a[2]; en.hpf = a[4] / 100; en.isBoss = key === 'b';
      var flags = a[6];
      if (flags & 1) en.setTintFill(0xffffff);
      else if (flags & 2) en.setTint(0xff8080);
      else if (a[5]) en.setTint(a[5]);
      else en.clearTint();
      en.setAlpha(flags & 4 ? 0.75 : 1);
      en.setScale(a[7] / 100);
      en.flipX = !!a[8];
    }
    for (var k in this.enemyMap) if (!seen[k]) { this.enemyMap[k].destroy(); delete this.enemyMap[k]; }

    /* other players */
    var pseen = {};
    var ps = arr(v.p);
    for (i = 0; i < ps.length; i++) {
      var q = arr(ps[i]), mk = q[0];
      pseen[mk] = 1;
      var m = this.mates[mk];
      if (!m) {
        m = { spr: this.add.sprite(q[1], q[2], skinTex(q[8], 0)).setDepth(11),
              sh: this.add.image(q[1], q[2] + 20, 'shadow').setDepth(9),
              tag: txt(this, q[1], q[2] - 36, q[9], 12, CS.green, '900').setOrigin(0.5).setDepth(13).setStroke('#ffffff', 4),
              skin: q[8] };
        m.spr.play(skinAnim(q[8]));
        this.mates[mk] = m;
      }
      m.tx = q[1]; m.ty = q[2]; m.spr.flipX = !!q[3]; m.dead = !!q[5]; m.hpf = q[6] / 100; m.air = q[7] / 100; m.nick = q[9];
      if (m.dead) m.spr.setTintFill(0x8fa6bb).setAlpha(0.45).setAngle(90);
      else {
        m.spr.clearTint().setAlpha(1).setAngle(0);
        if (q[4]) m.spr.play(skinAnim(m.skin), true); else { m.spr.stop(); m.spr.setTexture(skinTex(m.skin, 0)); }
      }
    }
    for (var mk2 in this.mates) if (!pseen[mk2]) {
      var mm = this.mates[mk2]; mm.spr.destroy(); mm.sh.destroy(); mm.tag.destroy(); delete this.mates[mk2];
    }

    /* gems and drops (cosmetic) */
    this.syncPool(this.gemPool, arr(v.gm), function (s, a) { s.setTexture(a[2] ? 'gem2' : 'gem'); }, 8);
    this.syncPool(this.dropPool, arr(v.dr), function (s, a) { s.setTexture(a[2] ? 'magnet' : 'heart'); }, 8);

    /* my numbers */
    var me = v.me;
    if (me) {
      var vw = this.view, wasDead = vw.dead;
      vw.hp = me.hp; vw.maxHp = me.mx; vw.level = me.lv; vw.xp = me.xp; vw.xpNext = me.xn;
      vw.kills = me.k; vw.score = me.sc; vw.sap = me.sap; vw.skills = me.sk;
      vw.weapons = arr(me.w).map(function (w) { w = arr(w); return { id: w[0], lv: w[1] }; });
      vw.speed = me.spd || 252; vw.dead = !!me.dead; vw.respawn = me.rs;
      vw.choosing = !!me.ch; vw.chooseT = me.ct;
      if (!me.ch && this.choiceLid) { this.choiceLid = 0; Bus.emit('levelclose'); }
      /* bank kills as they happen, so leaving early still counts */
      if (me.k > this.banked) {
        Meta.addKills(me.k - this.banked); this.banked = me.k;
        if (Meta.justPlaced) { Meta.justPlaced = false; Bus.emit('notice', fmt(TXT.placed, { t: rankName(Meta.rank) })); }
      }
      var spr = this.player;
      if (vw.dead && !wasDead) { spr.setTintFill(0x8fa6bb).setAlpha(0.45).setAngle(90); }
      if (!vw.dead && wasDead) {
        spr.clearTint().setAlpha(1).setAngle(0);
        /* the host may have moved us while we were down */
        if (Phaser.Math.Distance.Between(spr.x, spr.y, me.x, me.y) > 60) spr.body.reset(me.x, me.y);
      }
    }
    if (v.st) {
      this.view.boss = v.st.bh >= 0 ? v.st.bh / 1000 : -1;
      this.state.endless = !!v.st.en;
    }
    this.state.time = v.t || 0;

    /* cosmetic events */
    var fx = arr(v.fx);
    for (i = 0; i < fx.length; i++) this.playFx(arr(fx[i]));
    /* reliable events, in order, once each */
    var ev = arr(v.ev);
    for (i = 0; i < ev.length; i++) {
      var e1 = arr(ev[i]);
      if (e1[0] <= this.lastEv) continue;
      this.lastEv = e1[0];
      this.handleEv(e1);
    }
  },

  syncPool: function (pool, list, style, depth) {
    for (var i = 0; i < list.length; i++) {
      var a = arr(list[i]);
      var s = pool[i];
      if (!s) { s = this.add.image(a[0], a[1], 'gem').setDepth(depth); pool.push(s); }
      s.setVisible(true);
      style(s, a);
      s.tx = a[0]; s.ty = a[1];
      if (!s.placed) { s.setPosition(s.tx, s.ty); s.placed = true; }
    }
    for (; i < pool.length; i++) { pool[i].setVisible(false); pool[i].placed = false; }
  },

  lerpWorld: function (dt) {
    var f = Math.min(1, dt * 0.012), k, e;
    for (k in this.enemyMap) {
      e = this.enemyMap[k];
      e.x += (e.tx - e.x) * f; e.y += (e.ty - e.y) * f;
    }
    for (k in this.mates) {
      var m = this.mates[k];
      m.spr.x += (m.tx - m.spr.x) * f; m.spr.y += (m.ty - m.spr.y) * f;
      if (!m.dead) m.spr.setScale(1 + (m.air || 0) * 0.22);
      m.sh.setPosition(m.spr.x, m.spr.y + 20).setAlpha(m.dead ? 0.2 : 1);
      m.tag.setPosition(m.spr.x, m.spr.y - 36);
    }
    var pools = [this.gemPool, this.dropPool];
    for (var p = 0; p < 2; p++) for (var i = 0; i < pools[p].length; i++) {
      var g = pools[p][i];
      if (!g.visible) continue;
      g.x += (g.tx - g.x) * f; g.y += (g.ty - g.y) * f;
    }
  },

  /* ---------- cosmetics ---------- */
  playFx: function (a) {
    var self = this, near;
    switch (a[0]) {
      case 'b': {           /* bullet: [type, x, y, ang*100, speed, life, tint] */
        var tex = a[1] === 0 ? 'bul' : (a[1] === 1 ? 'arrow' : 'bombp');
        var ang = a[4] / 100;
        var s = this.add.image(a[2], a[3], tex).setDepth(20).setRotation(ang);
        if (a[7]) s.setTint(a[7]);
        this.shots.push({ s: s, vx: Math.cos(ang) * a[5], vy: Math.sin(ang) * a[5], life: a[6], stop: a[1] === 0, spin: a[1] === 2 });
        near = this.near(a[2], a[3]);
        if (near) SFX.play(a[1] === 1 ? 'arrow' : 'shoot');
        break;
      }
      case 's': {           /* slash: [x, y, ang*100, scale*100, tint] */
        var sc = a[4] / 100;
        var sl = this.add.image(a[1], a[2], 'slash').setDepth(22).setRotation(a[3] / 100)
          .setScale(sc * 0.6).setAlpha(0.95).setTint(a[5]);
        this.tweens.add({ targets: sl, scale: sc, alpha: 0, duration: 170, onComplete: function () { sl.destroy(); } });
        if (this.near(a[1], a[2])) SFX.play('swing');
        break;
      }
      case 'x': {           /* explosion: [x, y, r] */
        var r = this.add.image(a[1], a[2], 'ring').setDepth(25).setScale(0.15).setAlpha(0.9).setTint(0xffb36b);
        this.tweens.add({ targets: r, scale: a[3] / 56, alpha: 0, duration: 300, onComplete: function () { r.destroy(); } });
        this.deathFx.emitParticleAt(a[1], a[2], 14);
        if (this.near(a[1], a[2])) { SFX.play('explode'); this.cameras.main.shake(100, 0.004); }
        break;
      }
      case 'w': {           /* shockwave: [x, y, r] */
        for (var k2 = 0; k2 < 2; k2++) {
          var ring = this.add.image(a[1], a[2], 'ring').setDepth(26).setScale(0.1).setAlpha(0.95).setTint(k2 ? 0xffffff : C.cyan);
          this.tweens.add({ targets: ring, scale: a[3] / 56, alpha: 0, duration: 380, delay: k2 * 90, ease: 'Cubic.Out',
            onComplete: (function (img) { return function () { img.destroy(); }; })(ring) });
        }
        this.deathFx.emitParticleAt(a[1], a[2], 26);
        SFX.play('shock');
        if (Phaser.Math.Distance.Between(a[1], a[2], this.player.x, this.player.y) < 30) {
          this.cameras.main.shake(240, 0.012); this.cameras.main.flash(120, 200, 240, 255);
        }
        break;
      }
      case 'f': this.showFloat(a[1], a[2], a[3]); break;
      case 'k':
        this.deathFx.emitParticleAt(a[1], a[2], a[3] ? 30 : 7);
        if (this.near(a[1], a[2])) SFX.play(a[3] ? 'explode' : 'kill');
        break;
      case 'h':             /* I got hit */
        SFX.play('hurt');
        this.cameras.main.shake(90, 0.007);
        this.player.setTintFill(0xff5555);
        this.time.delayedCall(90, function () { if (!self.view.dead) self.player.clearTint(); });
        Bus.emit('playerHurt');
        break;
      case 'p': SFX.play('pickup'); break;
    }
  },
  near: function (x, y) { return Phaser.Math.Distance.Between(x, y, this.player.x, this.player.y) < 420; },
  updateShots: function (dt) {
    var keep = [], i, j;
    for (i = 0; i < this.shots.length; i++) {
      var b = this.shots[i];
      b.life -= dt;
      b.s.x += b.vx * dt / 1000; b.s.y += b.vy * dt / 1000;
      if (b.spin) b.s.rotation += dt * 0.012;
      var dead = b.life <= 0;
      if (!dead && b.stop) {          /* plain bullets vanish on the first enemy they touch */
        for (var k in this.enemyMap) {
          var e = this.enemyMap[k];
          if (Math.abs(e.x - b.s.x) < 16 && Math.abs(e.y - b.s.y) < 20) { dead = true; break; }
        }
      }
      if (dead) b.s.destroy(); else keep.push(b);
    }
    this.shots = keep;
  },
  showFloat: function (x, y, n) {
    var t = this.floaters[this.fIdx];
    this.fIdx = (this.fIdx + 1) % this.floaters.length;
    t.setText(String(n)).setPosition(x, y).setVisible(true).setAlpha(1);
    t.life = 500;
  },
  updateFloaters: function (dt) {
    for (var i = 0; i < this.floaters.length; i++) {
      var t = this.floaters[i];
      if (t.life <= 0) continue;
      t.life -= dt; t.y -= dt * 0.035;
      t.setAlpha(Math.max(0, t.life / 500));
      if (t.life <= 0) t.setVisible(false);
    }
  },

  /* ---------- reliable events from the host ---------- */
  handleEv: function (e) {
    var type = e[1];
    if (type === 'L') {                 /* level up: [lid, choices] */
      this.choiceLid = e[2];
      this.choices = arr(e[3]);
      SFX.play('levelup');
      Bus.emit('levelup', this.choices, true);
    } else if (type === 'D') {
      Bus.emit('notice', fmt(TXT.died, { n: e[2] }));
      if (e[3] === Net.k) SFX.play('over'); else SFX.play('hurt');
    } else if (type === 'R') {
      Bus.emit('notice', fmt(TXT.revived, { n: e[2] }));
    } else if (type === 'B') {
      SFX.play('boss'); this.cameras.main.flash(240, 255, 210, 210); Bus.emit('boss', TXT.boss);
    } else if (type === 'T') {
      Bus.emit('toast', e[2]); if (e[3]) SFX.play(e[3]);
    } else if (type === 'O') {
      this.finish(e[2], false);
    } else if (type === 'V') {
      this.finish(e[2], true);
    } else if (type === 'E') {
      this.ended = false; this.state.over = false;
      Bus.emit('endless');
    } else if (type === 'Q') {
      this.leave(true);
    }
  },

  finish: function (d, victory) {
    if (this.ended) return;
    this.ended = true;
    this.state.over = true;
    this.sendInput();                   /* ack the event before we stop sending */
    SFX.play(victory ? 'win' : 'over');
    CG.gameplayStop();
    var b = bankRun(d.score, d.sap, d.kills, d.time);
    var data = Object.assign({}, d, { best: b.best, isBest: b.isBest, lvUp: b.lvUp, canRevive: false, party: true, host: false });
    if (victory) Bus.emit('victory', data); else Bus.emit('gameover', Object.assign(data, { wiped: true }));
  },

  lost: function (msg) {
    if (this.leaving) return;
    this.leaving = true;
    var self = this;
    Bus.emit('notice', msg);
    this.time.delayedCall(1600, function () { self.leave(false); });
  },

  /* UI hooks (same names the solo scene offers) */
  applyChoice: function (c) {
    if (!this.choiceLid || !this.choices) return;
    var idx = this.choices.indexOf(c);
    if (idx < 0) for (var i = 0; i < this.choices.length; i++) if (this.choices[i].name === c.name) idx = i;
    if (idx < 0) idx = 0;
    this.cmd(['p', idx, this.choiceLid]);
    this.choiceLid = 0;
    SFX.play('select');
  },
  restartRun: function () { this.leave(false); },
  quitToMenu: function () { this.leave(false); },
  leave: function (lobby) {
    /* walking out mid-run means walking out of the party too */
    if (!lobby && !this.state.over && !this.leaving) Net.leaveRoom();
    this.ended = true;
    CG.gameplayStop();
    this.scene.stop('UI');
    this.scene.start('Menu');
  },
  hud: function () {
    var v = this.view, mates = [];
    for (var k in this.mates) { var m = this.mates[k]; mates.push({ nick: m.nick, hpf: m.hpf, dead: m.dead, rs: 0 }); }
    return {
      hp: v.hp, maxHp: v.maxHp, level: v.level, xp: v.xp, xpNext: v.xpNext, score: v.score, kills: v.kills,
      sap: v.sap, skills: v.skills, weapons: v.weapons, time: this.state.time, endless: this.state.endless,
      over: this.state.over, boss: v.boss, dead: v.dead, respawn: v.respawn, choosing: v.choosing,
      chooseT: v.chooseT, party: true, host: false, mates: mates
    };
  }
});

/* =====================================================================
   16b. PROMOTION TRIAL  —  15 bosses, Uzi only, fixed stats
   ---------------------------------------------------------------
   Win: one step up (GOLD 1 -> GOLD 2, GOLD 3 -> DIAMOND 1).
   Lose (or give up): one step down; COPPER 1 never drops.
   Difficulty follows the tier you are trying to leave:
     COPPER/BRONZE   slow bosses, melee only            (almost everyone passes)
     SILVER/GOLD     faster, charge attacks              (about half)
     DIAMOND         tougher, slow aimed shots           (about 1 in 4)
     SAPPHIRE        faster 3-way shots, bigger groups   (about 1 in 10)
     RUBY            bosses use guns: bursts + shotguns, always a gap (about 1 in 50)
     RAMANE          bullet-hell patterns, no shockwave, no healing
   Stats are fixed (200 HP, Uzi) so shop upgrades cannot buy a tier.
   ===================================================================== */
var PROMO_W = 1200, PROMO_H = 900, PROMO_BOSSES = 15;

function promoSpec(r) {
  r = Math.max(0, Math.min(RANK_MAX, r));
  var t = Math.min(7, Math.floor(r / 3)), d = r >= RANK_MAX ? 2 : r % 3;
  var eff = t + d * 0.33;
  var groups;
  if (t <= 1) groups = [1, 1, 1, 1, 1, 1, 1, 1, 1, 2, 2, 2];
  else if (t <= 3) groups = [1, 1, 1, 1, 1, 1, 2, 2, 2, 3];
  else if (t === 4) groups = [1, 1, 1, 1, 2, 2, 2, 2, 3];
  else groups = [1, 1, 2, 2, 2, 3, 2, 2];
  return {
    t: t, eff: eff, groups: groups,
    hp: Math.round(240 + eff * 55),
    speed: 72 + eff * 11,
    dmg: 12 + eff * 2.6,
    dash: t >= 2, dashEvery: Math.max(1900, 3600 - eff * 180),
    shoot: t >= 7 ? 'hell' : (t === 6 ? 'gun' : (t === 5 ? 'fast' : (t === 4 ? 'slow' : null))),
    shock: t < 7 ? 1 : 0,
    heal: t < 7 ? 0.12 : 0,
    timeMs: 6 * 60000
  };
}

var PromoScene = new Phaser.Class({
  Extends: Phaser.Scene,
  initialize: function PromoScene() { Phaser.Scene.call(this, { key: 'Promo' }); },

  create: function () {
    var self = this;
    adPanel(false);
    Net.setStatus('game');
    this.cameras.main.setBackgroundColor(C.out);
    this.physics.world.setBounds(0, 0, PROMO_W, PROMO_H);
    this.cameras.main.setBounds(0, 0, PROMO_W, PROMO_H);
    this.cameras.main.setZoom(1);

    this.rank0 = Meta.rank;
    this.spec = promoSpec(Meta.rank);
    this.over = false; this.paused = false;
    this.left = this.spec.timeMs;
    this.killed = 0; this.groupIdx = 0; this.nextGroupT = 1200;
    this.maxHp = 200; this.hp = 200;
    this.iFrame = 0; this.jumpT = 0; this.jumpCd = 0; this.airZ = 0;
    this.fireCd = 0; this.skills = this.spec.shock;

    /* arena */
    this.add.tileSprite(0, 0, PROMO_W, PROMO_H, 'tile').setOrigin(0).setDepth(0);
    var border = this.add.graphics().setDepth(1);
    border.lineStyle(10, rankTier(Math.max(0, this.rank0)).b, 0.5);
    border.strokeRect(5, 5, PROMO_W - 10, PROMO_H - 10);
    this.obstacles = this.physics.add.staticGroup();
    var spots = [[300, 240], [900, 240], [300, 660], [900, 660], [600, 450]];
    for (var i = 0; i < spots.length; i++) this.obstacles.create(spots[i][0], spots[i][1], 'rock').setDepth(6);

    /* player */
    this.pShadow = this.add.image(0, 0, 'shadow').setDepth(9);
    this.player = this.physics.add.sprite(PROMO_W / 2, PROMO_H - 140, PTEX(0)).setDepth(12);
    this.player.body.setCircle(12, this.player.width / 2 - 12, this.player.height / 2 - 12);
    this.player.setCollideWorldBounds(true);
    this.player.play(PANIM());
    this.physics.add.collider(this.player, this.obstacles);

    this.bosses = this.physics.add.group();
    this.pShots = this.physics.add.group({ maxSize: 200 });
    this.bShots = this.physics.add.group({ maxSize: 500 });
    this.physics.add.collider(this.bosses, this.obstacles);
    this.physics.add.overlap(this.pShots, this.bosses, this.hitBoss, null, this);
    this.physics.add.overlap(this.player, this.bShots, this.hitPlayer, null, this);
    this.physics.add.overlap(this.player, this.bosses, this.bodyHit, null, this);
    this.physics.add.collider(this.pShots, this.obstacles, function (b) { b.disableBody(true, true); });
    this.physics.add.collider(this.bShots, this.obstacles, function (b) { b.disableBody(true, true); });
    this.sparks = this.add.particles(0, 0, 'spark', {
      speed: { min: 60, max: 240 }, lifespan: 420, quantity: 8, scale: { start: 1, end: 0 }, emitting: false
    }).setDepth(24);

    this.cameras.main.startFollow(this.player, true, 0.12, 0.12);
    this.buildHud();
    this.buildInput();
    this.scale.on('resize', this.layoutHud, this);
    this.events.once('shutdown', function () {
      self.scale.off('resize', self.layoutHud, self);
      Controls.joy = false; Controls.jx = 0; Controls.jy = 0;
    });
    this.toast(TXT.promoTitle + '  ' + rankName(this.rank0) + ' ▶ ' + rankName(Math.min(RANK_MAX, this.rank0 + 1)), 2400);
  },

  /* ---------------- HUD (scrollFactor 0, camera zoom stays 1) ---------------- */
  buildHud: function () {
    var sf = function (o) { return o.setScrollFactor(0); };
    this.hud = sf(this.add.graphics().setDepth(900));
    this.timeT = sf(txt(this, 0, 0, '', 20, CS.ink).setOrigin(0.5).setDepth(901));
    this.leftT = sf(txt(this, 0, 0, '', 15, CS.ink, '900').setOrigin(0.5).setDepth(901));
    this.hpT = sf(txt(this, 0, 0, '', 13, CS.white, '900').setOrigin(0.5).setDepth(901));
    this.rankIcon = sf(this.add.image(0, 0, rankTex(this.rank0)).setScale(0.5).setDepth(901));
    this.rankT = sf(txt(this, 0, 0, rankName(this.rank0), 13, CS.ink, '900').setOrigin(0, 0.5).setDepth(901));
    this.skillT = sf(txt(this, 0, 0, '', 13, CS.gold, '900').setOrigin(0, 0.5).setDepth(901));
    this.toastT = sf(txt(this, 0, 0, '', 18, CS.ink, '900').setOrigin(0.5).setDepth(905).setAlpha(0).setStroke('#ffffff', 5));
    var self = this;
    this.pauseBtn = makeIconButton(this, 0, 0, 40, '⏸', function () { self.askQuit(); });
    this.pauseBtn.setScrollFactor(0, 0, true).setDepth(902);
    this.layoutHud();
  },
  layoutHud: function () {
    var w = this.scale.width, h = this.scale.height;
    this.timeT.setPosition(w / 2, 26);
    this.leftT.setPosition(w / 2, 58);
    this.rankIcon.setPosition(30, 34);
    this.rankT.setPosition(50, 28);
    this.skillT.setPosition(50, 46);
    this.toastT.setPosition(w / 2, h * 0.24);
    this.pauseBtn.setPosition(w - 32, 32);
    if (this.jumpBtn) {
      this.jumpBtn.setPosition(w - 56, h - 62); this.jumpIco.setPosition(w - 56, h - 62);
      this.skillBtn.setPosition(w - 56, h - 142); this.skillIco.setPosition(w - 56, h - 142);
    }
  },
  drawHud: function () {
    var w = this.scale.width, h = this.scale.height, g = this.hud;
    g.clear();
    g.fillStyle(0xffffff, 0.88); g.fillRoundedRect(w / 2 - 60, 10, 120, 32, 12);
    g.fillStyle(0xffffff, 0.80); g.fillRoundedRect(w / 2 - 80, 46, 160, 24, 10);
    g.fillStyle(0xffffff, 0.86); g.fillRoundedRect(10, 12, 150, 46, 12);
    var bw = Math.min(300, w * 0.4), bx = 16, by = h - 40;
    g.fillStyle(0x16324a, 0.16); g.fillRoundedRect(bx - 2, by - 2, bw + 4, 26, 12);
    g.fillStyle(0xffffff, 0.9); g.fillRoundedRect(bx, by, bw, 22, 10);
    var f = Math.max(0, this.hp / this.maxHp);
    g.fillStyle(f > 0.5 ? C.green : (f > 0.22 ? C.gold : C.red), 1);
    g.fillRoundedRect(bx, by, Math.max(6, bw * f), 22, 10);
    this.hpT.setText(Math.ceil(Math.max(0, this.hp)) + ' / ' + this.maxHp).setPosition(bx + bw / 2, by + 11);
    this.timeT.setText(fmtTime(Math.max(0, this.left))).setColor(this.left < 30000 ? CS.red : CS.ink);
    this.leftT.setText(TXT.bossLeft + '  ' + (PROMO_BOSSES - this.killed) + ' / ' + PROMO_BOSSES);
    this.skillT.setText(this.spec.shock ? 'R x' + this.skills : 'R -').setColor(this.skills > 0 ? CS.gold : '#9fb3c4');
  },
  toast: function (msg, dur) {
    this.toastT.setText(msg).setAlpha(1);
    this.tweens.killTweensOf(this.toastT);
    this.tweens.add({ targets: this.toastT, alpha: 0, delay: dur || 1400, duration: 400 });
  },

  /* ---------------- input ---------------- */
  buildInput: function () {
    var self = this;
    this.keys = this.input.keyboard.addKeys({
      up: 'W', down: 'S', left: 'A', right: 'D', up2: 'UP', down2: 'DOWN', left2: 'LEFT', right2: 'RIGHT'
    });
    this.input.keyboard.on('keydown-SPACE', function (e) { if (e.preventDefault) e.preventDefault(); self.doJump(); });
    this.input.keyboard.on('keydown-R', function () { self.doSkill(); });
    this.input.keyboard.on('keydown-ESC', function () { self.askQuit(); });
    this.input.addPointer(2);
    this.joyId = null;
    this.joyBase = this.add.circle(0, 0, 42, C.ink, 0.10).setScrollFactor(0).setDepth(940).setVisible(false);
    this.joyThumb = this.add.circle(0, 0, 18, C.cyan, 0.55).setScrollFactor(0).setDepth(941).setVisible(false);
    this.jumpBtn = this.add.circle(0, 0, 34, C.cyan, 0.22).setStrokeStyle(4, C.cyan, 0.6).setScrollFactor(0).setDepth(940)
      .setInteractive({ useHandCursor: true });
    this.jumpIco = txt(this, 0, 0, '↑', 24, CS.cyan).setOrigin(0.5).setScrollFactor(0).setDepth(941);
    this.skillBtn = this.add.circle(0, 0, 34, C.gold, 0.24).setStrokeStyle(4, C.gold, 0.65).setScrollFactor(0).setDepth(940)
      .setInteractive({ useHandCursor: true });
    this.skillIco = txt(this, 0, 0, 'R', 22, CS.gold).setOrigin(0.5).setScrollFactor(0).setDepth(941);
    this.jumpBtn.on('pointerdown', function () { self.doJump(); });
    this.skillBtn.on('pointerdown', function () { self.doSkill(); });
    this.layoutHud();

    this.input.on('pointerdown', function (p) {
      if (p.wasTouch) Controls.touch = true;
      if (self.over || self.paused || !Controls.touch) return;
      if (p.y < self.scale.height * 0.14) return;
      if (Phaser.Math.Distance.Between(p.x, p.y, self.jumpBtn.x, self.jumpBtn.y) < 42) return;
      if (Phaser.Math.Distance.Between(p.x, p.y, self.skillBtn.x, self.skillBtn.y) < 42) return;
      if (self.joyId !== null) return;
      self.joyId = p.id; self.joyOx = p.x; self.joyOy = p.y;
      self.joyBase.setPosition(p.x, p.y).setVisible(true); self.joyThumb.setPosition(p.x, p.y).setVisible(true);
      Controls.joy = true; Controls.jx = 0; Controls.jy = 0;
    });
    this.input.on('pointermove', function (p) {
      if (p.id !== self.joyId) return;
      var dx = p.x - self.joyOx, dy = p.y - self.joyOy, d = Math.sqrt(dx * dx + dy * dy), a = Math.atan2(dy, dx), cl = Math.min(d, 42);
      self.joyThumb.setPosition(self.joyOx + Math.cos(a) * cl, self.joyOy + Math.sin(a) * cl);
      var mag = Phaser.Math.Clamp(d / (42 * 0.45), 0, 1);
      Controls.jx = Math.cos(a) * mag; Controls.jy = Math.sin(a) * mag;
    });
    var rel = function (p) {
      if (p.id !== self.joyId) return;
      self.joyId = null; Controls.joy = false; Controls.jx = 0; Controls.jy = 0;
      self.joyBase.setVisible(false); self.joyThumb.setVisible(false);
    };
    this.input.on('pointerup', rel);
    this.input.on('pointerupoutside', rel);
  },

  doJump: function () {
    if (this.over || this.paused || this.jumpT > 0 || this.jumpCd > 0) return;
    this.jumpT = CFG.JUMP_MS; this.jumpCd = CFG.JUMP_MS + 180;
    SFX.play('jump');
  },
  doSkill: function () {
    if (this.over || this.paused) return;
    if (this.skills <= 0) { SFX.play('click'); return; }
    this.skills--;
    var x = this.player.x, y = this.player.y, self = this;
    SFX.play('shock');
    this.cameras.main.shake(240, 0.012);
    this.cameras.main.flash(120, 200, 240, 255);
    var r = this.add.image(x, y, 'ring').setDepth(26).setScale(0.1).setTint(C.cyan);
    this.tweens.add({ targets: r, scale: 260 / 56, alpha: 0, duration: 380, onComplete: function () { r.destroy(); } });
    this.bShots.getChildren().forEach(function (b) { if (b.active) b.disableBody(true, true); });
    this.bosses.getChildren().forEach(function (b) {
      if (b.active && Phaser.Math.Distance.Between(x, y, b.x, b.y) < 260) self.damageBoss(b, 150);
    });
  },

  /* ---------------- bosses ---------------- */
  spawnGroup: function (n) {
    var sp = this.spec;
    for (var i = 0; i < n; i++) {
      var x = 120 + Math.random() * (PROMO_W - 240), y = 90 + Math.random() * 160;
      if (Phaser.Math.Distance.Between(x, y, this.player.x, this.player.y) < 300) y = PROMO_H - y;
      var b = this.bosses.create(x, y, 'e_b_0');
      b.setDepth(11).setScale(0.82 + sp.t * 0.03);
      b.body.setCircle(30, b.width / 2 - 30, b.height / 2 - 30);
      b.setCollideWorldBounds(true);
      b.play('w_b');
      b.maxHp = b.hp = sp.hp;
      b.tint0 = rankTier(Math.max(0, this.rank0)).a;
      b.setTint(b.tint0);
      b.phase = Math.random() * 6.28;
      b.dashT = sp.dashEvery * (0.6 + Math.random() * 0.6); b.dashing = 0; b.tele = 0;
      b.fireT = 900 + Math.random() * 900; b.spin = Math.random() * 6.28; b.burst = 0; b.pat = (Math.random() * 3) | 0;
      b.nextBody = 0;
      b.bar = this.add.graphics().setDepth(30);
    }
    SFX.play('boss');
  },

  updateBoss: function (b, time, dt) {
    var sp = this.spec, p = this.player;
    var d = Phaser.Math.Distance.Between(b.x, b.y, p.x, p.y);
    var ang = Math.atan2(p.y - b.y, p.x - b.x);
    var spd = sp.speed;
    if (b.tele > 0) {                                /* wind-up before a charge: stand still, flash */
      b.tele -= dt; b.body.setVelocity(0, 0);
      if (b.tele <= 0) { b.dashing = 600; b.setTint(0xff6060); }
      return;
    }
    if (b.dashing > 0) {
      b.dashing -= dt;
      b.body.setVelocity(Math.cos(b.lead) * spd * 3.3, Math.sin(b.lead) * spd * 3.3);
      if (b.dashing <= 0) b.setTint(b.tint0);
      return;
    }
    if (sp.dash) {
      b.dashT -= dt;
      if (b.dashT <= 0 && d < 520) {
        b.dashT = sp.dashEvery * (0.8 + Math.random() * 0.5);
        b.tele = 320;
        b.setTint(0xffffff);
        var pv = p.body.velocity;
        b.lead = Math.atan2(p.y + pv.y * 0.3 - b.y, p.x + pv.x * 0.3 - b.x);
        SFX.play('charge');
      }
    }
    var move = ang + Math.sin(time * 0.0016 + b.phase) * 0.55;
    if (sp.shoot) {                                  /* shooters keep a distance and strafe */
      var want = sp.shoot === 'hell' ? 300 : 250;
      if (d < want) move = ang + Math.PI * 0.6 * (Math.sin(b.phase) > 0 ? 1 : -1);
    }
    b.body.setVelocity(Math.cos(move) * spd, Math.sin(move) * spd);
    b.flipX = p.x < b.x;
    if (sp.shoot) this.bossShoot(b, ang, dt);
  },

  /* one enemy bullet */
  eShot: function (x, y, a, speed, dmg) {
    var s = this.bShots.get(x, y, 'ebul');
    if (!s) return;
    s.enableBody(true, x, y, true, true);
    s.setActive(true).setVisible(true).setTexture('ebul').clearTint().setScale(1).setDepth(21);
    s.body.setCircle(5, 2, 2);
    s.body.setVelocity(Math.cos(a) * speed, Math.sin(a) * speed);
    s.dmg = dmg; s.life = 4200;
  },
  bossShoot: function (b, ang, dt) {
    var sp = this.spec, mode = sp.shoot;
    b.fireT -= dt;
    if (mode === 'hell') {
      /* spiral arms never stop; rings and aimed bursts on a timer */
      b.spinT = (b.spinT || 0) - dt;
      if (b.spinT <= 0) {
        b.spinT = 130;
        b.spin += 0.32;
        for (var a = 0; a < 2; a++) this.eShot(b.x, b.y, b.spin + a * Math.PI, 175, 14);
      }
      if (b.fireT <= 0) {
        b.fireT = 2300;
        b.pat = (b.pat + 1) % 3;
        if (b.pat === 0) for (var i = 0; i < 16; i++) this.eShot(b.x, b.y, i * Math.PI / 8 + b.spin, 160, 14);
        else if (b.pat === 1) { b.burst = 5; b.burstT = 0; }
        else for (var j = -3; j <= 3; j++) this.eShot(b.x, b.y, ang + j * 0.16, 210, 14);
        SFX.play('shoot');
      }
    } else if (b.fireT <= 0) {
      if (mode === 'slow') { b.fireT = 1800; this.eShot(b.x, b.y, ang + (Math.random() - 0.5) * 0.2, 170, 12); }
      else if (mode === 'fast') {
        b.fireT = 1400;
        for (var k = -1; k <= 1; k++) this.eShot(b.x, b.y, ang + k * 0.22, 230, 12);
      } else if (mode === 'gun') {
        /* alternate: 3-round burst, then a 5-pellet shotgun with a clear gap at its edges */
        b.fireT = 1650;
        b.pat = (b.pat + 1) % 2;
        if (b.pat === 0) { b.burst = 3; b.burstT = 0; }
        else for (var m = -2; m <= 2; m++) this.eShot(b.x, b.y, ang + m * 0.2, 250, 12);
      }
      SFX.play('shoot');
    }
    if (b.burst > 0) {
      b.burstT -= dt;
      if (b.burstT <= 0) {
        b.burst--; b.burstT = mode === 'hell' ? 120 : 95;
        this.eShot(b.x, b.y, ang + (Math.random() - 0.5) * 0.08, mode === 'hell' ? 260 : 300, 12);
      }
    }
  },

  /* ---------------- player fire: the Uzi aims itself ---------------- */
  autoFire: function (dt) {
    this.fireCd -= dt;
    if (this.fireCd > 0) return;
    var best = null, bd = 650 * 650, list = this.bosses.getChildren(), p = this.player;
    for (var i = 0; i < list.length; i++) {
      var b = list[i]; if (!b.active) continue;
      var dx = b.x - p.x, dy = b.y - p.y, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = b; }
    }
    if (!best) { this.fireCd = 120; return; }
    this.fireCd = 85;
    var a = Math.atan2(best.y - p.y, best.x - p.x) + (Math.random() - 0.5) * 0.14;
    var s = this.pShots.get(p.x, p.y, 'bul');
    if (!s) return;
    s.enableBody(true, p.x, p.y, true, true);
    s.setActive(true).setVisible(true).setTexture('bul').setTint(0xffe27a).setScale(0.85).setDepth(20);
    s.body.setCircle(5, 1, 1);
    s.body.setVelocity(Math.cos(a) * 700, Math.sin(a) * 700);
    s.dmg = 8; s.life = 950;
    SFX.play('shoot');
  },
  tick: function (grp, dt) {
    var list = grp.getChildren();
    for (var i = 0; i < list.length; i++) {
      var s = list[i];
      if (!s.active) continue;
      s.life -= dt;
      if (s.life <= 0 || s.x < -30 || s.y < -30 || s.x > PROMO_W + 30 || s.y > PROMO_H + 30) s.disableBody(true, true);
    }
  },

  hitBoss: function (s, b) {
    if (!s.active || !b.active) return;
    s.disableBody(true, true);
    this.damageBoss(b, s.dmg);
  },
  damageBoss: function (b, dmg) {
    if (this.over) return;
    b.hp -= dmg;
    this.sparks.emitParticleAt(b.x, b.y, 3);
    SFX.play('hit');
    if (b.hp <= 0) {
      this.sparks.emitParticleAt(b.x, b.y, 26);
      SFX.play('explode');
      this.cameras.main.shake(200, 0.008);
      b.bar.destroy();
      b.destroy();
      this.killed++;
      if (this.spec.heal) this.hp = Math.min(this.maxHp, this.hp + this.maxHp * this.spec.heal);
      if (this.killed >= PROMO_BOSSES) this.finish(true);
    }
  },
  hurt: function (dmg) {
    if (this.over || this.iFrame > 0 || this.airZ > 0.25) return false;
    this.hp -= dmg;
    this.iFrame = 260;
    SFX.play('hurt');
    this.cameras.main.shake(100, 0.007);
    this.player.setTintFill(0xff5555);
    var pl = this.player;
    this.time.delayedCall(90, function () { pl.clearTint(); });
    if (this.hp <= 0) { this.hp = 0; this.finish(false); }
    return true;
  },
  hitPlayer: function (pl, s) {
    if (!s.active) return;
    if (this.airZ > 0.25) return;           /* jumping over bullets */
    s.disableBody(true, true);
    this.hurt(s.dmg);
  },
  bodyHit: function (pl, b) {
    var now = this.time.now;
    if (now < b.nextBody) return;
    if (this.hurt(this.spec.dmg * (b.dashing > 0 ? 1.4 : 1))) {
      b.nextBody = now + 700;
      var a = Math.atan2(pl.y - b.y, pl.x - b.x);
      pl.body.velocity.x += Math.cos(a) * 240; pl.body.velocity.y += Math.sin(a) * 240;
    }
  },

  /* ---------------- loop ---------------- */
  update: function (time, delta) {
    if (this.over || this.paused) return;
    var dt = Math.min(delta, 50);
    this.left -= dt;
    if (this.iFrame > 0) this.iFrame -= dt;

    /* move */
    var vx = 0, vy = 0;
    if (Controls.joy) { vx = Controls.jx; vy = Controls.jy; }
    else {
      var k = this.keys;
      if (k.left.isDown || k.left2.isDown) vx -= 1;
      if (k.right.isDown || k.right2.isDown) vx += 1;
      if (k.up.isDown || k.up2.isDown) vy -= 1;
      if (k.down.isDown || k.down2.isDown) vy += 1;
    }
    var len = Math.sqrt(vx * vx + vy * vy);
    if (len > 1) { vx /= len; vy /= len; }
    this.player.setVelocity(vx * 252, vy * 252);
    if (len > 0.12) { this.player.play(PANIM(), true); this.player.flipX = vx < 0; }
    else { this.player.stop(); this.player.setTexture(PTEX(0)); }

    if (this.jumpCd > 0) this.jumpCd -= dt;
    var z = 0;
    if (this.jumpT > 0) { this.jumpT -= dt; z = Math.sin(Phaser.Math.Clamp(1 - this.jumpT / CFG.JUMP_MS, 0, 1) * Math.PI); }
    this.airZ = z;
    this.player.setScale(1 + z * 0.22);
    this.pShadow.setPosition(this.player.x, this.player.y + 20).setScale(1 - z * 0.42).setAlpha(1 - z * 0.55);

    /* waves */
    if (this.bosses.countActive(true) === 0 && this.groupIdx < this.spec.groups.length) {
      this.nextGroupT -= dt;
      if (this.nextGroupT <= 0) {
        this.spawnGroup(this.spec.groups[this.groupIdx++]);
        this.nextGroupT = 900;
      }
    }
    var list = this.bosses.getChildren();
    for (var i = 0; i < list.length; i++) {
      var b = list[i];
      if (!b.active) continue;
      this.updateBoss(b, time, dt);
      var g = b.bar;
      g.clear();
      g.fillStyle(0x16324a, 0.25); g.fillRect(b.x - 30, b.y - 58, 60, 6);
      g.fillStyle(C.red, 1); g.fillRect(b.x - 30, b.y - 58, 60 * Math.max(0, b.hp / b.maxHp), 6);
    }

    this.autoFire(dt);
    this.tick(this.pShots, dt);
    this.tick(this.bShots, dt);
    var touch = Controls.touch;
    this.jumpBtn.setVisible(touch); this.jumpIco.setVisible(touch);
    this.skillBtn.setVisible(touch && this.spec.shock > 0); this.skillIco.setVisible(touch && this.spec.shock > 0);
    this.drawHud();
    if (this.left <= 0) this.finish(false, true);
  },

  /* ---------------- quitting counts as a loss ---------------- */
  askQuit: function () {
    if (this.over || this.paused) return;
    var self = this, w = this.scale.width, h = this.scale.height;
    this.paused = true;
    this.physics.pause();
    var items = [];
    var add = function (o) { o.setScrollFactor(0).setDepth(1001); items.push(o); return o; };
    items.push(this.add.rectangle(w / 2, h / 2, w, h, 0x0d1f2e, 0.7).setScrollFactor(0).setDepth(1000).setInteractive());
    var g = add(this.add.graphics());
    var pw = Math.min(330, w - 30);
    g.fillStyle(0xffffff, 0.98); g.fillRoundedRect(w / 2 - pw / 2, h / 2 - 110, pw, 220, 20);
    add(txt(this, w / 2, h / 2 - 72, TXT.paused, 24, CS.ink).setOrigin(0.5));
    add(txt(this, w / 2, h / 2 - 40, LANG === 'ko' ? '지금 나가면 패배로 처리돼요' : 'Leaving now counts as a loss', 13, CS.red, '900').setOrigin(0.5));
    var close = function () { items.forEach(function (o) { o.destroy(); }); };
    var b1 = makeButton(this, w / 2, h / 2 + 12, pw - 60, 46, TXT.resume, function () {
      close(); self.paused = false; self.physics.resume();
    }, { color: C.cyan, size: 16 });
    var b2 = makeButton(this, w / 2, h / 2 + 68, pw - 60, 42, TXT.quit, function () {
      close(); self.paused = false; self.physics.resume(); self.finish(false);
    }, { color: 0x7e94a8, size: 15 });
    [b1, b2].forEach(function (b) { b.setScrollFactor(0, 0, true); b.setDepth(1002); items.push(b); });
  },

  finish: function (win, timeout) {
    if (this.over) return;
    this.over = true;
    this.physics.pause();
    this.player.setVelocity(0, 0);
    var before = this.rank0;
    var after = Meta.trialResult(win);
    Net.setStatus('menu');
    SFX.play(win ? 'win' : 'over');
    if (win) this.cameras.main.flash(300, 255, 255, 255);
    this.showResult(win, timeout, before, after);
  },

  showResult: function (win, timeout, before, after) {
    var self = this, w = this.scale.width, h = this.scale.height, keep = [];
    var add = function (o) { o.setScrollFactor(0).setDepth(1001); keep.push(o); return o; };
    keep.push(this.add.rectangle(w / 2, h / 2, w, h, 0x0d1f2e, 0.78).setScrollFactor(0).setDepth(1000).setInteractive());
    var pw = Math.min(380, w - 24), ph = Math.min(380, h - 20), top = h / 2 - ph / 2;
    var g = add(this.add.graphics());
    g.fillStyle(0xffffff, 0.98); g.fillRoundedRect(w / 2 - pw / 2, top, pw, ph, 22);
    var title = win ? TXT.promoWin : (timeout ? TXT.promoTime : TXT.promoFailT);
    add(txt(this, w / 2, top + 38, title, 26, win ? CS.green : CS.red).setOrigin(0.5));
    add(this.add.image(w / 2 - 80, top + 112, rankTex(before)).setScale(1.1));
    add(txt(this, w / 2 - 80, top + 160, rankName(before), 14, CS.dim).setOrigin(0.5));
    add(txt(this, w / 2, top + 112, '▶', 20, CS.dim).setOrigin(0.5));
    var em = add(this.add.image(w / 2 + 80, top + 112, rankTex(after)).setScale(0.4));
    this.tweens.add({ targets: em, scale: 1.25, duration: 420, ease: 'Back.out' });

/* =====================================================================
   17. FRIENDLY DUEL (브섭)  —  1v1 or 2v1 between party members
   ---------------------------------------------------------------
   Everyone has 300 HP (also the solo player in a 2v1). First team to
   5 round wins. Everyone gets the same pistol, which aims and fires by
   itself; you move, jump and use the shockwave. A 3-second countdown
   starts each round. No rewards, no score — it's a friendly.

   Netcode: each player owns their own stickman and their own shots.
   The shooter decides hits against what it sees and sends a hit event;
   the target applies the damage to itself. The host only runs the
   round clock (rooms/{id}/dg). Fine for friends, not tamper-proof.
   ===================================================================== */

  pistol:   { slot: 's', ko: '권총',     en: 'Pistol',   kind: 'gun',  dmg: 16, cd: 250,  spd: 950,  spread: 0.03, life: 600, tag: 'quick' },

var DW_SLOTS = { p: ['ar', 'shotgun', 'sniper', 'uzi', 'bow'], s: ['pistol', 'revolver', 'launcher'],
                 m: ['sword', 'dagger', 'hammer'], u: ['grenade', 'medkit', 'dash', 'mine'] };

var DW_TAGS = {
  ko: { auto: '연사', close: '근거리', long: '원거리', pierce: '관통', quick: '빠름', heavy: '한 방', area: '범위',
        wide: '넓게', fast: '빠르게', knock: '밀치기', heal: '+70 회복', move: '순간 이동', trap: '설치' },

function dwName(id) { var d = DW[id]; return d ? (LANG === 'ko' ? d.ko : d.en) : '-'; }

  return (d.n ? d.dmg + 'x' + d.n : d.dmg) + ' · ' + tag;
}
/* distance from point (px,py) to segment (x0,y0)-(x1,y1) */
function segDist(x0, y0, x1, y1, px, py) {
  var dx = x1 - x0, dy = y1 - y0, l2 = dx * dx + dy * dy;
  var t = l2 ? Phaser.Math.Clamp(((px - x0) * dx + (py - y0) * dy) / l2, 0, 1) : 0;

  return Math.sqrt(cx * cx + cy * cy);
}
function dwValidLo(lo) {

  makeMe: function () {

  /* ---------------- round clock ---------------- */

  resetSelf: function () {

  startPick: function () {

  endRound: function (rw) {

    if (dg.ph === 'end' && el >= END_MS) {
      if (dg.sc.A >= DUEL_WIN || dg.sc.B >= DUEL_WIN) this.setDg(Object.assign({}, dg, { ph: 'done', win: dg.sc.A >= DUEL_WIN ? 'A' : 'B', t0: now }));
      else this.setDg({ round: dg.round + 1, ph: 'pick', t0: now, sc: dg.sc });
      return;
    }

      if (!dead) { alive[r.team]++; hp[r.team] += Math.max(0, r.hp) / DUEL_HP; }
    }

          var r = this.rem[k];
          if (dead || r.team === b.team || r.dead) continue;
          if (segDist(x0, y0, b.s.x, b.s.y, r.spr.x, r.spr.y - 2) < 16) dead = !b.pierce;
        }
      }
      if (dead) b.s.destroy(); else keep.push(b);
    }
    this.vis = keep;
  },
  updateRemotes: function (dt) {
    var f = Math.min(1, dt * 0.015);
    for (var k in this.rem) {
      var r = this.rem[k], s = r.spr;
      if (Math.abs(r.tx - s.x) > 260 || Math.abs(r.ty - s.y) > 260) { s.x = r.tx; s.y = r.ty; }
      s.x += (r.tx - s.x) * f; s.y += (r.ty - s.y) * f;
      s.flipX = r.flip;
      if (r.dead) { s.setTintFill(0x8fa6bb).setAlpha(r.gone ? 0.2 : 0.45).setAngle(90); }
      else {
        s.clearTint().setAlpha(1).setAngle(0).setScale(1 + r.air * 0.22);
        if (r.moving) s.play(skinAnim(r.skin), true); else { s.stop(); s.setTexture(skinTex(r.skin, 0)); }
      }
      r.sh.setPosition(s.x, s.y + 20).setAlpha(r.dead ? 0.2 : 1);
      r.tag.setPosition(s.x, s.y - 40);
      r.wt.setPosition(s.x, s.y + 32).setText(r.dead ? '' : dwName(r.w));
    }
  },
  drawBars: function () {
    var g = this.meBar; g.clear();
    var draw = function (x, y, f, col) {
      g.fillStyle(0x16324a, 0.25); g.fillRect(x - 24, y, 48, 5);
      g.fillStyle(col, 1); g.fillRect(x - 24, y, 48 * Phaser.Math.Clamp(f, 0, 1), 5);
    };
    if (!this.dead) draw(this.player.x, this.player.y - 30, this.hp / DUEL_HP, this.myTeam === 'B' ? C.red : C.cyan);
    for (var k in this.rem) {
      var r = this.rem[k];
      r.bar.clear();
      if (r.dead) continue;
      r.bar.fillStyle(0x16324a, 0.25); r.bar.fillRect(r.spr.x - 24, r.spr.y - 30, 48, 5);
      r.bar.fillStyle(r.team === 'B' ? C.red : C.cyan, 1);
      r.bar.fillRect(r.spr.x - 24, r.spr.y - 30, 48 * Phaser.Math.Clamp(r.hp / DUEL_HP, 0, 1), 5);
    }
  },

  /* for the HUD */
  hudState: function () {
    var dg = this.dg || { sc: { A: 0, B: 0 }, round: 0, ph: '' };
    return {
      ph: dg.ph, round: dg.round, sc: dg.sc, left: this.clockLeft(), myTeam: this.myTeam,
      hp: this.hp, dead: this.dead, slot: this.slot, lo: this.lo, cds: this.cds,
      utilCd: this.utilCd, shockCd: this.shockCd
    };
  }
});

var DuelUIScene = new Phaser.Class({

  layout: function () {
    var w = this.scale.width, h = this.scale.height;
    this.L = { w: w, h: h };
    this.scT.setPosition(w / 2, 26);
    this.rdT.setPosition(w / 2, 50);
    this.banner.setPosition(w / 2, h * 0.30);
    this.notice.setPosition(w / 2, h * 0.18);
    this.deadT.setPosition(w / 2, h * 0.42);
    this.cdT.setPosition(w / 2, h * 0.48);
    this.flash.setSize(w, h);
    this.menuBtn.setPosition(w - 30, 30);
    /* weapon label + shockwave cooldown, bottom centre */
    this.L.sy = h - 30;
    this.gunT.setPosition(w / 2 - 20, this.L.sy);
    this.L.shx = w / 2 + 70;
    this.shT.setPosition(this.L.shx, this.L.sy);
    if (this.jumpB) {
      this.jumpB.setPosition(w - 56, h - 62); this.jumpI.setPosition(w - 56, h - 62);
      this.shockB.setPosition(w - 56, h - 142); this.shockI.setPosition(w - 56, h - 142);
    }
  },

  buildTouch: function () {
    var self = this;
    this.input.addPointer(3);
    var mk = function (col, label) {
      var b = self.add.circle(0, 0, 28, col, 0.22).setStrokeStyle(4, col, 0.6).setDepth(940).setInteractive({ useHandCursor: true });
      var t = txt(self, 0, 0, label, 16, '#16324a', '900').setOrigin(0.5).setDepth(941);
      return [b, t];
    };
    var j = mk(C.cyan, '↑'); this.jumpB = j[0]; this.jumpI = j[1];
    var s = mk(C.gold, 'R'); this.shockB = s[0]; this.shockI = s[1];
    this.jumpB.on('pointerdown', function () { self.ds.doJump(); });
    this.shockB.on('pointerdown', function () { self.ds.doShock(); });
    this.joyBase = this.add.circle(0, 0, 42, C.ink, 0.10).setDepth(930).setVisible(false);
    this.joyThumb = this.add.circle(0, 0, 18, C.cyan, 0.55).setDepth(931).setVisible(false);
    this.joyId = null;

    this.input.on('pointerdown', function (p) {
      if (p.wasTouch) Controls.touch = true;
      var h = self.scale.height;
      if (self.overlay || !Controls.touch) return;
      if (p.y < h * 0.12) return;
      var near = function (b) { return Phaser.Math.Distance.Between(p.x, p.y, b.x, b.y) < 40; };
      if (near(self.jumpB) || near(self.shockB)) return;
      /* shooting is automatic, so a drag anywhere moves */
      if (self.joyId !== null) return;
      self.joyId = p.id; self.jox = p.x; self.joyOy = p.y;
      self.joyBase.setPosition(p.x, p.y).setVisible(true); self.joyThumb.setPosition(p.x, p.y).setVisible(true);
      DuelCtl.joy = true; DuelCtl.jx = 0; DuelCtl.jy = 0;
    });
    this.input.on('pointermove', function (p) {
      var dx, dy, d, a, cl;
      if (p.id === self.joyId) {
        dx = p.x - self.jox; dy = p.y - self.joyOy; d = Math.sqrt(dx * dx + dy * dy); a = Math.atan2(dy, dx); cl = Math.min(d, 42);
        self.joyThumb.setPosition(self.jox + Math.cos(a) * cl, self.joyOy + Math.sin(a) * cl);
        var mag = Phaser.Math.Clamp(d / (42 * 0.45), 0, 1);
        DuelCtl.jx = Math.cos(a) * mag; DuelCtl.jy = Math.sin(a) * mag;
      }
    });
    var up = function (p) {
      if (p.id === self.joyId) {
        self.joyId = null; DuelCtl.joy = false; DuelCtl.jx = 0; DuelCtl.jy = 0;
        self.joyBase.setVisible(false); self.joyThumb.setVisible(false);
      }
    };
    this.input.on('pointerup', up);
    this.input.on('pointerupoutside', up);
  },

  update: function () {
    var ds = this.ds;
    if (!ds || !ds.hudState) return;
    var H = ds.hudState(), L = this.L, g = this.g, w = L.w, h = L.h;
    var touch = Controls.touch;
    [this.jumpB, this.jumpI, this.shockB, this.shockI].forEach(function (o) { o.setVisible(touch); });
    g.clear();
    /* score pill */
    g.fillStyle(0xffffff, 0.9); g.fillRoundedRect(w / 2 - 110, 8, 220, 52, 14);
    g.fillStyle(C.cyan, 1); g.fillRoundedRect(w / 2 - 110, 8, 10, 52, { tl: 14, bl: 14, tr: 0, br: 0 });
    g.fillStyle(C.red, 1); g.fillRoundedRect(w / 2 + 100, 8, 10, 52, { tl: 0, bl: 0, tr: 14, br: 14 });
    this.scT.setText(TXT.teamA + ' ' + H.sc.A + '  :  ' + H.sc.B + ' ' + TXT.teamB);
    var clock = H.ph === 'fight' ? fmtTime(H.left) : (H.ph === 'pick' ? Math.ceil(H.left / 1000) + 's' : '');
    this.rdT.setText(TXT.round + ' ' + (H.round || '-') + (clock ? '   ' + clock : '') + '   · ' + TXT.noReward);

    /* hp */
    var bw = Math.max(90, Math.min(260, w / 2 - 136)), bx = 14, by = 14;
    g.fillStyle(0xffffff, 0.9); g.fillRoundedRect(bx - 4, by - 4, bw + 8, 30, 12);
    g.fillStyle(0xd8e6f0, 1); g.fillRoundedRect(bx, by, bw, 22, 10);
    var f = Math.max(0, H.hp / DUEL_HP);
    g.fillStyle(H.myTeam === 'B' ? C.red : C.cyan, 1);
    if (f > 0.01) g.fillRoundedRect(bx, by, Math.max(8, bw * f), 22, 10);
    this.hpT.setText(Math.ceil(H.hp) + ' / ' + DUEL_HP).setPosition(bx + bw / 2, by + 11);

    /* weapon chip */
    g.fillStyle(0xffffff, 0.92); g.fillRoundedRect(w / 2 - 90, L.sy - 18, 140, 36, 12);
    /* shockwave cooldown */
    var sx = L.shx;
    g.fillStyle(0xffffff, 0.92); g.fillCircle(sx, L.sy, 18);
    if (H.shockCd > 0) {
      g.fillStyle(0x16324a, 0.3); g.beginPath();
      g.slice(sx, L.sy, 18, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * H.shockCd / SHOCK_CD, false);
      g.fillPath();
    }
    this.shT.setPosition(sx, L.sy).setColor(H.shockCd > 0 ? '#9fb3c4' : CS.gold);
    this.deadT.setVisible(H.dead && H.ph === 'fight');
    /* 3-2-1 before each round */
    if (H.ph === 'pick') this.cdT.setVisible(true).setText(String(Math.max(1, Math.ceil(H.left / 1000))));
    else this.cdT.setVisible(false);
  },

  showBanner: function (msg, col) {

/* =====================================================================
   LOADOUT PICKER  —  HTML overlay during the 5-second pick phase
   ===================================================================== */
var Picker = {
  scene: null,
  open: function (scene) {
    this.scene = scene;
    var el = document.getElementById('lo');
    el.classList.add('on');
    this.render();
    var self = this;
    clearInterval(this.timer);
    this.timer = setInterval(function () { self.tickClock(); }, 200);
  },
  close: function () {
    clearInterval(this.timer);
    this.scene = null;
    var el = document.getElementById('lo');
    if (el) { el.classList.remove('on'); el.innerHTML = ''; }
  },
  tickClock: function () {
    var s = this.scene, c = document.querySelector('#lo .cd');
    if (!s || !c) return;
    c.textContent = Math.ceil(s.clockLeft() / 1000);
  },
  render: function () {
    var s = this.scene, el = document.getElementById('lo');
    if (!s || !el || !el.classList.contains('on')) return;
    var dg = s.dg || { sc: { A: 0, B: 0 }, round: 1 };
    var names = { p: TXT.primary, s: TXT.secondary, m: TXT.melee, u: TXT.utility };
    var html = '<div class="lp"><div class="lh"><div><div class="rt">' + esc(TXT.round + ' ' + dg.round + ' · ' + TXT.pickTime) + '</div>' +
      '<div class="sc">' + esc(TXT.teamA + ' ' + (dg.sc.A || 0) + ' : ' + (dg.sc.B || 0) + ' ' + TXT.teamB) + '</div></div>' +
      '<div class="cd">' + Math.ceil(s.clockLeft() / 1000) + '</div></div>';
    ['p', 's', 'm', 'u'].forEach(function (sl) {
      html += '<div class="slot"><div class="sl">' + esc(names[sl]) + '</div><div class="opts">';
      DW_SLOTS[sl].forEach(function (id) {
        html += '<button data-s="' + sl + '" data-w="' + id + '" class="' + (s.lo[sl] === id ? 'on' : '') + '">' +
          esc(dwName(id)) + '<small>' + esc(dwInfo(id)) + '</small></button>';
      });
      html += '</div></div>';
    });
    /* both teams' current picks */
    var ms = Net.members(), cols = { A: [], B: [] };
    ms.forEach(function (m) {
      var lo = m.k === s.me ? s.lo : dwValidLo(s.los[m.k]);
      var t = s.teams[m.k] || 'A';
      cols[t].push('<div class="pl"><b>' + esc(m.nick) + (m.k === s.me ? ' (' + esc(TXT.me) + ')' : '') + '</b>: ' +
        esc([dwName(lo.p), dwName(lo.s), dwName(lo.m), dwName(lo.u)].join(' / ')) + '</div>');
    });
    html += '<div class="teams"><div class="tm A"><h4>' + esc(TXT.teamA) + '</h4>' + cols.A.join('') + '</div>' +
      '<div class="tm B"><h4>' + esc(TXT.teamB) + '</h4>' + cols.B.join('') + '</div></div></div>';
    el.innerHTML = html;
    var bs = el.querySelectorAll('[data-w]');
    for (var i = 0; i < bs.length; i++) {
      bs[i].onclick = function () { SFX.play('click'); s.setLo(this.getAttribute('data-s'), this.getAttribute('data-w')); };
    }
  }
};

    this.jumpBtn.setVisible(vis); this.jumpIcon.setVisible(vis);
    this.skillBtn.setVisible(vis); this.skillIcon.setVisible(vis);
  },

  /* ---------- touch controls: attacks are automatic, so a drag ANYWHERE
     moves the stickman; only the jump / skill buttons are excluded ---------- */
  buildTouch: function () {
    var self = this;
    this.joyR = 42;
    this.joyBase = this.add.circle(0, 0, this.joyR, 0x16324a, 0.10)
      .setStrokeStyle(3, 0x16324a, 0.22).setDepth(940).setVisible(false);
    this.joyThumb = this.add.circle(0, 0, this.joyR * 0.44, C.cyan, 0.55)
      .setStrokeStyle(3, 0xffffff, 0.8).setDepth(941).setVisible(false);

    this.jumpBtn = this.add.circle(0, 0, 34, C.cyan, 0.22).setStrokeStyle(4, C.cyan, 0.6).setDepth(940);
    this.jumpIcon = this.add.text(0, 0, '↑', { fontFamily: FONT, fontSize: '24px', color: CS.cyan, fontStyle: '900' })
      .setOrigin(0.5).setDepth(941);
    this.jumpBtn.setInteractive({ useHandCursor: true });
    this.jumpBtn.on('pointerdown', function () { self.jumpBtn.setScale(0.9); if (self.gs) self.gs.startJump(); });
    this.jumpBtn.on('pointerup', function () { self.jumpBtn.setScale(1); });
    this.jumpBtn.on('pointerout', function () { self.jumpBtn.setScale(1); });

    this.skillBtn = this.add.circle(0, 0, 34, C.gold, 0.24).setStrokeStyle(4, C.gold, 0.65).setDepth(940);
    this.skillIcon = this.add.text(0, 0, 'R', { fontFamily: FONT, fontSize: '22px', color: CS.gold, fontStyle: '900' })
      .setOrigin(0.5).setDepth(941);
    this.skillBtn.setInteractive({ useHandCursor: true });
    this.skillBtn.on('pointerdown', function () { self.skillBtn.setScale(0.9); if (self.gs) self.gs.useSkill(); });
    this.skillBtn.on('pointerup', function () { self.skillBtn.setScale(1); });
    this.skillBtn.on('pointerout', function () { self.skillBtn.setScale(1); });

    this.input.addPointer(2);
    this.input.on('pointerdown', function (p) {
      if (p.wasTouch) Controls.touch = true;
      if (self.overlay || !Controls.touch) return;
      var h = self.scale.height;
      if (p.y < h * 0.16) return;                  /* top HUD strip */
      if (self.overSmallBtn(p)) return;
      if (self.joyId !== null) return;
      self.joyId = p.id;
      self.joyOx = p.x; self.joyOy = p.y;
      self.joyBase.setPosition(p.x, p.y).setVisible(true);
      self.joyThumb.setPosition(p.x, p.y).setVisible(true);
      Controls.joy = true; Controls.jx = 0; Controls.jy = 0;
    });
    this.input.on('pointermove', function (p) {
      if (p.id !== self.joyId) return;
      var dx = p.x - self.joyOx, dy = p.y - self.joyOy;
      var d = Math.sqrt(dx * dx + dy * dy), max = self.joyR, cl = Math.min(d, max), a = Math.atan2(dy, dx);
      self.joyThumb.setPosition(self.joyOx + Math.cos(a) * cl, self.joyOy + Math.sin(a) * cl);
      var mag = Phaser.Math.Clamp(d / (max * 0.45), 0, 1);
      Controls.jx = Math.cos(a) * mag;
      Controls.jy = Math.sin(a) * mag;
    });
    var release = function (p) {
      if (p.id !== self.joyId) return;
      self.joyId = null;
      Controls.joy = false; Controls.jx = 0; Controls.jy = 0;
      self.joyBase.setVisible(false); self.joyThumb.setVisible(false);
    };
    this.input.on('pointerup', release);
    this.input.on('pointerupoutside', release);
  },

  /* ---------- layout ---------- */
  layout: function () {
    var w = this.scale.width, h = this.scale.height;
    var narrow = w < 560;
    var pad = narrow ? 10 : 16;
    var pw = narrow ? 152 : 212;
    var L = {
      w: w, h: h, narrow: narrow, pad: pad, pw: pw,
      panelX: pad - 6, panelY: pad - 6, panelH: 42,
      lvX: pad + 22, lvY: pad + 16,
      hpX: pad + 46, hpY: pad + 6, hpW: pw - 62, hpH: 17,
      timerW: narrow ? 76 : 94, timerY: pad - 4,
      scY: pad + 50,
      iconY: pad + 86,
      bossY: pad + 92
    };
    L.btnPauseX = w - pad - 20;
    L.btnSndX = w - pad - 64;
    L.btnLeft = w - pad - 86;
    if (narrow) {
      L.scoreBoxX = w - pad - 108; L.scoreBoxY = pad + 44; L.scoreBoxW = 112;
      L.scoreX = w - pad - 6; L.scoreY = pad + 60; L.killY = pad + 80; L.sapY = pad + 98;
      L.timerX = (L.panelX + pw + L.btnLeft) / 2;
    } else {
      L.scoreBoxX = w - pad - 214; L.scoreBoxY = pad - 4; L.scoreBoxW = 118;
      L.scoreX = w - pad - 106; L.scoreY = pad + 12; L.killY = pad + 32; L.sapY = pad + 50;
      L.timerX = w / 2;
    }
    if (narrow) L.bossY = pad + 122;
    this.L = L;

    this.timeText.setFontSize(narrow ? 17 : 21);
    this.scoreText.setFontSize(narrow ? 16 : 19);
    this.pauseBtn.setPosition(L.btnPauseX, pad + 20);
    this.sndBtn.setPosition(L.btnSndX, pad + 20);
    this.bossName.setPosition(w / 2, L.bossY + 24);
    this.scIcon.setPosition(L.panelX + 18, L.scY);
    this.scText.setPosition(L.panelX + 34, L.scY);

    this.toast.setPosition(w / 2, h * 0.30).setFontSize(narrow ? 18 : 24);
    this.notice.setPosition(w / 2, h * 0.20).setFontSize(narrow ? 15 : 18);
    this.bigText.setPosition(w / 2, h * 0.44).setFontSize(narrow ? 22 : 28);
    this.flash.setPosition(0, 0).setSize(w, h);

    this.jumpBtn.setPosition(w - 56, h - 62); this.jumpIcon.setPosition(w - 56, h - 62);
    this.skillBtn.setPosition(w - 56, h - 142); this.skillIcon.setPosition(w - 56, h - 142);
    this.setTouchVisible(Controls.touch);

    this.wSig = '';
    this.skillText.setPosition(L.pad + 12 + CFG.MAX_WEAPONS * 40 - 4, L.iconY).setFontSize(narrow ? 12 : 14);
  },

  refreshWeaponIcons: function (weapons) {
    var L = this.L, x = L.pad + 12, y = L.iconY;
    for (var i = 0; i < this.wIcons.length; i++) this.wIcons[i].destroy();
    this.wIcons = [];
    for (var j = 0; j < weapons.length; j++) {
      var w = weapons[j], d = WEAPONS[w.id];
      if (!d) continue;
      var c = this.add.container(x + j * 40, y).setDepth(901);
      var g = this.add.graphics();
      g.fillStyle(0xffffff, 0.85); g.fillRoundedRect(-16, -16, 32, 32, 9);
      g.lineStyle(3, d.color, 1); g.strokeRoundedRect(-16, -16, 32, 32, 9);
      var ic = this.add.text(0, 0, d.icon, { fontFamily: FONT, fontSize: '16px', color: CS.ink }).setOrigin(0.5);
      var lv = this.add.text(12, 10, String(w.lv), { fontFamily: FONT, fontSize: '11px', color: '#ffffff', fontStyle: '900',
        stroke: '#16324a', strokeThickness: 3 }).setOrigin(0.5);
      c.add([g, ic, lv]);
      this.wIcons.push(c);
    }
  },

  /* ---------- per-frame HUD ---------- */
  update: function () {
    var gs = this.gs;
    if (!gs || !gs.hud) return;
    var L = this.L;
    if (!L) return;
    var H = gs.hud();
    if (!H) return;

    var sig = H.weapons.map(function (x) { return x.id + x.lv; }).join(',');
    if (sig !== this.wSig) { this.wSig = sig; this.refreshWeaponIcons(H.weapons); }
    if (this.jumpBtn.visible !== Controls.touch) this.setTouchVisible(Controls.touch);

    if (H.skills !== this.skillShown) {
      var left = H.skills;
      this.skillShown = left;
      this.skillText.setText('R  x' + left).setColor(left > 0 ? CS.gold : '#9fb3c4');
      this.skillIcon.setText(left > 0 ? 'R' + left : 'R');
      this.skillBtn.setAlpha(left > 0 ? 1 : 0.35);
      this.skillIcon.setAlpha(left > 0 ? 1 : 0.35);
    }

    var g = this.hud;
    g.clear();
    g.fillStyle(0xffffff, 0.80);
    g.fillRoundedRect(L.panelX, L.panelY, L.pw, L.panelH, 12);
    g.fillStyle(C.cyan, 1);
    g.fillCircle(L.lvX, L.lvY, 17);

    g.fillStyle(0xd8e6f0, 1);
    g.fillRoundedRect(L.hpX, L.hpY, L.hpW, L.hpH, 8);
    var ratio = Phaser.Math.Clamp(H.hp / H.maxHp, 0, 1);
    g.fillStyle(ratio > 0.5 ? C.green : (ratio > 0.25 ? C.gold : C.red), 1);
    if (ratio > 0.02) g.fillRoundedRect(L.hpX, L.hpY, Math.max(10, L.hpW * ratio), L.hpH, 8);

    /* career score chip */
    var sc = Meta.score(), into = Meta.kills % 100;
    g.fillStyle(0xffffff, 0.80);
    g.fillRoundedRect(L.panelX, L.scY - 13, L.pw, 26, 10);
    g.fillStyle(C.gold, 0.9);
    g.fillRect(L.panelX + 6, L.scY + 9, (L.pw - 12) * (into / 100), 3);
    this.scText.setText(TXT.sc + ' ' + sc + '   ' + into + '/100');
    if (this.scIcon.texture.key !== rankTex(Meta.rank)) this.scIcon.setTexture(rankTex(Meta.rank));

    /* xp bar across the very top */
    var xr = Phaser.Math.Clamp(H.xp / H.xpNext, 0, 1);
    g.fillStyle(0xc9dcea, 1); g.fillRect(0, 0, L.w, 7);
    g.fillStyle(C.cyanLt, 1); g.fillRect(0, 0, L.w * xr, 7);

    g.fillStyle(0xffffff, 0.80);
    g.fillRoundedRect(L.scoreBoxX, L.scoreBoxY, L.scoreBoxW, 46, 12);
    g.fillStyle(0xffffff, 0.88);
    g.fillRoundedRect(L.timerX - L.timerW / 2, L.timerY, L.timerW, 33, 12);

    this.lvText.setText(String(H.level)).setPosition(L.lvX, L.lvY + 1);
    this.hpText.setText(Math.ceil(Math.max(0, H.hp)) + ' / ' + Math.round(H.maxHp))
      .setPosition(L.hpX + L.hpW / 2, L.hpY + L.hpH / 2);
    var remain = H.endless ? H.time : Math.max(0, CFG.RUN_MS - H.time);
    this.timeText.setText(fmtTime(remain)).setColor(remain < 30000 && !H.endless ? CS.red : CS.ink)
      .setPosition(L.timerX, L.timerY + 17);
    this.scoreText.setText(H.score.toLocaleString()).setPosition(L.scoreX, L.scoreY);
    this.killText.setText('☠ ' + H.kills).setPosition(L.scoreX, L.killY);
    this.sapText.setText('◆ ' + H.sap.toLocaleString()).setPosition(L.scoreX, L.sapY);

    /* party mates: name + small hp bar, under the weapon row */
    var my = L.iconY + 30;
    for (var i = 0; i < H.mates.length; i++) {
      var m = H.mates[i], yy = my + i * 26;
      if (!this.mateTexts[i]) this.mateTexts[i] = txt(this, 0, 0, '', 12, CS.ink, '900').setDepth(901).setOrigin(0, 0.5);
      var mt = this.mateTexts[i];
      mt.setVisible(true).setPosition(L.panelX + 8, yy).setText(m.nick + (m.dead ? '  ☠' : ''))
        .setColor(m.dead ? CS.red : CS.ink);
      g.fillStyle(0xffffff, 0.75); g.fillRoundedRect(L.panelX, yy - 11, L.pw, 22, 8);
      g.fillStyle(0xd8e6f0, 1); g.fillRoundedRect(L.panelX + L.pw - 66, yy - 4, 58, 8, 4);
      if (!m.dead) {
        g.fillStyle(m.hpf > 0.5 ? C.green : (m.hpf > 0.25 ? C.gold : C.red), 1);
        g.fillRoundedRect(L.panelX + L.pw - 66, yy - 4, Math.max(4, 58 * Phaser.Math.Clamp(m.hpf, 0, 1)), 8, 4);
      }
    }
    for (var j = H.mates.length; j < this.mateTexts.length; j++) this.mateTexts[j].setVisible(false);

    /* dead (party): respawn countdown; choosing: invincible hint */
    if (H.dead && !H.over) {
      this.bigText.setVisible(true).setText(fmt(TXT.respawnIn, { s: Math.max(1, Math.ceil(H.respawn / 1000)) }));
    } else if (H.choosing && H.party && this.cards) {
      this.bigText.setVisible(false);
    } else this.bigText.setVisible(false);
    if (this.chooseHint) this.chooseHint.setText(TXT.choosing + '  ' + Math.max(0, Math.ceil(H.chooseT / 1000)));

    if (H.boss >= 0) {
      var bw = Math.min(L.w * 0.55, 400), bx = L.w / 2 - bw / 2, by = L.bossY;
      g.fillStyle(0x16324a, 0.22); g.fillRoundedRect(bx, by, bw, 14, 7);
      g.fillStyle(C.red, 1);
      if (H.boss > 0.01) g.fillRoundedRect(bx, by, Math.max(8, bw * H.boss), 14, 7);
      this.bossName.setVisible(true).setText('BOSS');
    } else this.bossName.setVisible(false);
  },

  /* ---------- feedback ---------- */
  hurtFlash: function () {
    this.flash.setVisible(true).setAlpha(0.30);
    this.tweens.add({ targets: this.flash, alpha: 0, duration: 220 });
  },
  showToast: function (msg, dur) {
    this.toast.setText(msg).setAlpha(1).setScale(0.85);
    this.tweens.killTweensOf(this.toast);
    this.tweens.add({ targets: this.toast, scale: 1, duration: 180, ease: 'Back.out' });
    this.tweens.add({ targets: this.toast, alpha: 0, delay: dur || 900, duration: 340 });
  },
  showNotice: function (msg) {
    this.notice.setText(msg).setAlpha(1);
    this.tweens.killTweensOf(this.notice);
    this.tweens.add({ targets: this.notice, alpha: 0, delay: 2200, duration: 500 });
  },
  showBossWarn: function (msg) {
    this.showToast(msg, 1300);
    this.toast.setColor(CS.red);
    var self = this;
    this.time.delayedCall(1800, function () { self.toast.setColor(CS.cyan); });
  },

  /* ---------- overlays ---------- */
  dim: function (alpha) {
    var w = this.scale.width, h = this.scale.height;
    return this.add.rectangle(0, 0, w, h, 0x0d2436, alpha === undefined ? 0.62 : alpha)
      .setOrigin(0).setDepth(1000).setInteractive();
  },
  dialog: function (pw, ph, dimAlpha) {
    var w = this.scale.width, h = this.scale.height;
    var dim = this.dim(dimAlpha);
    var c = this.add.container(w / 2, h / 2).setDepth(1001);
    var g = this.add.graphics();
    g.fillStyle(0x16324a, 0.35); g.fillRoundedRect(-pw / 2, -ph / 2 + 8, pw, ph, 22);
    g.fillStyle(0xf5fafd, 1); g.fillRoundedRect(-pw / 2, -ph / 2, pw, ph, 22);
    c.add(g);
    c.setScale(Math.min(1, (h - 24) / ph, (w - 16) / pw));
    this.overlay = [dim, c];
    return c;
  },
  closeOverlay: function () {
    if (this.overlay) { this.overlay.forEach(function (o) { o.destroy(); }); this.overlay = null; }
    this.cards = null;
    this.chooseHint = null;
    this.isPauseMenu = false;
    Controls.attack = false;
    Controls.uiBlock = false;
  },

  togglePause: function () {
    var gs = this.gs, H = gs && gs.hud ? gs.hud() : null;
    if (!gs || !H) return;
    if (this.isPauseMenu) { this.resumeGame(); return; }
    if (H.over || this.overlay) return;
    this.showPause(H.party);
  },
  resumeGame: function () {
    this.closeOverlay();
    if (this.pausedWorld) {
      this.pausedWorld = false;
      this.gs.state.paused = false;
      this.gs.scene.resume();
      CG.gameplayStart();
    }
  },
  showPause: function (party) {
    var self = this, gs = this.gs;
    /* in a party the world keeps running for everyone else */
    if (!party) {
      gs.state.paused = true;
      gs.scene.pause();
      CG.gameplayStop();
      this.pausedWorld = true;
    }
    var H = gs.hud();
    var pw = Math.min(340, this.scale.width - 32), ph = party ? 270 : 330, top = -ph / 2;
    var c = this.dialog(pw, ph);
    this.isPauseMenu = true;
    c.add(txt(this, 0, top + 40, TXT.paused, 28, CS.ink).setOrigin(0.5));
    c.add(txt(this, 0, top + 78, TXT.score + ' ' + H.score.toLocaleString() + '    ' + TXT.lvl + ' ' + H.level,
      14, CS.dim, '700').setOrigin(0.5));
    c.add(makeButton(this, 0, top + 130, pw - 70, 54, TXT.resume, function () { self.resumeGame(); }, { color: C.cyan }));
    if (!party) {
      c.add(makeButton(this, 0, top + 196, pw - 70, 50, TXT.restart, function () {
        self.closeOverlay(); self.pausedWorld = false; gs.restartRun();
      }, { color: 0x7e94a8 }));
    }
    c.add(makeButton(this, 0, top + (party ? 196 : 256), pw - 70, 50, party ? TXT.leave : TXT.menu, function () {
      self.closeOverlay(); self.pausedWorld = false; gs.quitToMenu();
    }, { color: 0x7e94a8 }));
  },

  showLevelUp: function (choices, party) {
    var self = this;
    if (this.isPauseMenu) this.closeOverlay();
    this.closeOverlay();
    var w = this.scale.width, h = this.scale.height;
    var cx = w / 2;
    var items = [this.dim(party ? 0.45 : 0.68)];
    var vertical = w < 680;
    items.push(txt(this, cx, vertical ? h * 0.13 : h * 0.20, TXT.levelup, vertical ? 30 : 38, CS.gold)
      .setOrigin(0.5).setDepth(1002).setStroke('#16324a', 6));
    var sub = txt(this, cx, vertical ? h * 0.13 + 30 : h * 0.20 + 36, party ? TXT.choosing : TXT.choose, 14, '#dbe9f3', '700')
      .setOrigin(0.5).setDepth(1002);
    items.push(sub);
    if (party) this.chooseHint = sub;
    this.cards = [];
    var topY = h * 0.26;
    var vCardH = Phaser.Math.Clamp((h - topY - 24) / 3 - 14, 58, 92);
    for (var i = 0; i < choices.length; i++) {
      var c = choices[i];
      var cardW = vertical ? Math.min(340, w - 36) : 210;
      var cardH = vertical ? vCardH : 226;
      var px = vertical ? cx : cx + (i - 1) * (cardW + 18);
      var py = vertical ? topY + i * (cardH + 14) + cardH / 2 : h * 0.56;
      items.push(this.makeCard(px, py, cardW, cardH, c, i, vertical));
      this.cards.push(c);
    }
    this.overlay = items;
  },

  makeCard: function (x, y, w, h, c, idx, vertical) {
    var self = this;
    var cont = this.add.container(x, y).setDepth(1002);
    var g = this.add.graphics();
    var draw = function (hover) {
      g.clear();
      g.fillStyle(0x16324a, 0.35); g.fillRoundedRect(-w / 2, -h / 2 + 7, w, h, 18);
      g.fillStyle(hover ? 0xffffff : 0xf3f9fd, 1); g.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
      g.lineStyle(4, c.color, 1); g.strokeRoundedRect(-w / 2, -h / 2, w, h, 18);
      g.fillStyle(c.color, 1);
      if (vertical) g.fillRoundedRect(-w / 2, -h / 2, 8, h, 4);
      else g.fillRoundedRect(-w / 2 + 14, -h / 2 + 14, w - 28, 62, 12);
    };
    draw(false);
    cont.add(g);
    if (vertical) {
      cont.add(this.add.text(-w / 2 + 40, 0, c.icon, { fontFamily: FONT, fontSize: '28px', color: CS.ink }).setOrigin(0.5));
      cont.add(txt(this, -w / 2 + 70, -16, c.name, 18, CS.ink));
      cont.add(txt(this, -w / 2 + 70, 8, c.desc, 12, CS.dim, '700'));
      if (c.tag) cont.add(txt(this, w / 2 - 14, -16, c.tag, 12, CS.cyan).setOrigin(1, 0));
      cont.add(txt(this, w / 2 - 14, 10, String(idx + 1), 12, '#a9bccd').setOrigin(1, 0));
    } else {
      cont.add(this.add.text(0, -h / 2 + 45, c.icon, { fontFamily: FONT, fontSize: '36px', color: '#ffffff' }).setOrigin(0.5));
      cont.add(txt(this, 0, -h / 2 + 96, c.name, 20, CS.ink).setOrigin(0.5));
      cont.add(txt(this, 0, -h / 2 + 124, c.tag, 13, CS.cyan).setOrigin(0.5));
      cont.add(this.add.text(0, -h / 2 + 160, c.desc, {
        fontFamily: FONT, fontSize: '13px', color: CS.dim, fontStyle: '700', align: 'center', wordWrap: { width: w - 34 }
      }).setOrigin(0.5, 0));
      cont.add(txt(this, 0, h / 2 - 26, '[' + (idx + 1) + ']', 12, '#a9bccd').setOrigin(0.5));
    }
    var z = this.add.zone(0, 0, w, h).setOrigin(0.5).setInteractive({ useHandCursor: true });
    cont.add(z);
    z.on('pointerover', function () { draw(true); cont.setScale(1.04); });
    z.on('pointerout', function () { draw(false); cont.setScale(1); });
    z.on('pointerdown', function () { cont.setScale(0.98); });
    z.on('pointerup', function () { self.pickCard(idx); });
    return cont;
  },

  pickCard: function (i) {
    if (!this.cards || !this.cards[i]) return;
    var c = this.cards[i];
    this.closeOverlay();
    this.gs.applyChoice(c);
  },

  /* ---------- results ---------- */

    var rows = [

      [TXT.time, fmtTime(d.time)],
      [TXT.kills, String(d.kills)],

    ];
