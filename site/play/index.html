<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e8f1f7">
<title>스틱맨 서바이벌 아레나</title>
<meta name="description" content="브라우저에서 바로 하는 스틱맨 생존 게임. 자동 공격으로 5분을 버티고, 친구와 파티 협동, 친선 대결, 승급 심사로 티어를 올리세요.">

<!-- Google AdSense — site verification + Auto ads loader -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7683569455054828"
     crossorigin="anonymous"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#dce8f1;
    font-family:"Trebuchet MS","Noto Sans KR",system-ui,-apple-system,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
    overscroll-behavior:none;touch-action:none;
  }
  #game{position:fixed;inset:0;}
  canvas{display:block;touch-action:none;}
  #boot{
    position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:20px;
    background:radial-gradient(circle at 50% 40%,#f6fbfe 0%,#dbe9f3 100%);
    transition:opacity .35s ease;
  }
  #boot.hide{opacity:0;pointer-events:none;}
  #boot .title{font-size:clamp(20px,5vw,34px);font-weight:900;letter-spacing:3px;color:#16324a;text-align:center;}
  #boot .sub{font-size:13px;letter-spacing:2px;color:#5b7590;font-weight:700;}
  .spin{width:46px;height:46px;border:5px solid #c6dced;border-top-color:#12a5c4;border-radius:50%;animation:sp .9s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* Ad panel: a small square parked on the left, and ONLY while the
     menu is open. It is never on screen during a run, so it can never
     cover the arena or catch a stray tap on a game control. */
  #adrail{
    display:none;position:fixed;left:18px;top:50%;transform:translateY(-50%);
    z-index:6;width:250px;
    background:#eef5fa;border:2px solid #d4e4ee;border-radius:14px;
    padding:6px 6px 8px;text-align:center;
  }
  #adrail.on{display:block;}
  .adlabel{
    font-size:9px;letter-spacing:2px;color:#93aabd;font-weight:700;
    text-transform:uppercase;padding-bottom:4px;
  }
  /* tablets / small laptops: shrink and drop to the bottom-left corner */
  @media (max-width:1000px){
    #adrail{width:180px;left:12px;top:auto;bottom:12px;transform:none;}
    #adrail ins{width:168px !important;height:168px !important;}
  }
  /* phones: no room next to the menu card, so no ad at all */
  @media (max-width:840px), (max-height:430px){
    #adrail.on{display:none;}
  }

  /* --- first-run nickname gate (HTML so Korean IME works) --- */
  #nickwrap{
    display:none;position:fixed;inset:0;z-index:50;
    align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 35%,#f6fbfe 0%,#d6e7f2 100%);
  }
  #nickwrap.on{display:flex;}
  #nickbox{
    width:min(400px,90vw);background:#fff;border-radius:24px;padding:26px 22px;
    box-shadow:0 18px 44px rgba(16,50,74,.22);text-align:center;color:#16324a;
  }
  #nickbox h2{font-size:21px;letter-spacing:.5px;margin-bottom:6px;}
  #nickbox p{font-size:13px;color:#5b7590;margin-bottom:16px;line-height:1.5;}
  #nickin{
    width:100%;padding:14px 16px;font-size:18px;font-weight:700;color:#16324a;
    border:3px solid #cfe3ef;border-radius:14px;outline:none;text-align:center;
    font-family:inherit;background:#f7fbfd;
  }
  #nickin:focus{border-color:#12a5c4;}
  #nickerr{min-height:18px;font-size:12px;color:#e4483d;font-weight:700;margin-top:8px;}
  #nickok{
    width:100%;margin-top:6px;padding:14px;border:0;border-radius:14px;cursor:pointer;
    background:#12a5c4;color:#fff;font-size:17px;font-weight:900;font-family:inherit;
    letter-spacing:1px;
  }
  #nickok:disabled{background:#a8bece;cursor:default;}

  #fatal{display:none;max-width:80%;text-align:center;color:#b3261e;font-weight:700;line-height:1.5;font-size:14px;}

  /* ===== social layer (friends / party / invites) — HTML so Korean IME works ===== */
  .sx, .sx *{box-sizing:border-box;}
  .sx{font-family:"Trebuchet MS","Noto Sans KR",system-ui,-apple-system,Arial,sans-serif;color:#16324a;
      -webkit-user-select:text;user-select:text;touch-action:auto;}
  .sx button{font-family:inherit;cursor:pointer;border:0;border-radius:12px;font-weight:900;}
  .sx input{font-family:inherit;}
  #soc{display:none;position:fixed;inset:0;z-index:60;background:rgba(13,31,46,.66);
       align-items:center;justify-content:center;padding:12px;}
  #soc.on{display:flex;}
  #soc .sp{width:min(440px,100%);max-height:min(620px,100%);display:flex;flex-direction:column;
       background:#fff;border-radius:22px;box-shadow:0 18px 44px rgba(16,50,74,.3);overflow:hidden;}
  #soc .sh{display:flex;align-items:center;gap:10px;padding:16px 18px 8px;}
  #soc .sh h3{font-size:19px;flex:1;margin:0;}
  #soc .sh .x{background:#eef5fa;color:#16324a;width:36px;height:36px;font-size:16px;}
  #soc .me{font-size:12px;color:#5b7590;font-weight:700;padding:0 18px 6px;}
  #soc .me b{color:#12a5c4;}
  #soc .tabs{display:flex;gap:6px;padding:4px 14px 10px;}
  #soc .tabs button{flex:1;padding:10px 4px;background:#dcecf6;color:#5b7590;font-size:13px;position:relative;}
  #soc .tabs button.on{background:#12a5c4;color:#fff;}
  #soc .tabs .dot{position:absolute;top:5px;right:8px;min-width:16px;height:16px;border-radius:8px;background:#e4483d;
       color:#fff;font-size:10px;line-height:16px;padding:0 4px;}
  #soc .sb{overflow-y:auto;padding:0 14px 16px;flex:1;-webkit-overflow-scrolling:touch;}
  .sx .sec{font-size:12px;font-weight:900;color:#5b7590;letter-spacing:.5px;margin:12px 4px 6px;}
  .sx .row{display:flex;align-items:center;gap:8px;background:#f2f7fb;border-radius:14px;padding:9px 10px;margin-bottom:6px;min-height:50px;}
  .sx .row .nm{flex:1;min-width:0;font-weight:900;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sx .row .sub{display:block;font-size:11px;color:#5b7590;font-weight:700;margin-top:2px;}
  .sx .on-dot{width:9px;height:9px;border-radius:50%;background:#a8bece;flex:none;}
  .sx .on-dot.y{background:#27ae60;}
  .sx .b{padding:8px 12px;font-size:12px;color:#fff;background:#12a5c4;white-space:nowrap;}
  .sx .b.g{background:#27ae60;} .sx .b.r{background:#e4483d;} .sx .b.k{background:#7e94a8;} .sx .b.y{background:#f2c94c;color:#16324a;}
  .sx .b:disabled{background:#c3d2de;color:#fff;cursor:default;}
  .sx .ip{display:flex;gap:6px;margin-bottom:6px;}
  .sx .ip input{flex:1;min-width:0;padding:11px 12px;border:2px solid #cfe3ef;border-radius:12px;font-size:15px;font-weight:700;
       color:#16324a;outline:none;background:#f7fbfd;}
  .sx .ip input:focus{border-color:#12a5c4;}
  .sx .msg{min-height:16px;font-size:12px;font-weight:900;margin:2px 4px 6px;}
  .sx .msg.ok{color:#27ae60;} .sx .msg.no{color:#e4483d;} .sx .msg.wait{color:#12a5c4;}
  .sx .st{font-size:11px;font-weight:900;white-space:nowrap;}
  .sx .st.wait{color:#12a5c4;} .sx .st.ok{color:#27ae60;} .sx .st.no{color:#e4483d;} .sx .st.time{color:#7e94a8;}
  .sx .empty{font-size:13px;color:#7e94a8;font-weight:700;text-align:center;padding:14px 4px;}
  .sx .modes{display:flex;gap:6px;margin:4px 0 8px;}
  .sx .modes button{flex:1;padding:10px;background:#eef5fa;color:#5b7590;font-size:13px;}
  .sx .modes button.on{background:#16324a;color:#fff;}
  .sx .team{font-size:11px;font-weight:900;padding:5px 9px;border-radius:9px;color:#fff;}
  .sx .team.A{background:#12a5c4;} .sx .team.B{background:#e4483d;}
  .sx .go{width:100%;padding:14px;font-size:16px;background:#12a5c4;color:#fff;margin-top:8px;}
  .sx .go:disabled{background:#c3d2de;}
  .sx .hint{font-size:11px;color:#7e94a8;font-weight:700;margin:6px 4px 0;line-height:1.5;}
  .sx .tier{font-size:11px;font-weight:900;color:#5b7590;}

  /* mailbox */
  .sx .ta{width:100%;min-height:110px;resize:vertical;padding:11px 12px;border:2px solid #cfe3ef;border-radius:12px;
       font-family:inherit;font-size:14px;font-weight:700;color:#16324a;background:#f7fbfd;outline:none;margin-bottom:6px;}
  .sx .ta.sm{min-height:64px;margin-top:8px;}
  .sx .ta:focus{border-color:#12a5c4;}
  .sx .mi{background:#f2f7fb;border-radius:14px;padding:10px 12px;margin-bottom:8px;border:2px solid transparent;}
  .sx .mi.new{border-color:#ffd0cc;background:#fff7f6;}
  .sx .mh{display:flex;align-items:center;gap:8px;}
  .sx .mt{padding:3px 8px;font-size:11px;border-radius:8px;cursor:default;}
  .sx .mtt{flex:1;min-width:0;font-weight:900;font-size:14px;overflow-wrap:anywhere;}
  .sx .nd{width:9px;height:9px;border-radius:50%;background:#e4483d;flex:none;}
  .sx .md{font-size:11px;color:#7e94a8;font-weight:700;margin:4px 0 2px;}
  .sx .mre{font-size:12px;color:#5b7590;font-weight:700;background:#e8f0f6;border-radius:8px;padding:5px 8px;margin:4px 0;overflow-wrap:anywhere;}
  .sx .mb{font-size:14px;font-weight:700;white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0 6px;line-height:1.5;}
  .sx .adm{margin-top:16px;padding-top:10px;border-top:1px solid #e4edf4;text-align:center;}
  .sx .lnk{background:none;color:#7e94a8;font-size:12px;text-decoration:underline;padding:4px;}
  #nickbox .lnk{display:block;margin:12px auto 0;background:none;border:0;color:#7e94a8;font-size:12px;text-decoration:underline;cursor:pointer;font-family:inherit;}
  #nickbox .adf input{width:100%;padding:11px 12px;margin-top:6px;font-size:15px;font-weight:700;border:3px solid #cfe3ef;border-radius:12px;
       outline:none;font-family:inherit;color:#16324a;background:#f7fbfd;text-align:center;}

  /* invitation popup */
  #invpop{display:none;position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:70;
       width:min(380px,calc(100% - 24px));background:#fff;border-radius:18px;padding:14px 14px 12px;
       box-shadow:0 14px 36px rgba(16,50,74,.32);border:3px solid #12a5c4;}
  #invpop.on{display:block;}
  #invpop .t{font-size:15px;font-weight:900;margin-bottom:4px;}
  #invpop .d{font-size:12px;color:#5b7590;font-weight:700;margin-bottom:10px;}
  #invpop .bar{height:5px;background:#e4edf4;border-radius:3px;overflow:hidden;margin-bottom:10px;}
  #invpop .bar i{display:block;height:100%;background:#12a5c4;}
  #invpop .bt{display:flex;gap:8px;}
  #invpop .bt button{flex:1;padding:11px;font-size:14px;color:#fff;}

  /* small notices, top centre */
  #notes{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:65;display:flex;flex-direction:column;
       align-items:center;gap:6px;pointer-events:none;width:min(420px,calc(100% - 24px));}
  #notes div{background:rgba(22,50,74,.92);color:#fff;font-weight:900;font-size:13px;padding:9px 14px;border-radius:12px;
       text-align:center;max-width:100%;transition:opacity .3s;}

  /* duel loadout picker */
  #lo{display:none;position:fixed;inset:0;z-index:55;background:rgba(13,31,46,.78);align-items:center;justify-content:center;padding:10px;}
  #lo.on{display:flex;}
  #lo .lp{width:min(760px,100%);max-height:100%;overflow-y:auto;background:#fff;border-radius:20px;padding:14px 14px 12px;}
  #lo .lh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px;}
  #lo .lh .rt{font-size:18px;font-weight:900;}
  #lo .lh .cd{font-size:26px;font-weight:900;color:#e4483d;min-width:44px;text-align:right;}
  #lo .sc{font-size:13px;font-weight:900;color:#5b7590;}
  #lo .slot{margin-bottom:8px;}
  #lo .slot .sl{font-size:11px;font-weight:900;color:#5b7590;margin:0 2px 4px;}
  #lo .opts{display:flex;gap:6px;flex-wrap:wrap;}
  #lo .opts button{flex:1 1 90px;padding:9px 6px;background:#eef5fa;color:#16324a;font-size:12px;line-height:1.3;border:2px solid transparent;}
  #lo .opts button small{display:block;font-size:10px;color:#5b7590;font-weight:700;}
  #lo .opts button.on{border-color:#12a5c4;background:#dff4fa;}
  #lo .teams{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
  #lo .tm{flex:1 1 200px;border-radius:14px;padding:8px 10px;background:#f2f7fb;}
  #lo .tm h4{margin:0 0 4px;font-size:12px;}
  #lo .tm.A h4{color:#12a5c4;} #lo .tm.B h4{color:#e4483d;}
  #lo .pl{font-size:12px;font-weight:700;margin:3px 0;}
  #lo .pl b{font-weight:900;}
  @media (max-height:520px){ #lo .opts button{padding:6px 4px;font-size:11px;} #lo .opts button small{display:none;} }
</style>
</head>
<body>

<div id="game"></div>
<div id="soc" class="sx"></div>
<div id="invpop" class="sx"></div>
<div id="notes" class="sx"></div>
<div id="lo" class="sx"></div>

<!-- =====================================================================
     GOOGLE ADSENSE  —  single top rail, outside the play area
     ---------------------------------------------------------------
     Placement rules this layout follows, so the account stays safe:
       * the square only appears on the MENU, never during a run
       * it is toggled with CSS only — the ad is requested once on load
         and never re-requested, so this is not an ad refresh
       * hidden entirely on phones, where there is no room beside the UI
       * nothing in the game rewards looking at or clicking it
       * one unit per page — no stacking, no interstitials

     Live unit: slot 4887574136, rendered at a fixed 238x238 square.
     The loader <script> is already in <head>, so it is NOT repeated here
     — loading adsbygoogle.js twice can throw and kill the slot.
     A fixed size is used instead of data-ad-format="auto" so the unit
     can never grow and push into the play area.
     ===================================================================== -->
<div id="adrail">
  <div class="adlabel">Advertisement</div>
  <ins class="adsbygoogle"
       style="display:inline-block;width:238px;height:238px"
       data-ad-client="ca-pub-7683569455054828"
       data-ad-slot="4887574136"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>


<div id="nickwrap">
  <div id="nickbox">
    <h2 id="nicktitle">Choose your name</h2>
    <p id="nicksub">This name is permanent and cannot be changed later.</p>
    <input id="nickin" maxlength="12" autocomplete="off" spellcheck="false">
    <div id="adf" class="adf" style="display:none">
      <input id="adId" maxlength="20" autocomplete="username">
      <input id="adPw" type="password" maxlength="20" autocomplete="current-password">
      <input id="adCode" type="password" maxlength="12" inputmode="numeric" autocomplete="off">
    </div>
    <div id="nickerr"></div>
    <button id="nickok">START</button>
    <div id="nickterms" style="font-size:11px;color:#7e94a8;margin-top:10px;line-height:1.5">시작하면 <a href="/terms.html" target="_blank" style="color:#5b7590">이용약관</a>과 <a href="/privacy.html" target="_blank" style="color:#5b7590">개인정보처리방침</a>에 동의한 것으로 봐요</div>
    <button id="admLink" class="lnk" type="button"></button>
  </div>
</div>

<div id="boot">
  <div class="title">STICKMAN SURVIVAL ARENA</div>
  <div class="spin" id="spin"></div>
  <div class="sub" id="bootmsg">LOADING…</div>
  <div id="fatal">Engine failed to load.<br>Check your connection and reload the page.</div>
</div>

<!-- =====================================================================
     ENGINE LOADER
     ---------------------------------------------------------------
     Tries the local phaser.min.js first (required for the CrazyGames
     zip), and automatically falls back to the CDN if that file is
     missing — so the page works whether or not you have downloaded it.
     For the final submission zip, put phaser.min.js next to this file;
     the fallback then never fires and no external call is made.
     ===================================================================== -->

<script>
/* on-screen error reporter — shows the real message instead of a blank screen */
window.__err = function (msg) {
  var f = document.getElementById('fatal'), sp = document.getElementById('spin'),
      bm = document.getElementById('bootmsg'), b = document.getElementById('boot');
  if (b) { b.classList.remove('hide'); b.style.display = 'flex'; b.style.opacity = 1; }
  if (sp) sp.style.display = 'none';
  if (bm) bm.style.display = 'none';
  if (f) { f.style.display = 'block'; f.innerHTML = String(msg).replace(/</g, '&lt;'); }
};
window.addEventListener('error', function (e) {
  if (!e.message) return;          /* ignore failed-resource events */
  window.__err('ERROR<br>' + (e.message || 'unknown') +
    '<br><br>' + (e.filename || '') + ' : line ' + (e.lineno || '?'));
});
</script>

<!-- Firebase (compat build: usable without npm / bundler) -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>

   (file://) or with ?local=1. Stands in for Firebase inside the
   browser: every window shares one database through localStorage, so
   two or three windows side by side can try friends, invites, party
   co-op, duels and the mailbox with no server at all. Each window is
   a separate player. Never active on the real website.
   ===================================================================== */
(function () {

  window.__LOCAL = { tab: tab };

  var KEY = 'ssa_localdb', OPKEY = 'ssa_localdb_op', seq = 0;
  var tree = {};
  try { tree = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { tree = {}; }

  var split = function (p) { return String(p || '').split('/').filter(Boolean); };
  var norm = function (p) { return split(p).join('/'); };
  function clone(v) { return v === undefined || v === null ? null : JSON.parse(JSON.stringify(v)); }
  function clean(v) {

    if (!parts.length) { tree = val || {}; return; }

      var k = parts[i];

      stack.push([n, k]); n = n[k];
    }
    var last = parts[parts.length - 1];
    if (val === null) delete n[last]; else n[last] = val;
    for (var j = stack.length - 1; j >= 0; j--) {

  function overlaps(a, b) { for (var i = 0; i < Math.min(a.length, b.length); i++) if (a[i] !== b[i]) return false; return true; }

    applyOp(m.o);
  });

  function Snap(key, val) { this.key = key; this._v = val === undefined ? null : val; }
  Snap.prototype.val = function () { return clone(this._v); };
  Snap.prototype.exists = function () { return this._v !== null; };

var SFX = {
  ctx: null, master: null, muted: Store.get('mute', false), vol: 0.30, last: {},
  init: function () {
    if (this.ctx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : this.vol;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
  },
  resume: function () {
    this.init();
    if (this.ctx && this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) {} }
  },
  setMuted: function (m) {
    this.muted = m; Store.set('mute', m);
    if (this.master) this.master.gain.value = m ? 0 : this.vol;
  },
  duck: function (on) { if (this.master) this.master.gain.value = (on || this.muted) ? 0 : this.vol; },
  tone: function (freq, dur, type, vol, slideTo) {
    if (!this.ctx || this.muted) return;
    var t = this.ctx.currentTime;
    var o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) { try { o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur); } catch (e) {} }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001, vol || 0.25), t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.03);
  },
  noise: function (dur, vol, cut) {
    if (!this.ctx || this.muted) return;
    var t = this.ctx.currentTime;
    var n = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
    var buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var src = this.ctx.createBufferSource(); src.buffer = buf;
    var f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cut || 1400;
    var g = this.ctx.createGain(); g.gain.value = vol || 0.25;
    src.connect(f); f.connect(g); g.connect(this.master); src.start(t);
  },
  seq: function (notes, step, dur, type, vol) {
    var self = this;
    notes.forEach(function (f, i) { setTimeout(function () { self.tone(f, dur, type, vol); }, i * step); });
  },
  play: function (name) {
    if (!this.ctx || this.muted) return;
    var now = performance.now();
    var gaps = { swing: 55, shoot: 55, hit: 40, kill: 55, hurt: 220, pickup: 40 };
    var gap = gaps[name] || 0;
    if (gap && this.last[name] && now - this.last[name] < gap) return;
    this.last[name] = now;
    switch (name) {
      case 'swing':   this.noise(0.08, 0.14, 2800); this.tone(520, 0.07, 'triangle', 0.08, 180); break;
      case 'shoot':   this.tone(900, 0.05, 'square', 0.07, 320); break;
      case 'arrow':   this.tone(720, 0.07, 'sawtooth', 0.06, 260); break;
      case 'hit':     this.tone(250, 0.04, 'square', 0.06, 150); break;

      case 'explode': this.noise(0.32, 0.30, 700); this.tone(95, 0.28, 'sawtooth', 0.14, 40); break;
      case 'pickup':  this.tone(1150, 0.045, 'sine', 0.07, 1700); break;
      case 'heal':    this.tone(660, 0.10, 'sine', 0.12, 990); break;

var Rank = {
  db: null, ready: false, TOP: 50, MAX_SCORE: 300000,

  init: function () {
    try {
      if (!window.firebase || !firebase.initializeApp) return;
      firebase.initializeApp(FB_CONFIG);
      this.db = firebase.database();
      this.ready = true;
    } catch (e) { this.ready = false; }
  },

  /* firebase keys cannot contain . # $ [ ] / */
  key: function (nick) {
    return String(nick).replace(/[.#$\[\]\/]/g, '_').toLowerCase().slice(0, 24);
  },

  /* obvious-nonsense filter, mirrored by the database rules */
  plausible: function (score, ms) {
    if (!(score > 0) || score > this.MAX_SCORE) return false;
    if (!(ms >= 0)) return false;
    /* even a perfect run cannot out-earn roughly 900 points per second */
    return score <= 4000 + (ms / 1000) * 900;
  },

  submit: function (nick, score, ms) {
    if (!this.ready || !nick) return;
    if (!this.plausible(score, ms)) return;
    var ref = this.db.ref('scores/' + this.key(nick));
    /* transaction keeps the row at the player's personal best */
    ref.transaction(function (cur) {
      if (cur && cur.score >= score) return;      /* abort, keep old */
      return { nick: nick, score: Math.round(score), time: Math.round(ms), ts: Date.now() };
    }).catch(function () {});
  },

  top: function (cb) {
    if (!this.ready) { cb(null); return; }
    this.db.ref('scores').orderByChild('score').limitToLast(this.TOP).once('value')
      .then(function (snap) {
        var out = [];
        snap.forEach(function (c) { out.push(c.val()); });
        out.reverse();                 /* firebase returns ascending */
        cb(out);
      })
      .catch(function () { cb(null); });

    if (this.busy) { onFail('busy'); return; }
    this.busy = true;
    var finish = function (ok, why) {
      self.busy = false;
      if (ok) onDone(); else onFail(why || 'error');
    };

    /* --- 1. CrazyGames --- */
    if (this.hasNetwork()) {
      CG.rewarded(function () { finish(true); }, function () { finish(false); });
      return;
    }

    /* --- 2. your own network goes here ---------------------------------
       Example shape for most web SDKs:

         window.adSdk.showRewarded({
           onComplete: function () { finish(true); },
           onError:    function () { finish(false); }
         });
         return;
       ------------------------------------------------------------------ */

    /* --- 3. fallback: timed wait, no reward-for-ad-view claim --- */
    this.fallback(function (ok) { finish(ok, 'cancel'); });
  },

  /* Plain countdown used when no rewarded network is connected.
     Overridden by MenuScene so it can draw the countdown panel. */
  fallback: function (cb) { cb(false); }
};

var CG = {
  sdk: null, ready: false, adRunning: false, lastAd: -999999, gameplayOn: false,
  init: function () {
    try {
      if (window.CrazyGames && window.CrazyGames.SDK) {
        var p = window.CrazyGames.SDK.init();
        var self = this;
        if (p && p.then) { p.then(function () { self.sdk = window.CrazyGames.SDK; self.ready = true; })
                            .catch(function () { self.ready = false; }); }
        else { this.sdk = window.CrazyGames.SDK; this.ready = true; }
      }
    } catch (e) { this.ready = false; }
  },
  safe: function (fn) { if (!this.ready) return; try { fn(); } catch (e) {} },
  loadingStart:  function () { var s = this; this.safe(function () { s.sdk.game.loadingStart(); }); },
  loadingStop:   function () { var s = this; this.safe(function () { s.sdk.game.loadingStop(); }); },
  gameplayStart: function () { var s = this; if (this.gameplayOn) return; this.gameplayOn = true;
                               this.safe(function () { s.sdk.game.gameplayStart(); }); },
  gameplayStop:  function () { var s = this; if (!this.gameplayOn) return; this.gameplayOn = false;
                               this.safe(function () { s.sdk.game.gameplayStop(); }); },
  happytime:     function () { var s = this; this.safe(function () { s.sdk.game.happytime(); }); },
  /* Midgame ad — called between runs, never during gameplay. */
  midgame: function (done) {
    var s = this;
    if (!this.ready || this.adRunning || performance.now() - this.lastAd < 90000) { done(); return; }
    this.adRunning = true; this.gameplayStop(); SFX.duck(true);
    var finish = function () { s.adRunning = false; s.lastAd = performance.now(); SFX.duck(false); done(); };
    try {
      this.sdk.ad.requestAd('midgame', { adFinished: finish, adError: finish, adStarted: function () {} });
    } catch (e) { finish(); }
  },
  /* Rewarded ad — used for the one-time revive on game over. */
  rewarded: function (onReward, onFail) {
    var s = this;
    if (!this.ready) { onFail(); return; }
    if (this.adRunning) { onFail(); return; }
    this.adRunning = true; SFX.duck(true);
    var end = function (ok) { s.adRunning = false; SFX.duck(false); ok ? onReward() : onFail(); };
    try {
      this.sdk.ad.requestAd('rewarded', {
        adFinished: function () { end(true); },
        adError: function () { end(false); },
        adStarted: function () {}
      });
    } catch (e) { end(false); }
  }
};

   ===================================================================== */
function shade(col, amt) {
  var r = (col >> 16) & 255, g = (col >> 8) & 255, b = col & 255;
  r = Phaser.Math.Clamp(Math.round(r + 255 * amt), 0, 255);
  g = Phaser.Math.Clamp(Math.round(g + 255 * amt), 0, 255);
  b = Phaser.Math.Clamp(Math.round(b + 255 * amt), 0, 255);
  return (r << 16) | (g << 8) | b;
}
/* Firebase may hand arrays back as {0:..,1:..} objects, or drop empty
   ones entirely — always read list fields through this */
function arr(v) {
  if (!v) return [];
  if (Array.isArray(v)) return v;
  if (typeof v !== 'object') return [];
  var ks = Object.keys(v).sort(function (a, b) { return a - b; }), out = [];
  for (var i = 0; i < ks.length; i++) out.push(v[ks[i]]);
  return out;
}
function fmtTime(ms) {
  var s = Math.max(0, Math.floor(ms / 1000));
  var m = Math.floor(s / 60);
  s = s % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}
function txt(scene, x, y, s, size, color, weight) {
  return scene.add.text(x, y, s, {
    fontFamily: FONT, fontSize: size + 'px',
    color: color || CS.ink, fontStyle: weight || '900'
  });
}

/* =====================================================================
   8. PROCEDURAL TEXTURES  (zero image files → instant load)
   ===================================================================== */
function mkTex(scene, key, w, h, fn) {
  if (scene.textures.exists(key)) return;
  var g = scene.make.graphics({ x: 0, y: 0, add: false });
  fn(g, w, h);
  g.generateTexture(key, w, h);
  g.destroy();
}

function stickman(g, w, h, color, lw, pose, opt) {
  opt = opt || {};
  /* horned heads need headroom, otherwise the tips fall outside the frame */
  var off = opt.horns ? h * 0.12 : 0;
  if (off) { g.translateCanvas(0, off); h -= off; }
  var cx = w / 2, headR = h * 0.135, headY = headR + lw * 0.7;
  var neck = headY + headR * 0.95, hip = h * 0.60, sh = neck + h * 0.055;
  var L = function (x1, y1, x2, y2) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.strokePath(); };
  g.lineStyle(lw, color, 1);
  g.fillStyle(color, 1);
  g.fillCircle(cx, headY, headR);
  L(cx, neck, cx, hip);
  var aw = w * 0.34, ah = h * 0.10, foot = h - lw * 0.6;
  if (pose === 0) {
    L(cx, sh, cx - aw, sh + ah); L(cx, sh, cx + aw, sh - ah * 0.55);
    L(cx, hip, cx - w * 0.30, foot); L(cx, hip, cx + w * 0.17, foot);
  } else {
    L(cx, sh, cx - aw, sh - ah * 0.55); L(cx, sh, cx + aw, sh + ah);
    L(cx, hip, cx - w * 0.17, foot); L(cx, hip, cx + w * 0.30, foot);
  }
  /* joints so the line art reads cleanly at small sizes */
  g.fillCircle(cx, hip, lw * 0.5);
  if (opt.horns) {
    g.fillStyle(opt.horns, 1);
    g.fillTriangle(cx - headR * 0.9, headY - headR * 0.5, cx - headR * 1.9, headY - headR * 2.0, cx - headR * 0.2, headY - headR * 1.2);
    g.fillTriangle(cx + headR * 0.9, headY - headR * 0.5, cx + headR * 1.9, headY - headR * 2.0, cx + headR * 0.2, headY - headR * 1.2);
  }
  if (opt.eyes) {
    g.fillStyle(opt.eyes, 1);
    g.fillCircle(cx - headR * 0.36, headY - headR * 0.05, headR * 0.21);
    g.fillCircle(cx + headR * 0.36, headY - headR * 0.05, headR * 0.21);
  }
  if (opt.band) {
    g.fillStyle(opt.band, 1);
    g.fillRect(cx - headR, headY - headR * 0.72, headR * 2, headR * 0.44);
  }
}

/* Tier emblem. Bands: metal shields (copper..gold) with 1-3 chevrons
   or a star, then cut gems (diamond, sapphire), a winged crest (ruby)
   and a dark crowned crest with a glowing ring (ramane). */
function drawEmblem(g, w, h, T) {
  var cx = w / 2, cy = h / 2;
  var shield = function (inset, col) {
    g.fillStyle(col, 1);
    g.beginPath();
    g.moveTo(cx, 4 + inset); g.lineTo(w - 9 - inset, 13 + inset); g.lineTo(w - 9 - inset, h * 0.55);
    g.lineTo(cx, h - 3 - inset); g.lineTo(9 + inset, h * 0.55); g.lineTo(9 + inset, 13 + inset);
    g.closePath(); g.fillPath();
  };
  var star = function (x, y, r, col) {
    g.fillStyle(col, 1); g.beginPath();
    for (var i = 0; i < 10; i++) {
      var a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
      if (i) g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); else g.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    g.closePath(); g.fillPath();
  };
  var wings = function (col) {
    g.fillStyle(col, 1);
    g.fillTriangle(10, 20, 0, 14, 8, 36); g.fillTriangle(10, 26, 1, 30, 9, 42);
    g.fillTriangle(w - 10, 20, w, 14, w - 8, 36); g.fillTriangle(w - 10, 26, w - 1, 30, w - 9, 42);
  };
  if (T.id <= 3) {
    shield(0, T.b); shield(5, T.a);
    g.fillStyle(T.b, 1);
    if (T.id === 3) star(cx, cy + 1, 12, T.b);
    else for (var k = 0; k <= T.id; k++) {
      var y = 21 + k * 8 + (2 - T.id) * 4;
      g.fillTriangle(cx, y, cx - 11, y + 8, cx + 11, y + 8);
      g.fillStyle(T.a, 1); g.fillTriangle(cx, y + 4, cx - 6, y + 8, cx + 6, y + 8); g.fillStyle(T.b, 1);
    }
  } else if (T.id === 4) {                               /* diamond: faceted rhombus */
    g.fillStyle(T.b, 1); g.fillTriangle(cx, 4, w - 8, cy - 4, 8, cy - 4); g.fillTriangle(8, cy - 4, w - 8, cy - 4, cx, h - 3);
    g.fillStyle(T.a, 1); g.fillTriangle(cx, 9, w - 15, cy - 4, 15, cy - 4); g.fillTriangle(15, cy - 2, w - 15, cy - 2, cx, h - 10);
    g.fillStyle(0xffffff, 0.55); g.fillTriangle(cx, 9, cx - 9, cy - 4, cx + 2, cy - 4);
  } else if (T.id === 5) {                               /* sapphire: winged hexagon gem */
    wings(T.b);
    var hex = function (r, col) { g.fillStyle(col, 1); g.beginPath();
      for (var i = 0; i < 6; i++) { var a = Math.PI / 6 + i * Math.PI / 3;
        if (i) g.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); else g.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); }
      g.closePath(); g.fillPath(); };
    hex(22, T.b); hex(16, T.a);
    g.fillStyle(0xffffff, 0.5); g.fillTriangle(cx, cy - 15, cx - 10, cy - 6, cx, cy - 2);
  } else if (T.id === 6) {                               /* ruby: winged crest with a flame gem */
    wings(T.b); shield(2, T.b); shield(7, T.a);
    g.fillStyle(T.b, 1); g.fillTriangle(cx, 17, cx - 9, cy + 6, cx + 9, cy + 6); g.fillCircle(cx, cy + 6, 9);
    g.fillStyle(0xffd0d6, 0.8); g.fillCircle(cx - 3, cy + 3, 3);
  } else {                                               /* ramane: dark crest, crown, glowing ring */
    g.lineStyle(4, T.a, 0.9); g.strokeCircle(cx, cy + 2, 27);
    wings(T.a); shield(3, T.b);
    g.lineStyle(2, T.a, 1); g.strokeCircle(cx, cy + 3, 12);
    star(cx, cy + 3, 9, T.a);
    g.fillStyle(0xf7d264, 1);                            /* crown */
    g.fillRect(cx - 11, 4, 22, 6);
    g.fillTriangle(cx - 11, 4, cx - 7, -2 + 4, cx - 3, 4); g.fillTriangle(cx - 4, 4, cx, -4 + 4, cx + 4, 4);
    g.fillTriangle(cx + 3, 4, cx + 7, -2 + 4, cx + 11, 4);
  }
}

function buildTextures(scene) {
  /* floor tile */
  mkTex(scene, 'tile', 128, 128, function (g, w, h) {   /* POT size keeps WebGL tiling crisp */
    g.fillStyle(C.floor, 1); g.fillRect(0, 0, w, h);
    g.lineStyle(2, C.grid, 1);
    g.beginPath(); g.moveTo(0, 0); g.lineTo(w, 0); g.strokePath();
    g.beginPath(); g.moveTo(0, 0); g.lineTo(0, h); g.strokePath();
    g.fillStyle(C.grid, 0.85); g.fillCircle(w / 2, h / 2, 2.5);
  });
  /* obstacle */
  mkTex(scene, 'rock', 80, 68, function (g, w, h) {
    g.fillStyle(0xc3d5e2, 1);
    g.fillRoundedRect(4, 12, w - 8, h - 16, 16);
    g.fillStyle(0xdcebf5, 1);
    g.fillRoundedRect(10, 6, w - 26, h - 30, 14);
    g.lineStyle(4, 0x8fb0c9, 1);
    g.strokeRoundedRect(4, 12, w - 8, h - 16, 16);
  });
  /* player */
  /* one 2-frame set per unlockable colour, so switching skins is free */
  for (var si = 0; si < SKINS.length; si++) {
    for (var p = 0; p < 2; p++) {
      mkTex(scene, 'p_' + SKINS[si].id + '_' + p, 32, 44, (function (sk, pose) {
        return function (g, w, h) { stickman(g, w, h, sk.body, 4, pose, { band: sk.band }); };
      })(SKINS[si], p));
    }
  }
  /* enemies */
  for (var i = 0; i < 2; i++) {
    mkTex(scene, 'e_n_' + i, 30, 40, (function (pose) {
      return function (g, w, h) { stickman(g, w, h, C.red, 4, pose, { eyes: 0xfff3f2 }); };
    })(i));
    mkTex(scene, 'e_f_' + i, 27, 37, (function (pose) {
      return function (g, w, h) { stickman(g, w, h, C.orange, 3, pose, { eyes: 0xfffaf0 }); };
    })(i));
    mkTex(scene, 'e_t_' + i, 42, 52, (function (pose) {
      return function (g, w, h) { stickman(g, w, h, C.purple, 7, pose, { eyes: 0xf6efff }); };
    })(i));
    mkTex(scene, 'e_b_' + i, 80, 100, (function (pose) {
      return function (g, w, h) { stickman(g, w, h, C.boss, 11, pose, { eyes: 0xff4d4d, horns: C.boss }); };
    })(i));
  }
  /* slash arc */
  mkTex(scene, 'slash', 150, 150, function (g, w, h) {
    var cx = w / 2, cy = h / 2;
    g.lineStyle(16, C.white, 1);
    g.beginPath(); g.arc(cx, cy, 58, Phaser.Math.DegToRad(-52), Phaser.Math.DegToRad(52), false); g.strokePath();
    g.lineStyle(7, C.cyanLt, 1);
    g.beginPath(); g.arc(cx, cy, 44, Phaser.Math.DegToRad(-40), Phaser.Math.DegToRad(40), false); g.strokePath();
  });
  /* projectiles */
  mkTex(scene, 'bul', 12, 12, function (g, w, h) {
    g.fillStyle(C.ink, 1); g.fillCircle(6, 6, 6);
    g.fillStyle(C.gold, 1); g.fillCircle(6, 6, 4);
  });
  mkTex(scene, 'arrow', 30, 10, function (g, w, h) {
    g.fillStyle(C.green, 1);
    g.fillRect(2, 4, 22, 3);
    g.fillTriangle(20, 0, 30, 5, 20, 10);
    g.fillRect(0, 1, 4, 8);
  });
  mkTex(scene, 'bombp', 20, 20, function (g, w, h) {
    g.fillStyle(C.dark, 1); g.fillCircle(10, 11, 8);
    g.fillStyle(C.gold, 1); g.fillCircle(14, 3, 3);
  });
  mkTex(scene, 'ebul', 14, 14, function (g) {      /* enemy bullet: red with a white core */
    g.fillStyle(0x7a0f1e, 1); g.fillCircle(7, 7, 7);
    g.fillStyle(0xff3b4f, 1); g.fillCircle(7, 7, 5.5);
    g.fillStyle(0xffffff, 0.95); g.fillCircle(7, 7, 2.4);
  });
  mkTex(scene, 'spark', 8, 8, function (g) { g.fillStyle(C.white, 1); g.fillCircle(4, 4, 4); });
  mkTex(scene, 'ring', 128, 128, function (g) {
    g.lineStyle(10, C.white, 1); g.strokeCircle(64, 64, 56);
  });
  /* pickups */
  mkTex(scene, 'gem', 16, 16, function (g, w, h) {
    g.fillStyle(C.gem, 1); g.fillTriangle(8, 0, 16, 8, 8, 16); g.fillTriangle(8, 0, 0, 8, 8, 16);
    g.fillStyle(0xa9d3ff, 1); g.fillTriangle(8, 2, 4, 8, 8, 8);
  });
  mkTex(scene, 'gem2', 24, 24, function (g, w, h) {
    g.fillStyle(C.gem2, 1); g.fillTriangle(12, 0, 24, 12, 12, 24); g.fillTriangle(12, 0, 0, 12, 12, 24);
    g.fillStyle(0xe0c6ff, 1); g.fillTriangle(12, 3, 6, 12, 12, 12);
  });
  mkTex(scene, 'heart', 24, 22, function (g, w, h) {
    g.fillStyle(C.heart, 1);
    g.fillCircle(7, 7, 7); g.fillCircle(17, 7, 7);
    g.fillTriangle(0.5, 8, 23.5, 8, 12, 22);
  });
  mkTex(scene, 'magnet', 24, 24, function (g, w, h) {
    g.lineStyle(7, 0x4b6bd9, 1);
    g.beginPath(); g.arc(12, 13, 8, Math.PI, 0, false); g.strokePath();
    g.fillStyle(C.red, 1); g.fillRect(1, 13, 7, 7); g.fillRect(16, 13, 7, 7);
  });
  mkTex(scene, 'shadow', 36, 14, function (g, w, h) {
    g.fillStyle(0x16324a, 0.16); g.fillEllipse(18, 7, 36, 14);
  });
  /* animations */
  var mk = function (key, a, b, fps) {
    if (scene.anims.exists(key)) return;
    scene.anims.create({
      key: key,
      frames: [{ key: a, frame: '__BASE' }, { key: b, frame: '__BASE' }],
      frameRate: fps, repeat: -1
    });
  };
  /* --- tier emblems: original art, one silhouette family per band --- */
  for (var ti = 0; ti < TIERS.length; ti++) {
    mkTex(scene, 'tier_' + ti, 60, 60, (function (T) {
      return function (g, w, h) { drawEmblem(g, w, h, T); };
    })(TIERS[ti]));
  }
  mkTex(scene, 'tier_u', 60, 60, function (g, w, h) {
    g.fillStyle(0x9fb3c4, 1); g.fillCircle(w / 2, h / 2, 24);
    g.fillStyle(0xdbe6ee, 1); g.fillCircle(w / 2, h / 2, 18);
    g.fillStyle(0x9fb3c4, 1); g.fillRect(w / 2 - 9, h / 2 - 2, 18, 4);
  });

  for (var sj = 0; sj < SKINS.length; sj++) {
    mk('w_' + SKINS[sj].id, 'p_' + SKINS[sj].id + '_0', 'p_' + SKINS[sj].id + '_1', 9);
  }
  mk('w_n', 'e_n_0', 'e_n_1', 7);
  mk('w_f', 'e_f_0', 'e_f_1', 12);
  mk('w_t', 'e_t_0', 'e_t_1', 5);
  mk('w_b', 'e_b_0', 'e_b_1', 5);
}

var Enemy = new Phaser.Class({
  Extends: Phaser.Physics.Arcade.Sprite,
  initialize: function Enemy(scene, x, y, tex) {
    Phaser.Physics.Arcade.Sprite.call(this, scene, x, y, tex || 'e_n_0');
    this.hp = 1; this.maxHp = 1; this.speed = 50; this.dmg = 5;
    this.nextHit = 0; this.flash = 0; this.stun = 0; this.phase = 0;
    this.isBoss = false; this.dashT = 0; this.dashing = 0;
  },
  spawn: function (key, x, y, hpMul, dmgMul, spdMul) {
    var d = ETYPE[key];
    this.typeKey = key;
    this.setTexture(d.tex);
    this.enableBody(true, x, y, true, true);
    this.setActive(true).setVisible(true);
    this.body.setCircle(d.r, this.width / 2 - d.r, this.height / 2 - d.r);
    this.body.setDrag(700, 700);
    this.maxHp = this.hp = Math.round(d.hp * hpMul);
    this.dmg = d.dmg * dmgMul;
    this.speed = d.spd * spdMul;
    this.baseScore = d.score; this.xpVal = d.xp; this.knock = d.knock;
    this.sapVal = d.sap || 8;
    this.isBoss = !!d.boss;
    this.baseTint = 0;
    this.nextHit = 0; this.flash = 0; this.stun = 0;
    this.phase = Math.random() * 6.28;
    this.wobble = this.isBoss ? 0 : 0.35;
    this.dashT = 3200; this.dashing = 0;
    this.fleeT = 0; this.fleeCd = 4000; this.heal = 0;
    this.flees = this.isBoss ? 2 : 0;   /* retreats allowed per boss */
    this.lead = undefined;
    this.setDepth(this.isBoss ? 11 : 10);
    this.setScale(1).setAlpha(1).clearTint();
    this.play(d.anim, true);
    return this;
  },
  update: function (time, delta) {
    if (!this.active) return;
    var s = this.scene, p = s.targetFor ? s.targetFor(this, time) : s.player;
    if (!p || !p.active) {               /* everyone is down: drift to a stop */
      this.body.velocity.x *= 0.9; this.body.velocity.y *= 0.9;
      return;
    }

    if (this.flash > 0) {
      this.flash -= delta;
      if (this.flash <= 0) { if (this.baseTint) this.setTint(this.baseTint); else this.clearTint(); }
    }

    if (this.stun > 0) { this.stun -= delta; return; }

    var ang = Math.atan2(p.y - this.y, p.x - this.x);
    var spd = this.speed;

    if (this.isBoss) {
      this.dashT -= delta;
      var frac = this.hp / this.maxHp;

      /* --- dirty trick 1: bail out when badly hurt ---------------------
         Under 35% HP the boss disengages, circles away to heal a little,
         then comes back. It only does this while it still has retreats
         left, so it cannot stall forever. */
      if (this.fleeT > 0) {
        this.fleeT -= delta;
        this.heal += delta;
        if (this.heal >= 500) {
          this.heal = 0;
          this.hp = Math.min(this.maxHp, this.hp + this.maxHp * 0.012);
        }
        ang += Math.PI;                       /* run away from the player */
        ang += Math.sin(time * 0.002) * 0.6;  /* weave so it is hard to chase */
        spd = this.speed * 2.1;
        this.setAlpha(0.75);
        this.body.velocity.x = Math.cos(ang) * spd;
        this.body.velocity.y = Math.sin(ang) * spd;
        this.flipX = (Math.cos(ang) < 0);
        if (this.fleeT <= 0) { this.setAlpha(1); this.dashT = 900; }
        return;
      }
      if (frac < 0.35 && this.flees > 0 && this.fleeCd <= 0) {
        this.flees--;
        this.fleeT = 2600;
        this.fleeCd = 9000;
        this.heal = 0;
        SFX.play('charge');
        Bus.emit('toast', TXT.bossFlee, 1400);
      }
      if (this.fleeCd > 0) this.fleeCd -= delta;

      /* --- dirty trick 2: fake out before the dash --------------------- */
      if (this.dashing > 0) {
        this.dashing -= delta;
        spd = this.speed * 3.4;
        if (this.dashing <= 0) { if (this.baseTint) this.setTint(this.baseTint); else this.clearTint(); }
      } else if (this.dashT <= 0) {
        /* the angrier it gets, the more often it charges */
        this.dashT = 3600 - (1 - frac) * 1500;
        this.dashing = 700;
        this.setTint(0xff8080);
        SFX.play('charge');
        /* it aims where the player is HEADING, not where they are */
        var pv = p.body ? p.body.velocity : null;
        if (pv) this.lead = Math.atan2(p.y + pv.y * 0.35 - this.y, p.x + pv.x * 0.35 - this.x);
      }
      if (this.dashing > 0 && this.lead !== undefined) ang = this.lead;

      /* --- dirty trick 3: keep its distance while reloading ------------ */
      var d = Phaser.Math.Distance.Between(this.x, this.y, p.x, p.y);
      if (this.dashing <= 0 && this.dashT > 1200 && d < 150) {
        ang += Math.PI * 0.82;      /* strafe out of melee range */
        spd = this.speed * 1.5;
      }
    } else {
      ang += Math.sin(time * 0.004 + this.phase) * this.wobble;
    }

    this.body.velocity.x = Math.cos(ang) * spd;
    this.body.velocity.y = Math.sin(ang) * spd;
    this.flipX = (p.x < this.x);
  },
  hurt: function (dmg, fromX, fromY) {
    this.hp -= dmg;
    this.setTintFill(0xffffff); this.flash = 70;
    if (this.knock > 0 && !this.isBoss) {
      var a = Math.atan2(this.y - fromY, this.x - fromX);
      var k = 190 * this.knock;
      this.body.velocity.x = Math.cos(a) * k;
      this.body.velocity.y = Math.sin(a) * k;
      this.stun = 90;
    }
    return this.hp <= 0;
  },
  kill: function () {
    this.disableBody(true, true);
    this.setActive(false).setVisible(false);
    this.clearTint();
  }
});

var Bullet = new Phaser.Class({

    this.life = 0; this.dmg = 1; this.pierce = 0; this.kind = 'shot';
    this.radius = 0; this.hitList = [];
  },
  launch: function (tex, x, y, ang, dmg, speed, pierce, life) {
    this.setTexture(tex);
    this.enableBody(true, x, y, true, true);
    this.setActive(true).setVisible(true);
    this.body.setCircle(6, this.width / 2 - 6, this.height / 2 - 6);
    this.body.velocity.x = Math.cos(ang) * speed;
    this.body.velocity.y = Math.sin(ang) * speed;
    this.setRotation(ang);
    this.dmg = dmg; this.pierce = pierce; this.life = life;
    this.kind = 'shot'; this.radius = 0;
    this.owner = this.scene.cur || null;
    this.hitList.length = 0;

  },

    if (!this.active) return;
    this.life -= delta;

      this.rotation += delta * 0.012;
      if (this.life <= 0) { this.scene.explode(this.x, this.y, this.radius, this.dmg, this.owner); this.kill(); return; }
    }
    if (this.life <= 0) this.kill();
  },
  kill: function () {
    this.disableBody(true, true);
    this.setActive(false).setVisible(false);
  }
});


/* =====================================================================
   5e. NET  —  identity, presence, friends, invites and party rooms
   ---------------------------------------------------------------
   Everything rides on the same Firebase Realtime Database as the
   leaderboard. Paths:
     nicks/{k}            nickname claim  {nick, dev, ts}
     pres/{k}             online presence {nick, st, r, sc, ts}
     freq/{to}/{from}     friend request  {nick, ts}
     friends/{k}/{f}      friend entry    {nick, ts}
     inv/{to}/{from}      invite          {nick, room, mode, ts, st}
     rooms/{id}           party room      {host, mode, st, gen, ts, mem:{k:{...}}}
     rooms/{id}/g/{k}     co-op channels  i = guest input, s = host snapshot
     rooms/{id}/d/{k}     duel player streams, rooms/{id}/dg = duel state
   There is no login, so a determined person could spoof writes; the
   database rules stop casual mistakes, not attackers. Fine for a free
   casual game, not for anything with money attached.
   ===================================================================== */
var PARTY_MAX = 3;
var INVITE_MS = 60000;

var Net = {
  db: null, ok: false, started: false,
  k: '', nick: '', dev: '', off: 0,
  friends: {},      /* k -> {nick, on, st, r, sc} */
  reqs: {},         /* k -> {nick, ts} */
  inbox: {},        /* invites to me: from k -> {...} */
  sent: {},         /* invites I sent: to k -> {nick, st, ts, mode} */
  room: null, roomId: null,
  ev: new Phaser.Events.EventEmitter(),

  now: function () { return Date.now() + this.off; },
  ref: function (p) { return this.db.ref(p); },
  keyOf: function (nick) { return Rank.key(nick); },

  init: function () {
    var dev = Store.get('dev', '');
    if (!dev) { dev = (Date.now().toString(36) + Math.random().toString(36).slice(2, 10)); Store.set('dev', dev); }
    this.dev = dev;
    this.db = Rank.db;
    this.ok = !!(Rank.ready && this.db);
    if (!this.ok) return;
    var self = this;
    try { this.ref('.info/serverTimeOffset').on('value', function (s) { self.off = s.val() || 0; }); } catch (e) {}
  },

  /* claim a nickname for this device; cb(ok, reason) */
  claim: function (nick, cb) {
    if (!this.ok) { cb(true, 'offline'); return; }
    var k = this.keyOf(nick), dev = this.dev, done = false;
    var fin = function (ok, why) { if (done) return; done = true; cb(ok, why); };
    setTimeout(function () { fin(true, 'slow'); }, 3500);      /* never block the game on the network */
    this.ref('nicks/' + k).transaction(function (cur) {
      if (cur && cur.dev && cur.dev !== dev) return;          /* abort: someone else owns it */
      return { nick: nick, dev: dev, ts: cur && cur.ts ? cur.ts : Date.now() };
    }).then(function (r) {
      fin(!!(r && r.committed), r && r.committed ? '' : 'taken');
    }).catch(function () { fin(true, 'error'); });
  },

  /* called once the nickname is settled */
  start: function (nick) {
    this.nick = nick; this.k = this.keyOf(nick);
    if (!this.ok || this.started) return;
    this.started = true;
    var self = this, k = this.k;

    var pres = this.ref('pres/' + k);
    pres.onDisconnect().remove();
    this.setStatus('menu');
    /* re-assert presence whenever the socket reconnects */
    try { this.ref('.info/connected').on('value', function (s) { if (s.val()) { pres.onDisconnect().remove(); self.setStatus(self.status || 'menu'); } }); } catch (e) {}

    this.ref('friends/' + k).on('value', function (s) { self.onFriends(s.val() || {}); });
    this.ref('freq/' + k).on('value', function (s) { self.reqs = s.val() || {}; self.ev.emit('reqs'); });
    this.ref('inv/' + k).on('value', function (s) { self.onInbox(s.val() || {}); });
  },

  setStatus: function (st) {
    this.status = st;
    if (!this.ok || !this.k) return;
    this.ref('pres/' + this.k).set({
      nick: this.nick, st: st, r: Meta.rank, sc: Meta.score(), ts: Date.now()
    }).catch(function () {});
  },

  /* ---------------- friends ---------------- */
  presRefs: {},
  onFriends: function (map) {
    var self = this, k;
    for (k in this.presRefs) if (!map[k]) { this.presRefs[k].off(); delete this.presRefs[k]; delete this.friends[k]; }
    for (k in map) {
      if (!this.friends[k]) this.friends[k] = { nick: map[k].nick, on: false };
      this.friends[k].nick = map[k].nick;
      if (!this.presRefs[k]) {
        (function (fk) {
          var r = self.ref('pres/' + fk);
          r.on('value', function (s) {
            var v = s.val(), f = self.friends[fk];
            if (!f) return;
            f.on = !!v; f.st = v ? v.st : ''; f.r = v ? v.r : -1; f.sc = v ? v.sc : 0;
            self.ev.emit('friends');
          });
          self.presRefs[fk] = r;
        })(k);
      }
    }
    this.ev.emit('friends');
  },

  /* look a nickname up; cb(entry|null) */
  lookup: function (nick, cb) {
    if (!this.ok) { cb(null); return; }
    this.ref('nicks/' + this.keyOf(nick)).once('value').then(function (s) { cb(s.val()); })
      .catch(function () { cb(null); });
  },

  friendRequest: function (nick, cb) {
    var self = this;
    nick = String(nick || '').trim();
    if (!this.ok) { cb(false, S('offline')); return; }
    var fk = this.keyOf(nick);
    if (!nick || fk === this.k) { cb(false, S('notSelf')); return; }
    if (this.friends[fk]) { cb(false, S('already')); return; }
    this.lookup(nick, function (e) {
      if (!e) { cb(false, S('noUser')); return; }
      /* if they already asked me, just accept */
      if (self.reqs[fk]) { self.acceptFriend(fk); cb(true, S('nowFriends')); return; }
      self.ref('freq/' + fk + '/' + self.k).set({ nick: self.nick, ts: Date.now() })
        .then(function () { cb(true, S('reqSent')); })
        .catch(function () { cb(false, S('netErr')); });
    });
  },
  acceptFriend: function (fk) {
    var r = this.reqs[fk]; if (!r) return;
    var up = {};
    up['friends/' + this.k + '/' + fk] = { nick: r.nick, ts: Date.now() };
    up['friends/' + fk + '/' + this.k] = { nick: this.nick, ts: Date.now() };
    up['freq/' + this.k + '/' + fk] = null;
    up['freq/' + fk + '/' + this.k] = null;
    this.ref('/').update(up).catch(function () {});
  },
  declineFriend: function (fk) { this.ref('freq/' + this.k + '/' + fk).remove().catch(function () {}); },
  removeFriend: function (fk) {
    var up = {};
    up['friends/' + this.k + '/' + fk] = null;
    up['friends/' + fk + '/' + this.k] = null;
    this.ref('/').update(up).catch(function () {});
  },

  /* ---------------- invites ---------------- */
  /* status of what I sent: wait -> ok | no | time */
  invite: function (nick, cb) {
    var self = this;
    nick = String(nick || '').trim();
    if (!this.ok) { cb(false, S('offline')); return; }
    var tk = this.keyOf(nick);
    if (!nick || tk === this.k) { cb(false, S('notSelf')); return; }
    if (this.room && this.room.host !== this.k) { cb(false, S('hostOnly')); return; }
    if (this.room && this.memberCount() >= PARTY_MAX) { cb(false, S('full')); return; }
    if (this.room && this.room.mem && this.room.mem[tk]) { cb(false, S('inParty')); return; }
    if (this.sent[tk] && this.sent[tk].st === 'wait') { cb(false, S('waiting')); return; }

    this.ref('pres/' + tk).once('value').then(function (s) {
      var p = s.val();
      if (!p) { cb(false, S('notOnline')); return; }
      var go = function () {
        var ts = self.now();
        var data = { nick: self.nick, room: self.roomId, mode: self.room.mode, ts: ts, st: 'wait' };
        self.sent[tk] = { nick: p.nick || nick, st: 'wait', ts: ts, mode: self.room.mode };
        self.ev.emit('sent');
        var node = self.ref('inv/' + tk + '/' + self.k);
        node.set(data).then(function () { cb(true, S('inviting')); }).catch(function () {
          self.sent[tk].st = 'no'; self.ev.emit('sent'); cb(false, S('netErr'));
        });
        var stRef = node.child('st');
        var timer = setTimeout(function () { finish('time'); }, INVITE_MS);
        var finish = function (st) {
          clearTimeout(timer);
          stRef.off();
          if (!self.sent[tk] || self.sent[tk].ts !== ts) return;
          self.sent[tk].st = st;
          self.ev.emit('sent', tk, st);
          node.remove().catch(function () {});
          /* clear the line after a moment */
          setTimeout(function () { if (self.sent[tk] && self.sent[tk].ts === ts) { delete self.sent[tk]; self.ev.emit('sent'); } }, 6000);
        };
        stRef.on('value', function (v) {
          var st = v.val();
          if (st === 'ok' || st === 'no') finish(st);
        });
      };
      if (!self.room) self.createRoom(self.pendingMode || 'coop', go); else go();
    }).catch(function () { cb(false, S('netErr')); });
  },

  onInbox: function (map) {
    var now = this.now(), k, changed = false;
    for (k in map) {
      var v = map[k];
      if (!v || v.st !== 'wait' || now - v.ts > INVITE_MS + 3000) {
        /* stale or already answered: tidy old ones */
        if (v && now - v.ts > INVITE_MS * 2) this.ref('inv/' + this.k + '/' + k).remove().catch(function () {});
        if (this.inbox[k]) { delete this.inbox[k]; changed = true; }
        continue;
      }
      if (!this.inbox[k] || this.inbox[k].ts !== v.ts) { this.inbox[k] = v; changed = true; }
    }
    for (k in this.inbox) if (!map[k]) { delete this.inbox[k]; changed = true; }
    if (changed) this.ev.emit('inbox');
  },
  answer: function (fk, yes, cb) {
    var v = this.inbox[fk];
    delete this.inbox[fk];
    this.ev.emit('inbox');
    if (!v) return;
    var self = this;
    if (!yes) { this.ref('inv/' + this.k + '/' + fk + '/st').set('no').catch(function () {}); return; }
    this.joinRoom(v.room, function (ok, why) {
      self.ref('inv/' + self.k + '/' + fk + '/st').set(ok ? 'ok' : 'no').catch(function () {});
      if (cb) cb(ok, why);
    });
  },

  /* ---------------- rooms ---------------- */
  memberCount: function () { return this.room && this.room.mem ? Object.keys(this.room.mem).length : 0; },
  isHost: function () { return !!(this.room && this.room.host === this.k); },
  inParty: function () { return !!(this.room && this.memberCount() >= 2); },
  myMem: function () {
    return {
      nick: this.nick, skin: Meta.skin, ord: Date.now(),
      up: { hp: Meta.upLv('hp'), dmg: Meta.upLv('dmg'), spd: Meta.upLv('spd'), mag: Meta.upLv('mag') },
      start: Meta.start, eq: Meta.eq || {}, r: Meta.rank
    };
  },
  createRoom: function (mode, cb) {
    var self = this;
    var ref = this.ref('rooms').push();
    var id = ref.key;
    var mem = {}; mem[this.k] = this.myMem(); mem[this.k].team = 'A';
    var room = { host: this.k, mode: mode || 'coop', st: 'lobby', gen: 0, ts: Date.now(), mem: mem };
    ref.onDisconnect().remove();
    ref.set(room).then(function () { if (cb) cb(true); }).catch(function () { if (cb) cb(false); });
    this.watchRoom(id);
    this.room = room;              /* optimistic, so the UI updates at once */
    this.ev.emit('room');
  },
  joinRoom: function (id, cb) {
    var self = this;
    if (!id) { cb(false, S('noRoom')); return; }
    this.ref('rooms/' + id).once('value').then(function (s) {
      var r = s.val();
      if (!r) { cb(false, S('noRoom')); return; }
      if (r.st !== 'lobby') { cb(false, S('playing')); return; }
      if (r.mem && Object.keys(r.mem).length >= PARTY_MAX) { cb(false, S('full')); return; }
      var finishJoin = function () {
        var m = self.myMem();
        /* pick the team with fewer players for duels */
        var a = 0, b = 0;
        for (var q in (r.mem || {})) { if (r.mem[q].team === 'B') b++; else a++; }
        m.team = b < a ? 'B' : 'A';
        var mr = self.ref('rooms/' + id + '/mem/' + self.k);
        mr.onDisconnect().remove();
        mr.set(m).then(function () { self.watchRoom(id); cb(true); })
          .catch(function () { cb(false, S('netErr')); });
      };
      if (self.roomId && self.roomId !== id) self.leaveRoom(true, finishJoin); else finishJoin();

  },
  watchRoom: function (id) {
    var self = this;
    if (this.roomRef) this.roomRef.off();
    this.roomId = id;
    this.roomRef = this.ref('rooms/' + id);
    this.roomRef.on('value', function (s) {
      if (self.roomId !== id) return;
      var r = s.val(), was = self.room;
      if (!r || !r.mem || !r.mem[self.k]) {
        /* room vanished (host left) or I was removed */
        var hostGone = !r && was && was.host !== self.k;
        self.dropRoom();
        if (hostGone) self.ev.emit('hostLeft');
        else if (r && was) self.ev.emit('kicked');
        return;
      }
      self.room = r;
      /* the host left but the room survived (shouldn't happen): leave too */
      if (!r.mem[r.host]) { self.leaveRoom(); self.ev.emit('hostLeft'); return; }
      self.ev.emit('room');
      if (r.st === 'play' && r.host !== self.k && r.gen !== self.lastGen) {
        self.lastGen = r.gen;

      if (was && was.st === 'play' && r.st === 'lobby') self.ev.emit('lobby', r);
    });
  },
  dropRoom: function () {
    if (this.roomRef) this.roomRef.off();
    this.roomRef = null; this.roomId = null; this.room = null;
    this.ev.emit('room');
  },
  leaveRoom: function (quiet, cb) {
    if (!this.roomId) { if (cb) cb(); return; }
    var id = this.roomId, host = this.isHost();
    var p = host ? this.ref('rooms/' + id).remove() : this.ref('rooms/' + id + '/mem/' + this.k).remove();
    if (host) this.ref('rooms/' + id).onDisconnect().cancel();
    else this.ref('rooms/' + id + '/mem/' + this.k).onDisconnect().cancel();
    this.dropRoom();
    p.then(function () { if (cb) cb(); }).catch(function () { if (cb) cb(); });
  },
  kick: function (k) { if (this.isHost() && k !== this.k) this.ref('rooms/' + this.roomId + '/mem/' + k).remove().catch(function () {}); },
  setMode: function (mode) { if (this.isHost()) this.ref('rooms/' + this.roomId + '/mode').set(mode).catch(function () {}); },
  setTeam: function (k, t) { if (this.isHost()) this.ref('rooms/' + this.roomId + '/mem/' + k + '/team').set(t).catch(function () {}); },
  /* refresh my member card (skin / upgrades may have changed in the shop) */
  refreshMe: function () {
    if (!this.roomId || !this.room || !this.room.mem[this.k]) return;
    var m = this.myMem(); m.team = this.room.mem[this.k].team || 'A'; m.ord = this.room.mem[this.k].ord || Date.now();
    this.ref('rooms/' + this.roomId + '/mem/' + this.k).set(m).catch(function () {});
  },
  /* host: everyone in, go */
  startRoom: function (mode) {
    if (!this.isHost()) return 0;
    var gen = (this.room.gen || 0) + 1;
    this.lastGen = gen;
    this.room.st = 'play'; this.room.gen = gen; this.room.mode = mode;
    this.ref('rooms/' + this.roomId).update({ st: 'play', gen: gen, mode: mode, t0: this.now(), g: null, d: null, dg: null })
      .catch(function () {});
    return gen;
  },
  backToLobby: function () {
    if (!this.isHost() || !this.roomId) return;
    this.ref('rooms/' + this.roomId).update({ st: 'lobby', g: null, d: null, dg: null }).catch(function () {});
  },
  /* sorted member list: host first */
  members: function () {
    if (!this.room || !this.room.mem) return [];
    var r = this.room, out = [];
    for (var k in r.mem) { var m = Object.assign({ k: k }, r.mem[k]); out.push(m); }

  /* valid duel teams: 1v1 or 2v1 */
  teamsOk: function () {

  }
};

   5f. SOCIAL UI  —  friends, party, invites (plain HTML over the canvas)
   ---------------------------------------------------------------
   HTML rather than Phaser so Korean typing (IME) works in the ID boxes
   and long lists scroll naturally on phones.
   Invite flow, as asked:
     invite -> "초대 중 (60s countdown)" -> accepted "초대 성공"
                                         -> declined "초대 거절"
                                         -> 60s silence "응답 없음"

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

      Net.ev.on(e, function () { self.refresh(); });

    Net.ev.on('inbox', function () { self.showInvite(); });
    Net.ev.on('reqs', function () {

  /* ---- live "does this ID exist?" check while typing ---- */
  chkLine: function (key) {

  },
  setChk: function (key, m) {
    this.msgs[key] = m;
    var el = this.el(key);
    if (el) { el.className = 'msg ' + (m ? m.c : ''); el.textContent = m ? m.t : ''; }
  },
  liveCheck: function (inputId, key) {
    var self = this, el = this.el(inputId);
    if (!el) return;
    el.addEventListener('input', function () {
      clearTimeout(self.chkT);
      self.msgs.add = null; self.msgs.inv = null;
      var v = el.value.trim();
      if (!v) { self.setChk(key, null); return; }
      self.setChk(key, { c: 'wait', t: S('checking') });
      self.chkT = setTimeout(function () { self.checkId(v, key, inputId); }, 350);
    });
  },
  checkId: function (v, key, inputId) {
    var self = this, k = Net.keyOf(v);
    var still = function () { var el = self.el(inputId); return el && el.value.trim() === v; };
    if (!Net.ok) { this.setChk(key, { c: 'no', t: S('offline') }); return; }
    if (k === Net.k) { this.setChk(key, { c: 'no', t: S('notSelf') }); return; }
    Net.lookup(v, function (e) {
      if (!still()) return;
      if (!e) { self.setChk(key, { c: 'no', t: S('noUser') }); return; }
      Net.ref('pres/' + k).once('value').then(function (s) {
        if (!still()) return;
        var on = !!s.val();
        var extra = key === 'addChk' && Net.friends[k] ? S('already') : (on ? S('online') : S('offlineS'));
        self.setChk(key, { c: on || key === 'addChk' ? 'ok' : 'no', t: S('userOk', { n: e.nick || v, s: extra }) });
      }).catch(function () { if (still()) self.setChk(key, { c: 'ok', t: S('userOk', { n: e.nick || v, s: '' }) }); });
    });
  },

  friendList: function () {
    var out = [];
    for (var k in Net.friends) out.push(Object.assign({ k: k }, Net.friends[k]));
    out.sort(function (a, b) { return (b.on ? 1 : 0) - (a.on ? 1 : 0) || String(a.nick).localeCompare(String(b.nick)); });
    return out;
  },
  pending: function (k) { return Net.sent[k] && Net.sent[k].st === 'wait'; },
  sentLabel: function (k) {
    var s = Net.sent[k];
    if (!s) return '';
    if (s.st === 'wait') {
      var left = Math.max(0, Math.ceil((INVITE_MS - (Net.now() - s.ts)) / 1000));
      return '<span class="st wait" data-cd="' + esc(k) + '">' + esc(S('stWait', { s: left })) + '</span>';
    }

  },
  doInvite: function (nick) {
    var self = this;

    if (!nick) return;
    Net.pendingMode = this.mode;
    this.msgs.inv = { c: 'wait', t: S('inviting') };
    this.refresh();
    Net.invite(nick, function (ok, msg) {
      self.msgs.inv = { c: ok ? 'wait' : 'no', t: msg };

  buildFriends: function (body) {

      '<div class="msg ' + (this.msgs.add ? this.msgs.add.c : '') + '">' + esc(this.msgs.add ? this.msgs.add.t : '') + '</div>';

      if (s) els[i].textContent = S('stWait', { s: Math.max(0, Math.ceil((INVITE_MS - (Net.now() - s.ts)) / 1000)) });
    }
    if (this.cur) {
      var left = INVITE_MS - (Net.now() - this.cur.v.ts);
      var bar = document.querySelector('#invpop .bar i');

  menuReady: function () { this.showInvite(); },
  showInvite: function () {
    var self = this;
    var ks = Object.keys(Net.inbox || {}).filter(function (k) { return Net.now() - Net.inbox[k].ts < INVITE_MS; });
    if (this.cur && !Net.inbox[this.cur.k]) this.hideInvite();
    if (this.cur || !ks.length) return;
    if (!this.menuActive()) {
      /* mid-game: just a heads-up, the invite waits (up to 60s) */
      var k0 = ks[0];
      if (!this.nagged || this.nagged !== k0 + Net.inbox[k0].ts) { this.nagged = k0 + Net.inbox[k0].ts; this.note(S('gotInvite', { n: Net.inbox[k0].nick })); }
      return;
    }
    ks.sort(function (a, b) { return Net.inbox[a].ts - Net.inbox[b].ts; });
    var k = ks[0], v = Net.inbox[k];
    this.cur = { k: k, v: v };
    var pop = this.el('invpop');
    pop.innerHTML = '<div class="t">' + esc(S('invTitle', { n: v.nick })) + '</div>' +
      '<div class="d">' + esc(v.mode === 'duel' ? S('invDuel') : S('invCoop')) + '</div>' +
      '<div class="bar"><i style="width:100%"></i></div>' +
      '<div class="bt"><button style="background:#27ae60" data-y>' + esc(S('acc')) + '</button>' +
      '<button style="background:#7e94a8" data-n>' + esc(S('dec')) + '</button></div>';
    pop.classList.add('on');
    SFX.play('select');
    pop.querySelector('[data-y]').onclick = function () {
      self.hideInvite();
      Net.answer(k, true, function (ok, why) {
        if (ok) { self.note(S('joined')); self.open('party'); }
        else self.note(S('joinFail') + (why ? ' (' + why + ')' : ''));
      });
    };
    pop.querySelector('[data-n]').onclick = function () { self.hideInvite(); Net.answer(k, false); self.showInvite(); };
  },
  hideInvite: function () {
    this.cur = null;
    var pop = this.el('invpop');
    if (pop) { pop.classList.remove('on'); pop.innerHTML = ''; }
  },

  /* ---------------- host starts ---------------- */
  startCoop: function () {
    if (!Net.isHost() || Net.memberCount() < 2) return;
    Net.startRoom('coop');
    this.close();
    Router.go('Game', { party: true });
  },
  startDuel: function () {
    if (!Net.isHost() || !Net.teamsOk()) return;
    Net.startRoom('duel');
    this.close();
    Router.go('Duel');
  }
};

/* switch to a scene from anywhere (used when the host starts a party game) */
var Router = {
  go: function (key, data) {
    var g = window.__game;
    if (!g) return;
    var sm = g.scene;
    ['Menu', 'Game', 'Guest', 'UI', 'Promo', 'Duel', 'DuelUI'].forEach(function (k) {
      if (k !== key && (sm.isActive(k) || sm.isPaused(k) || sm.isSleeping(k))) sm.stop(k);
    });
    sm.start(key, data || {});
  }
};

function MT(k, o) { var t = (M_TXT[LANG] || M_TXT.ko)[k] || M_TXT.ko[k] || k; return o ? fmt(t, o) : t; }
function fmtDate(ts) {
  var d = new Date(ts || 0), p = function (n) { return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '.' + p(d.getMonth() + 1) + '.' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());

var Mail = {
  admin: false, auth: null, notices: {}, mails: {}, inqs: {}, loaded: {},
  ev: new Phaser.Events.EventEmitter(),

  init: function () {
    var self = this;
    this.read = Store.get('mailRead', {});
    try { this.auth = (window.firebase && firebase.auth) ? firebase.auth() : null; } catch (e) { this.auth = null; }
    if (!this.auth) return;
    this.auth.onAuthStateChanged(function (u) {
      var was = self.admin;
      self.admin = !!(u && u.email === ADMIN_EMAIL);
      if (self.admin && !was) self.watchInq();
      if (!self.admin && was) self.unwatchInq();
      self.ev.emit('change');
    });
  },

  /* after the nickname is settled */
  start: function () {
    if (!Net.ok || this.started) return;
    this.started = true;
    var self = this;
    Net.ref('notices').orderByChild('ts').limitToLast(40).on('value', function (s) {
      var v = s.val() || {}, first = !self.loaded.n;
      self.loaded.n = true;
      if (!first) for (var id in v) if (!self.notices[id] && !self.read[id]) {
        Social.note(MT('newNotice', { t: v[id].type === 'update' ? MT('update') : MT('notice'), n: v[id].title }));
      }
      self.notices = v;
      self.ev.emit('change');
    });
    Net.ref('mail/' + Net.k).on('value', function (s) {
      var v = s.val() || {}, first = !self.loaded.m;
      self.loaded.m = true;
      if (!first) for (var id in v) if (!self.mails[id]) { Social.note(MT('newReply')); SFX.play('levelup'); }
      self.mails = v;
      self.ev.emit('change');
    });
  },

  /* inbox entries, newest first */
  items: function () {
    var out = [], id;
    for (id in this.notices) {
      var n = this.notices[id];
      if (n) out.push({ id: id, kind: n.type === 'update' ? 'update' : 'notice', title: n.title, body: n.body, ts: n.ts });
    }
    for (id in this.mails) {
      var m = this.mails[id];
      if (m) out.push({ id: id, kind: 'reply', title: m.title, body: m.body, ts: m.ts, re: m.re });
    }
    out.sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
    return out;
  },
  unread: function () {
    var n = 0, it = this.items();
    for (var i = 0; i < it.length; i++) if (!this.read[it[i].id]) n++;
    return n;
  },
  /* the red number: unread mail, plus unanswered inquiries for the operator */
  badge: function () { return this.unread() + (this.admin ? this.openInq() : 0); },
  markRead: function () {
    var it = this.items(), keep = {};
    for (var i = 0; i < it.length; i++) keep[it[i].id] = 1;     /* drop ids that no longer exist */
    this.read = keep;
    Store.set('mailRead', keep);
    this.ev.emit('change');
  },

  /* ---------------- players ---------------- */
  sendInquiry: function (body, cb) {
    body = String(body || '').trim().slice(0, 500);
    if (!Net.ok) { cb(false, MT('offline')); return; }
    if (body.length < 2) { cb(false, MT('tooShort')); return; }
    var last = Store.get('inqLast', 0);
    if (Date.now() - last < 60000) { cb(false, MT('wait')); return; }
    var ts = Date.now();
    Net.ref('inq/' + Net.k).push({ nick: Meta.nick, body: body, ts: ts }).then(function () {
      Store.set('inqLast', ts);
      var mine = Store.get('myInq', []);
      mine.unshift({ body: body, ts: ts });
      Store.set('myInq', mine.slice(0, 20));
      cb(true, MT('sent'));
    }).catch(function () { cb(false, MT('netErr')); });
  },

  /* ---------------- operator ---------------- */
  login: function (id, pw, code, cb) {
    if (!this.auth) { cb(false, MT('noAuth')); return; }
    if (String(id || '').trim().toLowerCase() !== ADMIN_ID) { cb(false, MT('loginFail')); return; }
    /* Firebase wants 6+ characters, so the password and code are one secret: pw + code */
    this.auth.signInWithEmailAndPassword(ADMIN_EMAIL, String(pw || '') + String(code || ''))
      .then(function () { cb(true, MT('loginOk')); })
      .catch(function () { cb(false, MT('loginFail')); });
  },
  logout: function () { if (this.auth) this.auth.signOut().catch(function () {}); },
  watchInq: function () {
    if (!Net.ok) return;
    var self = this;
    this.inqRef = Net.ref('inq');
    this.inqRef.on('value', function (s) { self.inqs = s.val() || {}; self.ev.emit('change'); },
      function () { self.inqs = {}; });
  },
  unwatchInq: function () { if (this.inqRef) this.inqRef.off(); this.inqRef = null; this.inqs = {}; },
  inqList: function () {
    var out = [];
    for (var k in this.inqs) for (var id in (this.inqs[k] || {})) {
      var q = this.inqs[k][id];
      if (q) out.push({ k: k, id: id, nick: q.nick, body: q.body, ts: q.ts, ans: q.ans || 0 });
    }
    out.sort(function (a, b) { return (a.ans ? 1 : 0) - (b.ans ? 1 : 0) || (b.ts || 0) - (a.ts || 0); });
    return out;
  },
  openInq: function () { return this.inqList().filter(function (q) { return !q.ans; }).length; },
  reply: function (q, body, cb) {
    body = String(body || '').trim().slice(0, 1000);
    if (body.length < 1) { cb(false, MT('tooShort')); return; }
    var ts = Date.now(), id = Net.ref('mail/' + q.k).push().key, up = {};
    up['mail/' + q.k + '/' + id] = { title: MT('replyTitle'), body: body, ts: ts, re: String(q.body || '').slice(0, 120) };
    up['inq/' + q.k + '/' + q.id + '/ans'] = ts;
    Net.ref('/').update(up).then(function () { cb(true, MT('replied')); }).catch(function () { cb(false, MT('netErr')); });
  },
  delInq: function (q) { Net.ref('inq/' + q.k + '/' + q.id).remove().catch(function () {}); },
  broadcast: function (type, title, body, cb) {
    title = String(title || '').trim().slice(0, 60); body = String(body || '').trim().slice(0, 2000);
    if (!title || !body) { cb(false, MT('needTitle')); return; }
    Net.ref('notices').push({ type: type === 'update' ? 'update' : 'notice', title: title, body: body, ts: Date.now() })
      .then(function () { cb(true, MT('sentAll')); }).catch(function () { cb(false, MT('netErr')); });
  },
  delNotice: function (id) { Net.ref('notices/' + id).remove().catch(function () {}); }
};
