    }
  },

  showGameOver: function (d) {
    var self = this, gs = this.gs;
    this.closeOverlay();
    var pw = Math.min(360, this.scale.width - 28);
    var party = !!d.party;
    var ph = party ? 330 : (d.canRevive ? 430 : 372), top = -ph / 2;
    var c = this.dialog(pw, ph, 0.72);
    c.add(txt(this, 0, top + 42, d.wiped ? TXT.allDead : TXT.gameover, 32, CS.red).setOrigin(0.5));
    if (d.isBest) c.add(txt(this, 0, top + 78, TXT.newbest, 14, CS.gold).setOrigin(0.5));
    c.add(txt(this, 0, top + 98, '◆ +' + (d.sap || 0).toLocaleString() +
      (d.lvUp ? '    ' + TXT.accLv + ' ' + (d.lvUp < 0 ? '-1' : '+' + d.lvUp) : ''), 14, CS.gem, '900').setOrigin(0.5));
    this.statsBlock(c, top + 100, pw, d);
    var by = top + 250 + (d.canRevive ? 10 : 0);
    if (party) {
      c.add(makeButton(this, 0, by + 20, pw - 60, 52, TXT.toLobby, function () {
        self.closeOverlay(); gs.quitToMenu();
      }, { color: C.cyan }));
      return;
    }
    if (d.canRevive) {
      c.add(makeButton(this, 0, by, pw - 60, 52, TXT.revive, function () {
        self.closeOverlay();
        CG.rewarded(function () { gs.revive(); },
          function () { self.showGameOver(d); self.showToast(TXT.adFail, 1800); });
      }, { color: C.gold, textColor: '#16324a' }));
      by += 60;
    }
    c.add(makeButton(this, 0, by, pw - 60, 50, TXT.again, function () { self.closeOverlay(); gs.restartRun(); }, { color: C.cyan }));
    c.add(makeButton(this, 0, by + 56, pw - 60, 44, TXT.menu, function () { self.closeOverlay(); gs.quitToMenu(); }, { color: 0x7e94a8 }));
  },

  showVictory: function (d) {
    var self = this, gs = this.gs;
    this.closeOverlay();
    var pw = Math.min(360, this.scale.width - 28), ph = 392, top = -ph / 2;
    var c = this.dialog(pw, ph, 0.72);
    c.add(txt(this, 0, top + 44, TXT.victory, 30, CS.green).setOrigin(0.5));
    if (d.isBest) c.add(txt(this, 0, top + 80, TXT.newbest, 14, CS.gold).setOrigin(0.5));
    c.add(txt(this, 0, top + 100, '◆ +' + (d.sap || 0).toLocaleString() +
      (d.lvUp ? '    ' + TXT.accLv + ' ' + (d.lvUp < 0 ? '-1' : '+' + d.lvUp) : ''), 14, CS.gem, '900').setOrigin(0.5));
    this.statsBlock(c, top + 104, pw, d);
    var by = top + 268;
    if (d.party && !d.host) {
      c.add(txt(this, 0, by - 4, TXT.waitHost, 14, CS.dim, '900').setOrigin(0.5));
      c.add(makeButton(this, 0, by + 52, pw - 60, 46, TXT.toLobby, function () { self.closeOverlay(); gs.quitToMenu(); },
        { color: 0x7e94a8 }));
      return;
    }
    c.add(makeButton(this, 0, by, pw - 60, 52, TXT.endless, function () { self.closeOverlay(); gs.goEndless(); }, { color: C.cyan }));
    c.add(makeButton(this, 0, by + 60, pw - 60, 46, d.party ? TXT.toLobby : TXT.again, function () {
      self.closeOverlay(); if (d.party) gs.quitToMenu(); else gs.restartRun();
    }, { color: 0x7e94a8 }));
  }
});

/* =====================================================================
   17. LAUNCH
   ===================================================================== */
var config = {
  type: /[?&]canvas=1/.test(location.search) ? Phaser.CANVAS : Phaser.AUTO,
  parent: 'game',
  backgroundColor: '#dce8f1',
  scale: {
    mode: Phaser.Scale.RESIZE,
    autoCenter: Phaser.Scale.CENTER_BOTH,
    width: window.innerWidth,
    height: window.innerHeight
  },
  render: { antialias: true, roundPixels: true, powerPreference: 'high-performance' },
  /* tests run in a slow headless browser: use real frame time there */
  fps: { smoothStep: !/[?&]test=1/.test(location.search) },
  physics: {
    default: 'arcade',
    arcade: { gravity: { x: 0, y: 0 }, debug: false, fps: 60 }
  },
  scene: [BootScene, MenuScene, GameScene, GuestScene, UIScene, PromoScene, DuelScene, DuelUIScene]
};

/* =====================================================================
   18. NICKNAME GATE
   Shown once, before the engine starts. Kept in HTML rather than Phaser
   so that Korean IME composition works properly on every device.
   ===================================================================== */
var NICK_RE = /^[A-Za-z0-9_\uac00-\ud7a3\u3131-\u318e]{2,12}$/;

/* test hook (only with ?test=1 in the URL) */
if (/[?&]test=1/.test(location.search)) window.__T = { Meta: Meta, Net: Net, Social: Social, Router: Router, Store: Store, Mail: Mail, Mailbox: Mailbox };

function startGame() {
  if (window.__game) return;
  Net.start(Meta.nick);
  Social.init();
  Mail.start();
  window.__game = new Phaser.Game(config);
}

(function nickGate() {
  var wrap = document.getElementById('nickwrap');
  var input = document.getElementById('nickin');
  var okBtn = document.getElementById('nickok');
  var err = document.getElementById('nickerr');

  document.getElementById('nicktitle').textContent = TXT.nickTitle;
  document.getElementById('nicksub').textContent = TXT.nickSub;
  okBtn.textContent = TXT.nickStart;

  var showGate = function (msg) {
    wrap.classList.add('on');
    if (msg) err.textContent = msg;
    setTimeout(function () { input.focus(); }, 120);
  };

  if (Meta.nick) {
    /* already chosen: make sure nobody else owns it (names are unique now) */
    Net.claim(Meta.nick, function (ok, why) {
      if (!ok && why === 'taken') { Meta.nick = ''; Meta.save(); showGate(TXT.nickTaken); return; }
      startGame();
    });
    return;
  }
  showGate();

  var busy = false, adminMode = false;
  var adf = document.getElementById('adf'), admLink = document.getElementById('admLink');
  document.getElementById('adId').placeholder = MT('id');
  document.getElementById('adPw').placeholder = MT('pw');
  document.getElementById('adCode').placeholder = MT('code');
  var setMode = function (on) {
    adminMode = on;
    adf.style.display = on ? 'block' : 'none';
    input.style.display = on ? 'none' : '';
    document.getElementById('nicktitle').textContent = on ? MT('adminLogin') : TXT.nickTitle;
    document.getElementById('nicksub').textContent = on ? '' : TXT.nickSub;
    okBtn.textContent = on ? MT('login') : TXT.nickStart;
    admLink.textContent = on ? TXT.nickTitle : MT('adminLogin');
    err.textContent = '';
  };
  setMode(false);
  admLink.addEventListener('click', function () { setMode(!adminMode); });

  /* operator: sign in, then play as "chk" */
  var adminSubmit = function () {
    busy = true; okBtn.disabled = true;
    Mail.login(document.getElementById('adId').value, document.getElementById('adPw').value,
      document.getElementById('adCode').value, function (ok, msg) {
        if (!ok) { busy = false; okBtn.disabled = false; err.textContent = msg; return; }
        Net.claim(ADMIN_ID, function () {
          busy = false; okBtn.disabled = false;
          Meta.nick = ADMIN_ID; Meta.save();
          wrap.classList.remove('on');
          startGame();
        });
      });
  };

  var submit = function () {
    if (busy) return;
    if (adminMode) { adminSubmit(); return; }
    var v = (input.value || '').trim();
    if (v.length < 2 || v.length > 12) { err.textContent = TXT.nickShort; return; }
    if (!NICK_RE.test(v)) { err.textContent = TXT.nickBad; return; }
    if (v.toLowerCase() === ADMIN_ID) { err.textContent = TXT.nickTaken; return; }   /* reserved for the operator */
    busy = true; okBtn.disabled = true;
    Net.claim(v, function (ok, why) {
      busy = false; okBtn.disabled = false;
      if (!ok) { err.textContent = TXT.nickTaken; return; }
      Meta.nick = v;
      Meta.save();
      wrap.classList.remove('on');
      startGame();
    });
  };

  okBtn.addEventListener('click', submit);
  ['adId', 'adPw', 'adCode'].forEach(function (id) {
    document.getElementById(id).addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.isComposing) submit(); });
  });
  input.addEventListener('keydown', function (e) {
    /* ignore Enter while an IME is still composing the character */
    if (e.key === 'Enter' && !e.isComposing) submit();
  });
  input.addEventListener('input', function () { err.textContent = ''; });
})();


/* keep the canvas honest on mobile browser-chrome resize */
window.addEventListener('orientationchange', function () {
  setTimeout(function () { if (window.__game) window.__game.scale.refresh(); }, 220);
});
/* pause audio when the tab loses focus (CrazyGames requirement) */
document.addEventListener('visibilitychange', function () {
  if (document.hidden) SFX.duck(true); else SFX.duck(false);
});


})();
</script>
